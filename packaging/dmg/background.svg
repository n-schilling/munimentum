<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8ef7"/><stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="720" height="460" fill="url(#paper)"/>

  <!-- wordmark -->
  <svg x="40" y="28" width="46" height="46" viewBox="0 0 1024 1024">
    <rect width="1024" height="1024" rx="229" fill="#000"/>
    <rect x="196" y="330" width="632" height="158" rx="34" fill="#fff"/>
    <rect x="246" y="500" width="532" height="300" rx="34" fill="#ededed"/>
    <rect x="430" y="596" width="164" height="44" rx="22" fill="#2f6fed"/>
  </svg>
  <text x="100" y="52" font-size="28" font-weight="600" fill="#1b1f24">Munimentum</text>
  <text x="100" y="72" font-size="14" fill="#5b6570">Your Microsoft 365 data, kept where you can reach it.</text>

  <!-- stage: the two icons sit on this panel -->
  <rect x="40" y="98" width="640" height="238" rx="18" fill="url(#blue)"/>
  <text x="360" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">To install, drag Munimentum onto the Applications folder</text>
  <path d="M 296 216 H 414" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 398 198 L 420 216 L 398 234" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- what you are installing -->
  <g font-size="13" fill="#1b1f24">
    <circle cx="52" cy="367" r="4" fill="#2f6fed"/>
    <text x="66" y="371">Teams, mail, calendar, contacts, OneDrive, SharePoint and Planner – exported and searchable offline.</text>
    <circle cx="52" cy="393" r="4" fill="#2f6fed"/>
    <text x="66" y="397">Everything stays on this Mac: no account, no cloud service, no telemetry.</text>
    <circle cx="52" cy="419" r="4" fill="#2f6fed"/>
    <text x="66" y="423">Searchable with your favorite AI via MCP.</text>
  </g>
  <text x="680" y="449" text-anchor="end" font-size="11" fill="#9aa4ae">Free and open source · munimentum.cc</text>
</svg>
