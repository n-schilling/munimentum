[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, B = bugbear, UP = pyupgrade
select = ["E", "W", "F", "B", "UP"]
# Zeilenlänge wird nicht erzwungen (gewachsener Stil, viele lange deutsche Strings)
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
# packaging/ ist Werkzeug für den Build, kein ausgelieferter Code: smoke_test.py
# testet ein fertiges Bündel und läuft daher nur in der Build-Pipeline, nie unter
# pytest. Mitzuzählen hieße, die Quote um totes Gewicht zu drücken.
omit = ["tests/*", "packaging/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
# Stand bei Einführung: 83 % (nur Quellmodule, ohne tests/) – Puffer gegen Erosion
fail_under = 80
