name: Build

# Baut die fertige App für macOS, Windows und Linux.
#
#   Push auf main / manuell  → Dateien hängen als Artifact am Lauf
#   Tag "v*"                 → zusätzlich ein GitHub-Release mit denselben Dateien
#
# Jedes Bündel durchläuft vorher packaging/smoke_test.py: startet die App,
# baut einen Index (die gebündelte Datei ruft sich dafür selbst auf), sucht
# darin und startet den MCP-Server. Ein Bündel, in dem eine Abhängigkeit fehlt,
# kommt damit gar nicht erst in ein Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.ziel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            ziel: macos-arm64
            exe: dist/Munimentum.app/Contents/MacOS/Munimentum
          # macos-13 ist seit Dezember 2025 abgeschaltet – Jobs darauf warten
          # ewig auf einen Runner, den es nicht mehr gibt. macos-15-intel ist
          # der Ersatz und läuft bis August 2027; danach gibt es bei GitHub
          # kein x86_64-macOS mehr und diese Zeile entfällt ersatzlos.
          - os: macos-15-intel    # Intel
            ziel: macos-x86_64
            exe: dist/Munimentum.app/Contents/MacOS/Munimentum
          - os: windows-latest
            ziel: windows-x64
            exe: dist/Munimentum/Munimentum.exe
          - os: ubuntu-22.04      # ältere glibc = läuft auch auf neueren Systemen
            ziel: linux-x64
            exe: dist/Munimentum/Munimentum

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Version prüfen
        # Bei einem Tag muss version.py dieselbe Zahl tragen. Sonst meldete die
        # App eine andere Version als der Download – und die eingebaute
        # Aktualisierungsprüfung riete dauerhaft zum Update auf sich selbst.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          datei=$(python -c "import version; print(version.VERSION)")
          tag="${GITHUB_REF_NAME#v}"
          echo "version.py: $datei · Tag: $tag"
          test "$datei" = "$tag" || {
            echo "::error::version.py sagt $datei, der Tag sagt $tag"; exit 1; }

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-build.txt

      # Nur bei Tag-Läufen: dann kommt das Zertifikat auf den Runner, dann
      # kostet die Beglaubigung Wartezeit. Pushes auf main bauen unsigniert.
      - name: Zertifikat einspielen (macOS)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p bauen build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p bauen build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Ohne diese Zeile fragt codesign nach dem Schlüsselbund-Passwort und
          # der Lauf hängt bis zum Zeitlimit.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k bauen build.keychain
          rm cert.p12
          security find-identity -v -p codesigning

      - name: Bündel bauen
        # Die Spec signiert mit, sobald MACOS_SIGN_IDENTITY gesetzt ist – leer
        # außerhalb von Tag-Läufen, dann baut sie unsigniert wie bisher.
        env:
          MACOS_SIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: pyinstaller packaging/app.spec --noconfirm

      - name: Rauchtest
        run: python packaging/smoke_test.py "${{ matrix.exe }}"

      # Reihenfolge: erst die App heften, dann daraus das DMG bauen. Wer das
      # Ticket später anheftet, hat es nur am DMG – und wer die App herauszieht,
      # bekommt ohne Netz wieder eine Warnung.
      - name: App beglaubigen und heften (macOS)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/v')
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY_P8" | base64 --decode > key.p8
          ditto -c -k --keepParent "dist/Munimentum.app" pruefling.zip
          xcrun notarytool submit pruefling.zip \
            --key key.p8 --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "dist/Munimentum.app"
          rm pruefling.zip
          # Lieber hier abbrechen als ein Bündel ausliefern, das beim Anwender
          # trotzdem die Warnung zeigt.
          codesign --verify --strict --verbose=2 "dist/Munimentum.app"
          xcrun stapler validate "dist/Munimentum.app"
          spctl -a -t exec -vvv "dist/Munimentum.app"

      - name: Packen (macOS)
        if: startsWith(matrix.os, 'macos')
        # DMG statt ZIP. Die .app enthält 36 Symlinks, die zwischen
        # Contents/Resources und Contents/Frameworks in beide Richtungen zeigen
        # – so baut PyInstaller ein macOS-Bündel. Ein ZIP kann das abbilden,
        # aber jeder Entpacker muss es richtig machen, und das Archivierungs-
        # programm von macOS tut es nicht zuverlässig: es brach mit „size of the
        # extracted file does not match" ab und hinterließ eine App, der die
        # Verweise fehlten. Beim DMG wird gar nicht entpackt – Doppelklick hängt
        # es ein, der Finder kopiert, Symlinks bleiben.
        run: |
          mkdir -p dmg
          cp -R "dist/Munimentum.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Munimentum" -srcfolder dmg \
            -ov -format UDZO -quiet "Munimentum-${{ matrix.ziel }}.dmg"

      - name: DMG signieren, beglaubigen und heften (macOS)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          dmg="Munimentum-${{ matrix.ziel }}.dmg"
          codesign --sign "$MACOS_SIGN_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --key key.p8 --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          rm key.p8
          # Danach wird an der Datei nichts mehr angefasst – jede Änderung,
          # auch Umpacken, macht die Signatur ungültig.
          spctl -a -t open --context context:primary-signature -vv "$dmg"

      - name: Rauchtest am fertigen DMG (macOS)
        if: startsWith(matrix.os, 'macos')
        # Der Rauchtest oben lief auf dem Baumverzeichnis. Dieser läuft auf dem,
        # was der Nutzer wirklich bekommt: einhängen, herauskopieren wie ein
        # Finder-Zug nach „Programme", dort starten. Genau der Schritt, an dem
        # es mit dem ZIP scheiterte.
        run: |
          hdiutil attach "Munimentum-${{ matrix.ziel }}.dmg" \
            -nobrowse -readonly -mountpoint /tmp/m365
          mkdir -p geprueft
          cp -R "/tmp/m365/Munimentum.app" geprueft/
          hdiutil detach /tmp/m365 -quiet
          tot=$(find geprueft/Munimentum.app -type l ! -exec test -e {} \; -print | head -5)
          test -z "$tot" || { echo "::error::Tote Symlinks nach dem Kopieren:"; echo "$tot"; exit 1; }
          # --beglaubigt: hier ist das Ticket schon angeheftet, hier muss es
          # halten. Bei unsignierten Läufen auf main greift der Schalter nicht.
          python packaging/smoke_test.py \
            "geprueft/Munimentum.app/Contents/MacOS/Munimentum" --beglaubigt

      - name: Packen (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: Compress-Archive -Path "dist/Munimentum" -DestinationPath "Munimentum-${{ matrix.ziel }}.zip"

      - name: Packen (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: tar -czf "Munimentum-${{ matrix.ziel }}.tar.gz" -C dist "Munimentum"

      - uses: actions/upload-artifact@v7
        with:
          # Bewusst NICHT wie die Datei darin benannt. GitHub packt jedes
          # Artefakt noch einmal in ein ZIP; hießen beide gleich, wollte das
          # Archivierungsprogramm beim Doppelklick eine Datei neben das Archiv
          # legen, die genau so heißt wie das Archiv selbst. Heraus kommt dann
          # "… 2.zip" statt der App – das sieht nach kaputtem Download aus.
          # Die Namen der Release-Dateien ändert das nicht: die stammen aus den
          # Dateien im Artefakt, nicht aus dessen Namen.
          name: bundle-${{ matrix.ziel }}
          path: |
            Munimentum-${{ matrix.ziel }}.dmg
            Munimentum-${{ matrix.ziel }}.zip
            Munimentum-${{ matrix.ziel }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # nötig, um das Release anzulegen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: pakete
          merge-multiple: true

      - name: Prüfsummen
        run: |
          cd pakete
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pakete/* \
            --title "Munimentum $GITHUB_REF_NAME" \
            --notes-file .github/release-hinweise.md
