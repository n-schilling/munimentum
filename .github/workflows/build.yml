name: Build

# Builds the finished app for macOS, Windows and Linux.
#
#   Push to main / manual    → files are attached to the run as an artifact
#   Tag "v*"                 → additionally a GitHub release with the same files
#
# Every bundle first goes through packaging/smoke_test.py: it starts the app,
# builds an index (the bundled binary calls itself for that), searches it and
# starts the MCP server. A bundle with a missing dependency never makes it
# into a release this way.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.ziel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            ziel: macos-arm64
            exe: dist/Munimentum.app/Contents/MacOS/Munimentum
          - os: windows-latest
            ziel: windows-x64
            exe: dist/Munimentum/Munimentum.exe
          - os: ubuntu-22.04      # older glibc = also runs on newer systems
            ziel: linux-x64
            exe: dist/Munimentum/Munimentum

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check version
        # On a tag, version.py must carry the same number. Otherwise the app
        # would report a different version than the download – and the built-in
        # update check would keep recommending an update to itself.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          datei=$(python -c "import version; print(version.VERSION)")
          tag="${GITHUB_REF_NAME#v}"
          echo "version.py: $datei · Tag: $tag"
          test "$datei" = "$tag" || {
            echo "::error::version.py says $datei, the tag says $tag"; exit 1; }

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      # Tag runs only: that is when the certificate goes onto the runner and
      # when notarization costs waiting time. Pushes to main build unsigned.
      - name: Import certificate (macOS)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p bauen build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p bauen build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Without this line codesign prompts for the keychain password and
          # the run hangs until the timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k bauen build.keychain
          rm cert.p12
          security find-identity -v -p codesigning

      - name: Build bundle
        # The spec signs as soon as MACOS_SIGN_IDENTITY is set – empty outside
        # tag runs, in which case it builds unsigned as before.
        env:
          MACOS_SIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: pyinstaller packaging/app.spec --noconfirm

      - name: Smoke test
        run: python packaging/smoke_test.py "${{ matrix.exe }}"

      # Order matters: staple the app first, then build the DMG from it. Staple
      # the ticket later and it is only on the DMG – and whoever drags the app
      # out gets the warning again when offline.
      - name: Notarize and staple app (macOS)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/v')
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY_P8" | base64 --decode > key.p8
          ditto -c -k --keepParent "dist/Munimentum.app" pruefling.zip
          xcrun notarytool submit pruefling.zip \
            --key key.p8 --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "dist/Munimentum.app"
          rm pruefling.zip
          # Better to fail here than to ship a bundle that still shows the
          # warning on the user's machine.
          codesign --verify --strict --verbose=2 "dist/Munimentum.app"
          xcrun stapler validate "dist/Munimentum.app"
          spctl -a -t exec -vvv "dist/Munimentum.app"

      - name: Package (macOS)
        if: startsWith(matrix.os, 'macos')
        # DMG instead of ZIP. The .app contains 36 symlinks pointing between
        # Contents/Resources and Contents/Frameworks in both directions – that
        # is how PyInstaller builds a macOS bundle. A ZIP can represent that,
        # but every unarchiver has to get it right, and macOS Archive Utility
        # does not do so reliably: it aborted with "size of the extracted file
        # does not match" and left behind an app missing its links. A DMG is
        # never unpacked at all – double-click mounts it, the Finder copies,
        # symlinks survive.
        #
        # dmgbuild lays the window out (packaging/dmg/layout.py): background
        # picture with the instructions, the app on the left, the
        # Applications link on the right – so the window says what to do
        # instead of showing two bare icons.
        run: |
          dmgbuild -s packaging/dmg/layout.py -D app=dist/Munimentum.app \
            "Munimentum" "Munimentum-${{ matrix.ziel }}.dmg"

      - name: Sign, notarize and staple DMG (macOS)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          dmg="Munimentum-${{ matrix.ziel }}.dmg"
          codesign --sign "$MACOS_SIGN_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --key key.p8 --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          rm key.p8
          # Nothing touches the file after this – any change, repacking
          # included, invalidates the signature.
          spctl -a -t open --context context:primary-signature -vv "$dmg"

      - name: Smoke test on the finished DMG (macOS)
        if: startsWith(matrix.os, 'macos')
        # The smoke test above ran on the build tree. This one runs on what the
        # user actually gets: mount, copy out like a Finder drag to
        # "Applications", launch from there. Exactly the step at which the ZIP
        # failed.
        run: |
          hdiutil attach "Munimentum-${{ matrix.ziel }}.dmg" \
            -nobrowse -readonly -mountpoint /tmp/m365
          mkdir -p geprueft
          cp -R "/tmp/m365/Munimentum.app" geprueft/
          hdiutil detach /tmp/m365 -quiet
          tot=$(find geprueft/Munimentum.app -type l ! -exec test -e {} \; -print | head -5)
          test -z "$tot" || { echo "::error::Dead symlinks after copying:"; echo "$tot"; exit 1; }
          # --beglaubigt: the ticket is already stapled here, so here it has to
          # hold. On unsigned runs on main the flag does nothing.
          python packaging/smoke_test.py \
            "geprueft/Munimentum.app/Contents/MacOS/Munimentum" --beglaubigt

      - name: Package (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: Compress-Archive -Path "dist/Munimentum" -DestinationPath "Munimentum-${{ matrix.ziel }}.zip"

      - name: Package (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: tar -czf "Munimentum-${{ matrix.ziel }}.tar.gz" -C dist "Munimentum"

      - uses: actions/upload-artifact@v7
        with:
          # Deliberately NOT named like the file inside. GitHub wraps every
          # artifact in another ZIP; if both had the same name, Archive Utility
          # would try on double-click to place a file next to the archive that
          # is named exactly like the archive itself. The result is "… 2.zip"
          # instead of the app – which looks like a broken download.
          # This does not change the release file names: those come from the
          # files inside the artifact, not from its name.
          name: bundle-${{ matrix.ziel }}
          path: |
            Munimentum-${{ matrix.ziel }}.dmg
            Munimentum-${{ matrix.ziel }}.zip
            Munimentum-${{ matrix.ziel }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # needed to create the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: pakete
          merge-multiple: true

      - name: Checksums
        run: |
          cd pakete
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pakete/* \
            --title "Munimentum $GITHUB_REF_NAME" \
            --notes-file .github/release-hinweise.md
