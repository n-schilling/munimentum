name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Beide Enden der zugesagten Spanne: 3.11 ist die im README genannte
        # Untergrenze, 3.13 der aktuelle Stand. Ohne die 3.11-Zeile fällt es
        # nicht auf, wenn ein Pin die Untergrenze faktisch anhebt (numpy 2.5
        # verlangt 3.12) – genau das war schon einmal der Fall.
        python-version: ["3.11", "3.13"]
    name: checks (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Exakte Pins – siehe requirements.txt / requirements-dev.txt.
        # Nichts hier direkt installieren: sonst laufen CI und lokal auseinander.
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest + coverage)
        run: coverage run -m pytest -v

      - name: Coverage report
        # Erst die Zusammenfassung schreiben, dann das Gate durchsetzen:
        # fail_under steht in pyproject.toml ([tool.coverage.report])
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          coverage report
