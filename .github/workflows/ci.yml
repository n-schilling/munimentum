name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the promised range: 3.12 is the lower bound named in the
        # README, 3.13 the current release. The lower line is what keeps that
        # promise honest: without it, some dependency eventually raises the
        # bar, everything stays green, and nobody notices until someone
        # complains. That is exactly what already happened with numpy 2.5.
        python-version: ["3.12", "3.13"]
    name: checks (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Exact pins – see requirements.txt / requirements-dev.txt.
        # Install nothing directly here: otherwise CI and local drift apart.
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest + coverage)
        run: coverage run -m pytest -v

      - name: Coverage report
        # Write the summary first, then enforce the gate:
        # fail_under lives in pyproject.toml ([tool.coverage.report])
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          coverage report
