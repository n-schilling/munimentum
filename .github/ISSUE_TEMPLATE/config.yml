# Blank issues stay allowed: "Report a problem" in the app opens the classic
# editor with a prefilled report (?title=&body=), not a form. Without
# blank_issues_enabled that path would land in the template chooser.
blank_issues_enabled: true
contact_links:
  - name: Security issue
    url: https://github.com/n-schilling/munimentum/security/advisories/new
    about: Please report security issues privately, not as a public issue.
