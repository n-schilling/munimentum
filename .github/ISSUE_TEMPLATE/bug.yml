# Die Feld-IDs (what, system, log) sind ein Vertrag mit der App: "Report a
# problem" befüllt genau sie über die Adresse vor (app.py, berichtAdresse).
# Umbenennen heißt, dass ältere App-Versionen im leeren Formular landen.
name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **The fastest report comes from the app itself:** *Report a problem*
        (log bar, bottom right) fills in everything this form asks for —
        version, OS, log, changed settings — and shows you the text before
        anything is sent. Use this form when the app will not start, or when
        you noticed the problem later.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: >
        What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System
      description: >
        The same block the app's report carries: version, operating system,
        bundle or from source — and whatever else applies: Python version,
        what the index holds, Ollama on or off, changed settings.
        *Settings* shows most of it.
      placeholder: |
        Version: 5.4.0 (bundle)
        OS: macOS 15 (Apple Silicon)
        Index: 250k chunks, hybrid
        Ollama: running, model loaded
      render: text
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: Last actions (UI userflow)
      description: >
        What was done last in the app, newest at the bottom. The app's report
        fills this in — action types only, never content.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: >
        Copy from the log bar (the last lines are the interesting ones).
        Please check for names, addresses and folder names before posting —
        this form does not redact anything.
      render: text
