# Dependabot – updates as pull requests, not as surprises.
#
# Two ecosystems are involved here:
#   pip             the three requirements files (runtime, tests, bundle build)
#   github-actions  the actions in .github/workflows/
#
# Why grouped rather than one PR per package: every update triggers CI and
# three bundle builds. One combined PR per week keeps that within bounds and is
# easier to judge than a dozen individual changes.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    labels: [dependencies]
    groups:
      # Small bumps together: they rarely break anything and reviewing them
      # one by one is not worth it.
      patch-und-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
