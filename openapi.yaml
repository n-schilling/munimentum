    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Cases, GET]
      operationId: v1CaseNewHits
      summary: What the case's searches find today
      description: |
        Per saved search attached to this case: the hits it finds now that
        the case does not hold yet (up to 200 per search, `new_count` says
        how many there are). What was taken out of the case by hand is
        not offered again. Nothing is stored – this is a look, not a
        change; `collect` is the change.
      x-needs-index: true
      responses:
        "200":
          description: One block per attached search.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  case: { type: object, properties: { id: { type: integer }, name: { type: string } } }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: "The saved search." }
                        name: { type: string }
                        new: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                        new_count: { type: integer }
                        folder: { type: [integer, "null"], description: "Where its new hits would file." }
                        folder_name: { type: [string, "null"] }
                        error: { type: string, description: "This search cannot run – the rest still answer." }
        "404": { $ref: "#/components/responses/NoCase" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/cases/{id}/collect:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Cases, POST]
      operationId: v1CollectCase
      summary: Run the case's automatic searches now
      x-starts-run: true
      description: |
        A run of one step (`case_collect`): every search of this case
        switched to `auto` runs against the index and files what the case
        does not hold yet into its folder, marked `via: auto` with the
        search that found it – what every run that updates the index does
        by itself. With `search`, that one attached search runs, switched
        on or not: a one-off. Only a text search collects; what was taken
        out of the case by hand stays out.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search: { type: [integer, "null"], description: "One attached saved search instead of every automatic one." }
            example: { search: 5 }
      responses:
        "202":
          description: The run is on; `run` and `Location` name where to watch it.
          headers:
            Location: { schema: { type: string }, description: "/api/v1/runs/current" }
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { type: string, description: "/api/v1/runs/current" }
        "400":
          description: A `search` that is no id (srv.search.badsearch), or one that is not a text search (srv.search.auto.text).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No such case (srv.case.unknown), or the search is not attached to it (srv.search.notincase).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: The case is closed (srv.case.closed), it has no automatic search and none was named (srv.case.noauto), or a run is already on (srv.busy).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

