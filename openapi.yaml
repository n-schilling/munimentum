  /api/v1/search:
    get:
      tags: [Explore, GET]
      operationId: v1Search
      x-needs-index: true
      summary: Search the archive
      description: |
        The same engine and the same filters as the interface's own search, paged the
        way the rest of the API pages: `limit` and `offset`. There is no
        total – it would mean ranking the whole archive – so `has_more`
        says whether another page follows.

        `mail_from`, `mail_to`, `mail_cc` and `mail_bcc` mean mail: an
        appointment, a file or a chat has no such line, so with one of them
        set nothing but mail answers, whatever `source` says.
        `/api/v1/addresses` lists what stands in each of them.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Query text; empty browses by filter alone." }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: person, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Source" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: folder, in: query, schema: { type: string } }
        - { name: filetype, in: query, schema: { type: string } }
        - { name: case, in: query, schema: { type: integer } }
        - { name: case_folder, in: query, schema: { type: integer } }
        - { name: party, in: query, schema: { type: string, enum: [all, internal, external] } }
        - { name: mail_from, in: query, schema: { type: string }, description: "Name or address in a mail's From line; `*` is the wildcard. Needs an index that carries the lines (`mail_lines` in the store's features), else 409." }
        - { name: mail_to, in: query, schema: { type: string }, description: "The same for the To line." }
        - { name: mail_cc, in: query, schema: { type: string }, description: "The same for Cc." }
        - { name: mail_bcc, in: query, schema: { type: string }, description: "The same for Bcc – which only mail the user sent themselves carries." }
        - { name: gone, in: query, schema: { type: string }, description: "1/true/ja: only tombstoned items." }
        - { name: attachments, in: query, schema: { type: string }, description: "1/true/ja: only items with an attachment – a mail's real ones (inline images do not count), the files a card or a page refers to; the hit's `attachments` names them. The page offers it for mail." }
        - name: mode
          in: query
          description: |
            How to rank. `auto` decides by the question, `lexical` finds
            the words that occur, `semantic` related wording, `hybrid`
            both. The three names a saved search stores – `text`,
            `aehnlich`, `ki` – are taken as well and mean `lexical`,
            `semantic`, `hybrid`, so a stored criteria set can be handed
            back here unchanged.
          schema:
            type: string
            default: auto
            enum: [auto, hybrid, semantic, lexical, text, aehnlich, ki]
        - { name: remember, in: query, schema: { type: string }, description: "1/true/yes/ja: file this search in the search history (criteria only, never hits) and, with `saved`, stamp that saved search as run. Off unless asked for – the history is the page's, and a script paging through the archive has no business filling it. The page asks for it." }
        - { name: saved, in: query, schema: { type: integer }, description: "Id of the saved search being run; counts only together with `remember`." }
      responses:
        "200":
          description: One page of hits.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                  limit: { type: integer }
                  offset: { type: integer }
                  has_more: { type: boolean, description: "Whether a page follows – the engine is asked for one hit more than the page holds." }
                  backend: { type: string, description: "bm25, semantic or hybrid – what actually ranked." }
                  semantic: { type: boolean }
              example:
                items:
                - uid: outlook:Posteingang/2026-03-04-rechnung.eml:0
                  cid: 4711
                  source: outlook
                  source_label: Mail
                  root: outlook
                  who: Alice Beispiel <alice.beispiel@nordwind.example>
                  date: '2026-03-04T09:12:00'
                  title: Rechnung 2026-0042
                  path: Posteingang/2026-03-04-rechnung.eml
                  uri: o365://outlook/Posteingang/2026-03-04-rechnung.eml
                  preview: … die Rechnung für das erste Quartal …
                  extern: false
                limit: 20
                offset: 0
                has_more: false
                backend: bm25
        "400":
          description: A limit or offset that is not a number (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: The index cannot answer this search.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }


