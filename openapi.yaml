  /api/openapi:
    get:
      tags: [App]
      operationId: getOpenapi
      summary: This document
      responses:
        "200":
          description: The API description as YAML.
          content:
            text/yaml: {}
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /source:
    get:
      tags: [Explore]
      operationId: getSource
      x-needs-index: true
      summary: An original file from the archive
      description: |
        Serves a file out of an export folder. `path` is relative to the
        root, exactly as hits and file listings return it; `..` escapes are
        blocked. Non-HTML files come with `Content-Disposition: attachment`;
        everything is sandboxed via `Content-Security-Policy: sandbox`.
        An HTML file of the archive – board, list, page, conversation –
        is rewritten in memory so its relative links (attachments, mirrored
        files, a page's files folder) route back through this endpoint.
      parameters:
        - { name: root, in: query, required: true, schema: { type: string, enum: [teams, outlook, onedrive, sharepoint, pages, planner, todo, onenote] } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file (content type by extension).
        "404":
          description: Unknown root, path outside the export, or missing file – JSON, like every other refusal.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/token:
    post:
      tags: [App]
      operationId: saveToken
      summary: Store a pasted Graph access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: "Graph token; 'Bearer ' prefix and whitespace are stripped." }
      responses:
        "200":
          description: The token is stored and usable; `message` says whether scopes are missing.
          content:
            application/json:
              schema:
                type: object
                required: [ok, token]
                properties:
                  ok: { type: boolean }
                  message: { $ref: "#/components/schemas/I18nMessage" }
                  token: { $ref: "#/components/schemas/TokenStatus" }
        "400":
          description: Empty, too short, or already expired (srv.token.empty / .short / .stale) – a stale one comes with `token`, its state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/analytics-refresh:
    post:
      tags: [Archive]
      operationId: refreshAnalytics
      summary: Recompute the analytics block
      responses:
        "200":
          description: The freshly computed block (same shape as GET /api/analytics).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/wizard-seen:
    post:
      tags: [App]
      operationId: dismissWizard
      summary: Dismiss the token wizard
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/run:
    post:
      tags: [Archive]
      operationId: startRun
      x-starts-run: true
      summary: Start an export/index run
      description: |
        Step flags are the registry's request keys; absent means off. A
        cadence below its interval can silently drop onedrive, teams, todo
        or onenote for this run (the log says so). `nur_einheit` narrows a SharePoint,
        pages or Planner run to one URL and forces its sync.

        Note: the master switches from the settings (onedrive_enabled,
        sharepoint_enabled, sharepoint_pages_enabled, planner_enabled,
        todo_enabled, onenote_enabled) gate the interface and the schedule,
        not this endpoint — asking
        for a source here runs it even when its switch is off. That is
        what the settings' per-URL "sync now" button relies on.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outlook: { type: boolean, description: "Mailbox export (configured categories)." }
                onedrive: { type: boolean }
                sharepoint: { type: boolean }
                planner: { type: boolean }
                todo: { type: boolean }
                onenote: { type: boolean }
                sharepoint_pages: { type: boolean }
                teams: { type: boolean }
                index: { type: boolean }
                calendar: { type: boolean }
                sync_onedrive: { type: boolean, description: "Folder tree only." }
                sync_notebooks: { type: boolean, description: "OneNote notebook list only." }
                sync_teams: { type: boolean, description: "Teams conversation list only (teams and channels, chats by category)." }
                sync_todo: { type: boolean, description: "To Do list of lists only." }
                sync_now: { type: boolean, description: "Ignore every sync cadence once (the source's \"Sync now\" button)." }
                calendar_full: { type: boolean, description: "Outlook: read the calendar once in full – only the calendar category runs, window and change tokens ignored." }
                full_sync: { type: boolean, description: "The source's \"Force full sync\" button: the requested exports forget their stored change pointers (delta links, watermarks, inventory versions, page stamps, task etags) and read the source again as on its first export, writing everything over – attachments and files included. Nothing in the archive is deleted. Implies sync_now; for Outlook it reads the calendar in full as calendar_full does, with every configured category." }
                resync: { type: boolean, description: "\"Fetch now\" in the completeness balance and \"Fetch again\" in the archive card: the requested exports forget their stored change pointers (delta links, walk pointers, chat watermarks) but keep every file's version, so each source is listed once in full and only what is not here is fetched – a mail whose file is gone, a card whose attachment is missing. Nothing current is written over, nothing is deleted. Implies sync_now." }
                resync_folders:
                  type: array
                  items: { type: string }
                  description: "With resync: the folders the balance found something open in (rel paths: E-Mail/…, kalender/<name>, kontakte). The Outlook resync then lists those alone – a calendar or the contacts only when a row of theirs is named – and leaves every other folder untouched. Other sources ignore the list."
                sync_sharepoint: { type: boolean }
                sync_folders: { type: boolean, description: "Outlook folder tree only." }
                sync_calendars: { type: boolean }
                check: { type: boolean, description: "Completeness check of the mailbox (mail, calendar, contacts – the ticked categories)." }
                check_teams: { type: boolean, description: "Completeness check of Teams (conversations)." }
                check_onedrive: { type: boolean }
                check_sharepoint: { type: boolean, description: "Completeness check of the SharePoint libraries; doubles as the size preview." }
                check_pages: { type: boolean }
                check_planner: { type: boolean }
                check_todo: { type: boolean }
                check_onenote: { type: boolean }
                check_archive: { type: boolean, description: "The inward check (archive_check.py): every export's bookkeeping against the files on disk, plus the index against the archive. Needs no access; writes nothing but its report." }
                nur_einheit: { type: string, description: "Single site/library/plan URL." }
                legacy_comments: { type: boolean, description: "Planner: list the legacy comment threads again, ignoring the boards' cadence (skipped after a board's first sync otherwise)." }
                embeddings: { type: [boolean, "null"], description: "null = decide automatically." }
                label: { type: string, default: job.export, description: "Run label (i18n key)." }
            examples:
              index:
                summary: Index only
                value: { index: true, label: job.index }
              nightly:
                summary: The three big sources and the index
                value: { outlook: true, teams: true, onedrive: true, index: true }
      responses:
        "200":
          description: The run thread started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: Busy, no token, or nothing to do (error.k names it).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/archiv/ordner:
    post:
      tags: [Archive]
      operationId: openExportFolder
      summary: Show an export folder in the system's file manager
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string, description: "outlook | teams | onedrive | sharepoint | sharepoint_pages | planner | todo | onenote" }
      responses:
        "200":
          description: Opened.
        "400":
          description: Unknown source.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: No way to open a folder on this system.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/bilanz/holen:
    post:
      tags: [Archive]
      operationId: fetchOpen
      x-starts-run: true
      summary: Fetch what a balance row found open (a run)
      description: |
        "Fetch now" on a row of the completeness balance: one run that
        fetches only what the row found open, the cheapest way the source
        allows – the mailbox as a resync limited to the folders with
        something open (resync_folders from the stored report), OneDrive
        and SharePoint by the open files' ids straight from the stored
        report (FETCH_LIST, no walk; a resync when the report had to cap
        them), every other source as its regular sync-now run – then the
        index, and the source's check step so the row is judged afresh
        (the mirrors adjust the row themselves). `quelle` is the balance
        row's key (outlook_mail, outlook_calendar, outlook_contacts,
        teams, onedrive, sharepoint, sharepoint_pages, planner, todo,
        onenote).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "400":
          description: Unknown row.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A run is on, or the run could not start (the source is not ticked, srv.inactive).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/archiv/nachholen:
    post:
      tags: [Archive]
      operationId: fetchMissing
      x-starts-run: true
      summary: Fetch the source's missing files again (a run)
      description: |
        "Fetch again" on a row of the archive card: exactly the files the
        stored report found missing or incomplete are written to a list,
        and one run starts – the source's export step with that list
        (FETCH_LIST: each file fetched through its own bookkeeping – the
        mail's id, the drive item, the conversation, the unit that holds
        it – nothing else read, the source ticked in the settings or not),
        the index, and the archive step "pruefen" that judges the row
        afresh and dates it as fetched, so what is still missing reads as
        a card to note. A file Microsoft no longer has is said so in the
        log and stays an entry without a file. Nothing to do when the row
        lists no missing file.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started, or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: A run is on, or the run could not start.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Unknown source (srv.archiv.unknown).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/archiv/vermerken:
    post:
      tags: [Archive]
      operationId: noteLost
      x-starts-run: true
      summary: Note the source's lost files as lost (a run)
      description: |
        An action of the archive check (archive_check.py), started as a
        run of its own so the run window shows it and the run history
        keeps it: every tombstone of the source whose file is gone – and,
        with `arten` including `fehlt`, every file still missing after a
        resync – is noted in the state.db table `verloren`; the records
        stay. Judged afresh, not from the stored report; the source's row
        in the report is updated when the step is done. Refused while a
        run is on.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
                arten:
                  type: array
                  items: { type: string, enum: [verloren, fehlt] }
                  description: "The kinds to note; default [verloren]. The page adds fehlt only when the report says a resync ran since the files went missing (nachgeholt > fehlt_seit)."
      responses:
        "200":
          description: The run started, or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: A run is on.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Unknown source (srv.archiv.unknown).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/archiv/beiseitelegen:
    post:
      tags: [Archive]
      operationId: setAside
      x-starts-run: true
      summary: Set the source's foreign files aside (a run)
      description: |
        Started as a run of its own: moves every file no bookkeeping knows
        into `_fremd/<stamp>/` inside the export folder, path kept, with a
        list of what moved next to them. A target that exists is skipped,
        never overwritten; nothing is deleted; the index and the checks
        ignore the folder. The log line says how many moved.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started, or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: A run is on.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Unknown source (srv.archiv.unknown).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/archiv/zurueckholen:
    post:
      tags: [Archive]
      operationId: putBack
      x-starts-run: true
      summary: Put the newest set-aside batch back (a run)
      description: |
        Started as a run of its own: moves the files of the newest
        `_fremd/<stamp>/` batch back to their paths; a file whose place is
        taken meanwhile stays in the batch. Emptied batch folders are
        removed – they held nothing but the move.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started, or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: A run is on.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Unknown source (srv.archiv.unknown).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/archiv/neu-aufbauen:
    post:
      tags: [Archive]
      operationId: rebuildBookkeeping
      x-starts-run: true
      summary: Set a damaged bookkeeping aside and rebuild it (a run)
      description: |
        One run of three steps: the archive step sets every damaged
        state.db of the source aside as `state.db.beschaedigt-<stamp>` and
        salvages what it still yields (the whole file when it dumps
        through, else the tombstones) into a fresh one; the source's
        sync-now export fills it as on a first export; the index follows.
        The source's row in the report says "rebuilding" until the next
        check. Nothing to do when no state.db of the source is damaged.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started, or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: A run is on, or the run could not start.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Unknown source (srv.archiv.unknown).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/login:
    post:
      tags: [App]
      operationId: login
      summary: Start the device-code sign-in
      responses:
        "200":
          description: The device code to show; a background thread waits for consent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  device:
                    type: object
                    properties:
                      code: { type: string }
                      url: { type: string }
                      expires_in: { type: integer }
                      done: { type: boolean }
                      ok: { type: boolean }
                      error: { type: [string, "null"] }
        "500":
          description: The flow could not be started (srv.login.failed); `device` carries what the library reported.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/data-dir:
    post:
      tags: [App]
      operationId: setDataDir
      summary: Point the data and index folders elsewhere
      description: |
        Each field acts only when present; an empty string resets to the
        default. Nothing is moved — moving folders is the user's job, and
        the change takes effect after a restart.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, description: "Data folder ('' = default)." }
                index: { type: string, description: "Index folder ('' = default)." }
      responses:
        "200":
          description: The effective paths and whether a restart is needed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  path: { type: string }
                  index: { type: string }
                  restart: { type: boolean }
        "400":
          description: Target not writable, or already used by another profile (`srv.datadir.shared`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/profiles:
    get:
      tags: [App]
      operationId: listProfiles
      summary: Every profile, with account, folder and last run
      description: |
        Fetched when the storage card or the switch window shows the list;
        the status poll carries only `ProfileState`. Served by the chooser
        too.
      responses:
        "200":
          description: The complete profile state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileStatus" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [App]
      operationId: createProfile
      summary: Create a profile
      description: |
        A profile is an archive of its own – configuration, key, run
        history, exports and index – in `profiles/<name>/` below the app
        folder; the first one is called `standard`. The new profile
        starts empty; nothing is copied or moved. Names are slugs
        (`^[a-z0-9][a-z0-9-]{0,31}$`) because they land in paths and on
        command lines.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The new profile and the complete profile state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  profile: { $ref: "#/components/schemas/ProfileInfo" }
                  profiles: { $ref: "#/components/schemas/ProfileStatus" }
        "400":
          description: Bad name, name taken, or profiles impossible (--data-dir).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/profile-switch:
    post:
      tags: [App]
      operationId: switchProfile
      summary: Restart with another profile
      description: |
        Answers first, then the process starts over with `--profile NAME`
        on the same port. The page polls `/api/status` until the new
        instance answers with that profile and reloads. When that profile
        is already open in another instance nearby, the answer carries its
        `url` instead and nothing restarts. Refused while a job runs, and
        refused altogether where there are no profiles (--data-dir).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Restart under way – or, with `url`, the instance that already serves the profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  url: { type: string }
        "400":
          description: Unknown profile, or no profiles at all.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A job is running.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/profile-open:
    post:
      tags: [App]
      operationId: openProfile
      summary: Choose the profile to start (chooser only)
      description: |
        Served only by the chooser page before the app. Records the choice
        (and *open without asking*), answers, then the chooser stops and
        the app takes the port with that profile. When the profile is
        already open in another instance nearby, the answer carries its
        `url` and this start ends.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                ohne_nachfrage: { type: boolean }
      responses:
        "200":
          description: Chosen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  url: { type: string }
        "400":
          description: Unknown profile.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/profile-rename:
    post:
      tags: [App]
      operationId: renameProfile
      summary: Rename a profile that is not open
      description: |
        Renames `profiles/<name>/` to `profiles/<neu>/`; data or index
        paths in its configuration that pointed into the folder follow it,
        paths elsewhere stay. The open profile cannot be renamed
        (`srv.profile.active`); refused while a job runs.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, neu]
              properties:
                name: { type: string }
                neu: { type: string }
      responses:
        "200":
          description: The new name and the complete profile state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  profiles: { $ref: "#/components/schemas/ProfileStatus" }
        "400":
          description: Unknown, open, bad name, name taken, or the rename failed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A job is running.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/profile-prefs:
    post:
      tags: [App]
      operationId: setProfilePrefs
      summary: Open the last profile without asking
      description: |
        With more than one profile the app asks on start which one to open;
        `ohne_nachfrage` skips that and opens the last one. Stored in
        `profiles.json` in the app folder, outside every profile.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ohne_nachfrage: { type: boolean }
      responses:
        "200":
          description: The stored value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ohne_nachfrage: { type: boolean }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/folder-plan:
    post:
      tags: [Archive]
      operationId: planFolders
      summary: What the current rules would export
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string, description: "onedrive | calendar | sharepoint | onenote | teams | todo | anything else = mailbox." }
                onedrive_rules: { type: [string, "null"], description: "Rule text; null = stored config." }
                teams_rules: { type: [string, "null"] }
                todo_rules: { type: [string, "null"] }
                sharepoint_rules: { type: [string, "null"] }
                calendar_rules: { type: [string, "null"] }
                folder_rules: { type: [string, "null"] }
                skip_folders: { description: "Legacy name list (array or comma/newline string)." }
      responses:
        "200":
          description: Included, excluded and gone folders with counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  leer: { type: boolean }
                  regeln: { type: string }
                  abgeglichen: { type: [string, "null"] }
                  an: { type: array, items: { type: object } }
                  aus: { type: array, items: { type: object } }
                  weg: { type: array, items: { type: object } }
                  mails_an: { type: integer }
                  mails_aus: { type: integer }
                  mails_weg: { type: integer }
        "404":
          description: No folder list yet (srv.plan.nolist) – the first run fetches one; `leer` is true.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/logout:
    post:
      tags: [App]
      operationId: logout
      summary: Sign out (clear the token cache)
      responses:
        "200":
          description: Always ok; the pasted token file is untouched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/cancel:
    post:
      tags: [Archive]
      operationId: cancelRun
      summary: Cancel the running job
      responses:
        "200":
          description: ok=true only when a subprocess was actually terminated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/config:
    post:
      tags: [App]
      operationId: saveConfig
      summary: Save settings
      description: |
        Any subset of `Config`; every field is optional and keyed on
        presence. Numbers are clamped to their documented ranges; invalid
        values are ignored rather than rejected. Rule and URL texts are
        one entry per line. Returns the complete normalized configuration.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Config" }
            example: { search_results: 50, internal_domains: "example.com, nordwind.example", sync_cadence: { "outlook:mail": daily, "outlook:mail:E-Mail/Archive": monthly } }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  config: { $ref: "#/components/schemas/Config" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/schedule:
    post:
      tags: [Archive]
      operationId: saveSchedule
      summary: Save the schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                outlook: { type: boolean }
                teams: { type: boolean }
                onedrive: { type: boolean }
                sharepoint: { type: boolean }
                sharepoint_pages: { type: boolean }
                planner: { type: boolean }
                todo: { type: boolean }
                onenote: { type: boolean }
                index: { type: boolean }
                calendar: { type: boolean }
                interval_minutes: { type: integer, minimum: 5 }
      responses:
        "200":
          description: The stored schedule and the next run time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  schedule: { $ref: "#/components/schemas/Schedule" }
                  next: { type: [number, "null"], description: "Unix epoch seconds." }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/mcp:
    post:
      tags: [App]
      operationId: controlMcp
      summary: Start or stop the MCP server
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [start, stop] }
      responses:
        "200":
          description: Result plus the MCP state (with ready-made client config).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { $ref: "#/components/schemas/I18nMessage" }
                  mcp: { $ref: "#/components/schemas/McpState" }
        "400":
          description: "`action` is neither start nor stop (srv.mcp.badaction)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "The server did not start: MCP switched off, no index, or the process failed – `mcp` carries the state."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/report:
    post:
      tags: [App]
      operationId: prefillReport
      summary: Prefill a bug report
      description: |
        Purely local: anonymizes and shortens the supplied log, collects
        system details, and returns everything the page needs to open a
        GitHub issue form. The app itself sends nothing.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                log: { type: string, description: "Log text as shown (already translated)." }
                hint: { type: string, description: "One-line description." }
      responses:
        "200":
          description: The prefilled report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  system: { type: array, items: { type: object } }
                  log: { type: string }
                  title: { type: string }
                  url: { type: string }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/ollama-recheck:
    post:
      tags: [App]
      operationId: recheckOllama
      summary: Re-probe Ollama, bypassing the cache
      responses:
        "200":
          description: The probe result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OllamaStatus" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/answer:
    post:
      tags: [Explore]
      operationId: answer
      x-needs-index: true
      summary: AI summary over the archive (streaming)
      description: |
        The only streaming route: NDJSON, one object per line — first the
        sources, then text chunks, finally `{"done": true}` (or an error
        chunk mid-stream). Needs a usable index and a running Ollama with
        the chat model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q: { type: string }
                person: { type: string }
                from: { type: string, format: date }
                to: { type: string, format: date }
                source: { type: string, default: all }
      responses:
        "200":
          description: The NDJSON stream; an error inside the stream arrives as one more line, not as a status.
          content:
            application/x-ndjson: {}
        "400":
          description: Empty question (srv.answer.noquery).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded, or the chat model is not available (srv.answer.nomodel).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The search found nothing to answer from (srv.answer.nohits).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/update-check:
    post:
      tags: [App]
      operationId: checkUpdate
      summary: Check GitHub for a newer release (blocking)
      responses:
        "200":
          description: The check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: ["off", none, ok, error] }
                  current: { type: string }
                  latest: { type: [string, "null"] }
                  url: { type: [string, "null"] }
                  newer: { type: boolean }
                  ahead: { type: boolean }
                  error: { type: [string, "null"] }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/quit:
    post:
      tags: [App]
      operationId: quit
      summary: Shut the app down
      responses:
        "200":
          description: Sent before the shutdown takes effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---- search history, saved searches, cases (11.0) ------------------------
  /api/suche/historie:
    get:
      tags: [Explore]
      operationId: listHistory
      summary: The search history
      description: |
        Every search by its criteria, newest first – never its hits.
        Kept per the setting `search_history` (off, 30, 90, 365 days,
        forever); pruned at start and when the setting changes.
      responses:
        "200":
          description: Searches and the retention in force.
          content:
            application/json:
              schema:
                type: object
                properties:
                  searches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        wann: { type: string, format: date-time }
                        kriterien: { $ref: "#/components/schemas/Kriterien" }
                        treffer: { type: [integer, "null"] }
                  retention: { type: string, enum: ["off", "30", "90", "365", forever] }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/suche/historie-leeren:
    post:
      tags: [Explore]
      operationId: clearHistory
      summary: Empty the search history
      responses:
        "200":
          description: It worked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/suche/gespeichert:
    get:
      tags: [Explore]
      operationId: listSavedSearches
      summary: The saved searches
      responses:
        "200":
          description: The saved searches, newest first.
