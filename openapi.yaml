  /api/faelle/hinzufuegen:
    post:
      tags: [Cases]
      operationId: addCaseItems
      summary: Add items to a case
      description: |
        Hits as the page has them (key, source, root, path, title, date,
        who) – the case keeps a pointer and what the hit said. An item
        already in the case is left as it is; one without a key is skipped.
        Items added here carry `quelle` "ui"; what Claude adds through MCP
        carries "mcp" and is marked "via MCP" on the item.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                ordner: { type: [integer, "null"], description: "The folder to file the items into. Null or absent: unsorted." }
                eintraege:
                  type: array
                  items:
                    type: object
                    properties:
                      key: { type: string }
                      src: { type: string }
                      root: { type: string }
                      rel: { type: string }
                      titel: { type: string }
                      datum: { type: string }
                      wer: { type: string }
                      bemerkung: { type: string, description: "A remark on why the item is in the case; kept only for items new to the case." }
            example:
              id: 3
              ordner: 7
              eintraege:
                - { key: "mail:<m1@example.com>", src: outlook, root: outlook, rel: "E-Mail/Inbox/2026-09-15_offer.eml", titel: "Re: Offer 2026 – budget frame", datum: "2026-09-15 09:40", wer: "Dana Dienstleister", bemerkung: "The revised prices." }
      responses:
        "200":
          description: How many were added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  added: { type: integer }
                  already: { type: integer }
        "404":
          description: No such case.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The case is closed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

