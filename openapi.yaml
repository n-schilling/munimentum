openapi: 3.1.0
info:
  title: Munimentum HTTP API
  version: 12.0.0
  license: { name: Apache-2.0, identifier: Apache-2.0 }
  contact: { name: Munimentum on GitHub, url: https://github.com/n-schilling/munimentum }
  description: |
    The API between the Munimentum page and its backend, served on
    `127.0.0.1` only. There is **no authentication**: anything on this
    machine that sends a correct `Host` header can read the whole archive.
    The `Host` header must name the bound address (DNS-rebinding guard);
    otherwise every request is answered with `403`.

    Two surfaces live here. **`/api/...`** is the app's own: its routes
    name actions (`/api/faelle/anlegen`), everything that changes anything
    is a POST, and where the data is German the keys are – the page and
    the app share one vocabulary, which inside the app is worth more than
    conformity. **`/api/v1/...`** is for everyone else: resources, the
    method says what happens, English names throughout, no deprecated
    fields. It carries cases and the search so far and grows per release;
    the page moves over resource by resource – its search already has –
    and the action routes go in 13.0.

    Conventions used throughout:
    * Responses are JSON (`application/json; charset=utf-8`) unless a route
      says otherwise; every response carries `Cache-Control: no-store` and
      `X-Content-Type-Options: nosniff` (exceptions: `/api/answer`, `/source`).
    * **Every refusal has one shape** (`Error`), whatever the route and the
      status: `"ok": false` and an `error` with `k` and `v` – the text key
      and its placeholders, which the page renders in the user's language –
      and `text`, the finished sentence for everyone who has no strings of
      their own. **`text` is always English**, whatever the app is set to:
      it ends up in scripts, logs and bug reports, where one language beats
      a text that changes with a setting. A refusal keeps the fields its
      route's answer would carry (an empty list, the token's state), so a
      caller can read the body either way. `message` repeats the reason the
      way 11.3 sent it and goes away with 13.0.
    * The status says what happened: `400` the request, `403` the `Host`,
      `404` a thing that is not there, `409` a state that says no (a run,
      a closed case, an index that cannot answer this), `503` no index
      loaded at all, `500` an uncaught error.
    * A successful answer never carries `error`; the action routes answer
      `{"ok": true, …}`, read routes their data. On `/api/v1` a collection
      is always `items`, whatever the thing is called.
    * A refusal is a **problem detail** (RFC 9457): `type` (a URN naming
      the text key, or `about:blank`), `title` (the status's phrase),
      `status`, `detail` – the English sentence – and `instance`, the path
      asked for. `application/problem+json` says so. `ok` and `error` are
      members of our own, for the page.
    * Every route answers **`OPTIONS`** with `Allow`, and a request whose
      method the path does not serve gets **`405`** with `Allow` – not a
      404. No CORS headers: the server serves one origin, its own page.
    * A body has to be JSON and has to say so: `415` otherwise, `400` when
      it is not valid JSON or not an object, `413` above 4 MB. An absent
      or empty body stays fine – every route falls back to its defaults.
      A number in the query that is not one is `400` too (`srv.badparam`).
    * Every POST route tolerates an absent or empty body and falls back to
      its defaults; body fields act on **presence**, not truthiness.
    * `HEAD` is answered for every GET route (headers only).

    Reading the file:
    * Every operation carries a tag naming its door – **Archive**,
      **Explore**, **Cases** – or **App**, and an `operationId`.
    * `x-needs-index: true` marks a route that answers `503` with
      `srv.noindex` while no index is loaded; `x-starts-run: true` marks a
      route that starts a run – it shows in the run window and in
      `/api/runs`, and is refused with `409` while another run is on.
    * Keys and values in German (`faelle`, `ordner`, `offen`/`zu`) are the
      data's own names; the descriptions say what they mean.
    * `403` (wrong `Host`), `405` (wrong method) and `500` (uncaught
      error) can answer every route, `415` every route with a body; they
      are listed once under `components/responses` and referenced
      everywhere.
    * Every answer carries two headers: `X-Munimentum-Version`, the
      program and the commit it was built from (`11.4.0 (a1b2c3d)`), and
      `X-Munimentum-Api`, the contract it answered under (`v1`). They
      version different things and move at different speeds – the path
      changes only when the shape breaks, the program with every release –
      which is why the program's version is not in the path. `/api/status`
      reports both as well (`update.current`, `update.build`,
      `api_version`), and `info.version` above names the release this
      description belongs to.
    * `503` carries `Retry-After`; nothing here waits on a remote service,
      what is missing is an index, and that takes a run.
    * The interface speaks `de`, `en` and `fr` – the setting `language`,
      else `Accept-Language`. That is the page's language and the log's,
      never the error texts': those are English throughout.

    This file is served by `GET /api/openapi` and lives in the repository as
    `openapi.yaml`; it is updated in the same commit as any API change.
externalDocs:
  description: The README – what the app does, and where the data goes.
  url: https://github.com/n-schilling/munimentum#readme
servers:
  - url: http://127.0.0.1:{port}
    description: The app's port – 8700 by default; it tries the next twelve when that one is taken, and a second profile started alongside takes the next free one.
    variables:
      port: { default: "8700" }
security: []
tags:
  - name: Archive
    description: Building the archive and judging it – runs, the schedule, the completeness balance, the archive check, Insights.
  - name: Explore
    description: Getting data out – the search, a hit's detail, calendar, contacts, files, the history and the saved searches.
  - name: Cases
    description: What someone keeps around one matter – cases, folders, items, notes, stored lists, exports.
  - name: App
    description: State, access, settings, profiles and the app itself.

paths:
  /:
    get:
      tags: [App]
      operationId: page
      summary: The single-page interface
      description: |
        The whole UI as one HTML page, with the language strings and the
        step metadata from the registry injected server-side. `/index.html`
        is an alias. Language is negotiated from the configuration and the
        request's `Accept-Language` header.
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/status:
    get:
      tags: [App]
      operationId: getStatus
      summary: Complete application state
      description: |
        Polled by the page. Carries token state, Ollama state, index and
        export inventories, the job runner snapshot (`jobs.seq` is the log
        cursor), MCP state, update info and auth state.

        **Only what changes on its own.** Since 12.0 three things that do
        not are gone from here, because this answer is polled every few
        seconds and a poll should not keep repeating them: the settings
        (`/api/v1/config`), the paths, defaults and client snippet
        (`/api/v1/app`) and what the sources hold, folder names and all
        (`/api/v1/inventory`). That took the answer from about 8 KB to
        under 2.5. While the chooser holds the port (more than one
        profile, none named at start) the answer is `{"chooser": true}`
        instead – the page polls until the app answers.
      responses:
        "200":
          description: The state object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/TokenState" }
                  ollama: { $ref: "#/components/schemas/OllamaState" }
                  store:
                    type: object
                    description: |
                      What the search can do right now: `exists`, `semantic`,
                      `features` and `built_at`. How much the index holds is
                      in /api/analytics, where the rest of the inventory is.
                    properties:
                      exists: { type: boolean }
                      semantic: { type: boolean }
                      features: { type: array, items: { type: string } }
                      built_at: { type: [string, "null"] }
                  calendar:
                    type: object
                    properties:
                      built_at: { type: [string, "null"], description: "Null means the calendar step has not run." }
                  jobs: { $ref: "#/components/schemas/JobsState" }
                  mcp:
                    type: object
                    description: "Whether the endpoint runs, its address, and why it does not. The client snippet is in /api/v1/app, the port in the settings."
                    properties:
                      running: { type: boolean }
                      url: { type: string }
                      error: { $ref: "#/components/schemas/MessageOrKey" }
                  schedule_next:
                    type: [string, "null"]
                    description: When the schedule runs next – null when it is off or nothing is due. Whether it is on at all is a setting.
                  wizard:
                    type: [string, "null"]
                    enum: [token, ollama, null]
                    description: Which assistant the app would open – decided here, not in the page.
                  update:
                    type: object
                    description: "What the check found: status, latest, url, newer, ahead, error. Which version runs is in /api/v1/app."
                  auth:
                    type: object
                    description: "What follows from the settings: `signed_in`, `account`, `own_registration` and, while a device login runs, `device`. The mode and the ids themselves are settings."
                  profile: { $ref: "#/components/schemas/ProfileState" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/log:
    get:
      tags: [App]
      operationId: getLog
      summary: Log lines after a cursor
      description: |
        The runner keeps a bounded ring buffer of log lines, each with a
        strictly increasing `n`. Pass the `seq` of the previous response (or
        of `/api/status` → `jobs.seq`) as `since`; `0` returns the whole
        retained buffer. A client far behind loses old lines silently.
      parameters:
        - name: since
          in: query
          schema: { type: integer, default: 0 }
          description: Last line number the client already has.
      responses:
        "200":
          description: New lines and the current cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/LogLine" }
                  seq: { type: integer }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/search:
    get:
      tags: [Explore]
      operationId: search
      x-needs-index: true
      summary: Search or browse the archive
      description: |
        With `q`: ranked search (mode auto/hybrid/semantic/lexical). Without
        `q`: filter-only browsing, newest first.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Query text; empty switches to browse mode." }
        - { name: person, in: query, schema: { type: string }, description: "Sender / author filter (substring)." }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Inclusive lower date bound." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Inclusive upper date bound." }
        - { name: source, in: query, schema: { type: string, default: all }, description: "One key or several comma-separated (\"onedrive,sharepoint\"): teams, outlook, kalender, kontakte, onedrive, sharepoint, pages, planner, todo, onenote; teams includes the files next to the conversations, datei = every file mirror, all = everything." }
        - { name: k, in: query, schema: { type: integer, default: 20, maximum: 100 }, description: "Page size." }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: "Results to skip." }
        - { name: gone, in: query, schema: { type: string }, description: "1/true/ja: only tombstoned messages." }
        - { name: folder, in: query, schema: { type: string }, description: "Restrict to a folder and below." }
        - { name: filetype, in: query, schema: { type: string }, description: "Attachment / file extension without dot." }
        - { name: mode, in: query, schema: { type: string, default: auto, enum: [auto, hybrid, semantic, lexical] } }
        - { name: case, in: query, schema: { type: integer }, description: "The \"Cases\" filter: only items the case holds (its id, see /api/faelle)." }
        - { name: case_folder, in: query, schema: { type: integer }, description: "With `case`: only the items in this folder of the case (its id, see the case's `ordner_liste`)." }
        - { name: party, in: query, schema: { type: string, default: all, enum: [all, internal, external] }, description: "Mails and appointments by their parties: `internal` – every party inside the internal mail domains (setting `internal_domains`, else the signed-in account's domain) – or `external` – at least one outside. Items without addresses are on neither side. Needs an index with the parties' domains." }
        - { name: saved, in: query, schema: { type: integer }, description: "Id of the saved search being run; the first page records when it ran and how many hits it had." }
      responses:
        "200":
          description: |
            The hits. The first page (offset 0) of a
            non-empty search is recorded in the search history – criteria
            only, never hits – unless the setting `search_history` is off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Hit" }
                  count: { type: integer }
                  offset: { type: integer }
                  backend: { type: string, description: "bm25, semantic or hybrid – what actually ranked." }
                  semantic: { type: boolean, description: "Whether the index carries vectors at all." }
              example:
                count: 2
                offset: 0
                backend: bm25
                semantic: false
                results:
                  - uid: "outlook:E-Mail/Inbox/2026-09-15_offer.eml:0"
                    cid: 4711
                    source: outlook
                    source_label: Mail
                    root: outlook
                    who: Dana Dienstleister
                    who_mail: dana@nordwind.example
                    domains: [example.com, nordwind.example]
                    date: "2026-09-15 09:40"
                    title: "Re: Offer 2026 – budget frame and options"
                    context: E-Mail/Inbox
                    path: E-Mail/Inbox/2026-09-15_offer.eml
                    uri: "o365://outlook/E-Mail%2FInbox%2F2026-09-15_offer.eml"
                    score: 0.8123
                    thread: "mail:<m1@example.com>"
                    attachments: [Options_v3.xlsx]
                    gone: null
                    key: "mail:<m2@example.com>"
                    cases: [{ id: 3, name: Nordwind offer 2026, ordner: Belege, status: offen }]
                    preview: "…the two options are on the second sheet, the budget frame stays…"
        "409":
          description: "The index cannot answer this search: an unknown case or case folder in the filter, a mode this index was not built for, or the embedder refusing."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex); `hits` and `count` come along empty.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/similar:
    get:
      tags: [Explore]
      operationId: findSimilar
      x-needs-index: true
      summary: Messages similar to one hit
      description: Needs an index with embeddings; works without Ollama.
      parameters:
        - { name: cid, in: query, required: true, schema: { type: integer }, description: "Index row id from a hit's cid." }
        - { name: k, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: The similar hits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                  count: { type: integer }
                  backend: { type: string }
        "400":
          description: "`cid` is not a number (srv.badparam)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The index has no embeddings, or it predates deletion tracking.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/thread:
    get:
      tags: [Explore]
      operationId: getThread
      x-needs-index: true
      summary: A whole conversation
      parameters:
        - { name: key, in: query, required: true, schema: { type: string }, description: "The thread id from a hit." }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The messages of the conversation, oldest first – each with `cases`, the cases it already sits in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread: { type: string }
                  count: { type: integer }
                  messages: { type: array, items: { $ref: "#/components/schemas/Hit" } }
        "409":
          description: This index predates conversation grouping – rebuild it once.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/sharepoint-report:
    get:
      tags: [Archive]
      operationId: getSharepointReport
      summary: Last balance of the SharePoint libraries
      description: |
        The stored balance of the libraries' check step – the size preview
        reads its `bytes`, `bytes_ausgeschlossen` and `typen` from it;
        cheaper than /api/analytics.
      responses:
        "200":
          description: The balance, or null when the check never ran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bericht: { anyOf: [{ $ref: "#/components/schemas/Bilanz" }, { type: "null" }] }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/files:
    get:
      tags: [Explore]
      operationId: browseFiles
      x-needs-index: true
      summary: Browse the mirrored drives and the files next to conversations
      parameters:
        - { name: root, in: query, schema: { type: string, enum: ["", onedrive, sharepoint, teams, planner] }, description: "Empty lists the entry points; teams browses the files shared in chats and the mirrored channel folders, planner a board's downloaded attachments." }
        - { name: path, in: query, schema: { type: string }, description: "Folder inside the mirror, as returned here." }
      responses:
        "200":
          description: Entry points, or one folder level (max 2000 files).
          content:
            application/json:
              schema:
                type: object
                properties:
                  roots:
                    type: array
                    description: The entry points, only at the top (no root given).
                    items:
                      type: object
                      required: [root, path, label, files]
                      properties:
                        root: { $ref: "#/components/schemas/Root" }
                        path: { type: string, description: "The folder to browse next – a library, a chat kind or team, a board." }
                        label: { type: string }
                        files: { type: integer }
                  root: { type: string }
                  path: { type: string }
                  base: { type: integer, description: "Fixed prefix depth for breadcrumbs (2 for sharepoint)." }
                  label: { type: string }
                  dirs:
                    type: array
                    items:
                      type: object
                      required: [name, path, files]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        files: { type: integer, description: "Files below, all levels." }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        rel: { type: string }
                        date: { type: string }
                        gone: { type: [string, "null"] }
                        size: { type: [integer, "null"] }
        "503":
          description: No index loaded (srv.noindex); `roots` comes along empty.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/filetypes:
    get:
      tags: [Explore]
      operationId: listFiletypes
      x-needs-index: true
      summary: File types in the archive
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 200 } }
        - $ref: "#/components/parameters/Source"
      responses:
        "200":
          description: Types after applying the configured hide list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  total_distinct: { type: integer }
                  hidden: { type: array, items: { type: string } }
                  filetypes:
                    type: array
                    description: Most frequent first.
                    items:
                      type: object
                      required: [type, messages]
                      properties:
                        type: { type: string, description: "The extension without dot, lower-case." }
                        messages: { type: integer, description: "Items carrying one – mails by attachment, files by name." }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/folders:
    get:
      tags: [Explore]
      operationId: listFolders
      x-needs-index: true
      summary: Folder units for the filter dropdown
      parameters:
        - { name: contains, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 300, maximum: 1000 } }
        - $ref: "#/components/parameters/Source"
      responses:
        "200":
          description: Folders (whole units per source), by message count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  folders:
                    type: array
                    description: Largest first.
                    items:
                      type: object
                      required: [path, messages]
                      properties:
                        path: { type: string, description: "The value the `folder` filter takes; a folder always means its subfolders too." }
                        messages: { type: integer }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/people:
    get:
      tags: [Explore]
      operationId: listPeople
      x-needs-index: true
      summary: People occurring in the archive
      parameters:
        - { name: source, in: query, schema: { type: string, default: all }, description: "One key or several comma-separated; files and pages record no person." }
        - { name: contains, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Names with message counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  total_distinct: { type: integer }
                  total_messages: { type: integer }
                  people:
                    type: array
                    description: Most messages first.
                    items:
                      type: object
                      required: [name, messages]
                      properties:
                        name: { type: string, description: "The spelling the archive uses – the value the `person` filter takes." }
                        messages: { type: integer }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "400":
