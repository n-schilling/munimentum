  /api/faelle/liste:
    post:
      tags: [Cases]
      operationId: storeCaseList
      x-needs-index: true
      summary: Store a result list in a case
      description: |
        Runs the search with the given criteria on the server – every
        page, up to 5000 hits – and stores the list as it stands now: the
        criteria, the moment, the count, and every hit as an item of the
        case (marked with the list). What the list found later is not the
        list; run the search again for that.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                kriterien: { $ref: "#/components/schemas/Kriterien" }
                ordner: { type: [integer, "null"], description: "The folder the list and its hits file into. Null or absent: unsorted." }
      responses:
        "200":
          description: How many were added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  liste: { type: integer }
                  hits: { type: integer }
                  added: { type: integer, description: "Hits new to the case." }
        "404":
          description: No such case.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The case is closed, or the search failed (the error says why).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

