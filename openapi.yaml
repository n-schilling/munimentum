          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/document:
    get:
      tags: [Explore]
      operationId: getDocument
      x-needs-index: true
      summary: One message with its full text
      parameters:
        - $ref: "#/components/parameters/Uid"
        - { name: before, in: query, schema: { type: integer, default: 0, maximum: 20 }, description: "Conversation context before." }
        - { name: after, in: query, schema: { type: integer, default: 0, maximum: 20 } }
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  source: { type: string }
                  who: { type: string }
                  date: { type: string }
                  title: { type: string }
                  path: { type: string }
                  uri: { type: string }
                  text: { type: string }
                  facts:
                    type: object
                    additionalProperties: true
                    description: What the item is known by, per kind – the same block /api/detail returns, without uid, kind and text (a mail's from, to, cc, date, folder, attachments; an appointment's start, end, location, organiser, attendees; a task's due, state, checklist or steps …).
                  file:
                    type: object
                    description: Only for mirrored files – name, path, size_bytes, modified, gone, binary, content_indexed (always false).
                  context_before: { type: array, items: { type: object } }
                  context_after: { type: array, items: { type: object } }
        "404":
          description: No item with this uid.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/detail:
    get:
      tags: [Explore]
      operationId: getDetail
      x-needs-index: true
      summary: The facts the hit's detail shows
      description: |
        Per kind of item, from the index row and the source file: a mail's
        from, to, cc, date, folder and attachments (with sizes); a chat
        message's from, when and chat; an appointment's start, end,
        location, organiser and attendees; a contact's org, role, emails
        and phones; a file's ext, size and modified; a task's plan or
        list, assigned, due, state, checklist or steps, comments and
        linked resources. `text` is the content the detail shows. A key
        that is missing means the item has none of it.
      parameters:
        - $ref: "#/components/parameters/Uid"
      responses:
        "200":
          description: The facts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  uid: { type: string }
                  kind: { type: string, description: "The source: outlook, teams, kalender, kontakte, datei, pages, onenote, planner, todo." }
                  text: { type: string }
        "404":
          description: No item with this uid (srv.detail.none).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/run-log:
