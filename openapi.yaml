      parameters:
        - { name: root, in: query, schema: { $ref: "#/components/schemas/Root" }, description: "Empty: the list of mirrors." }
        - { name: path, in: query, schema: { type: string }, description: "Folder inside that mirror, as this route returns it." }
      responses:
        "200":
          description: The mirrors, or one folder with its subfolders and files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roots: { type: array, items: { type: object }, description: "Only without `root`." }
                  root: { $ref: "#/components/schemas/Root" }
                  path: { type: string }
                  dirs: { type: array, items: { type: string } }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        rel: { type: string }
                        date: { type: string }
                        gone: { type: [string, "null"] }
                        size: { type: [integer, "null"] }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/files/content:
    get:
      tags: [Explore, GET]
      operationId: v1FileContent
      x-needs-index: true
      summary: An original file from the archive
      description: |
        Serves a file out of an export folder. `path` is relative to the
        root, exactly as hits and file listings return it; `..` escapes are
        blocked. Non-HTML files come with `Content-Disposition: attachment`;
        everything is sandboxed via `Content-Security-Policy: sandbox`.
        An HTML file of the archive – board, list, page, conversation –
        is rewritten in memory so its relative links (attachments, mirrored
        files, a page's files folder) route back through this endpoint.
        Until 13.0 this was `/source`.
      parameters:
        - { name: root, in: query, required: true, schema: { type: string, enum: [teams, outlook, onedrive, sharepoint, pages, planner, todo, onenote] } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: |
            The file itself. The content type follows the extension (and
            `application/octet-stream` where it is unknown); everything but
            archive HTML is offered as a download, which is what the
            `Content-Disposition` says. Archive HTML is served for reading,
            with its relative links rewritten onto this route, and both are
            answered with `Content-Security-Policy: sandbox` and
            `X-Content-Type-Options: nosniff` – what lies in an archive was
            written by someone else. `HEAD` answers the headers alone.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"…\"` for everything but `.html` and `.htm`; the name is the file's, stripped of anything a header or a download folder should not carry."
              schema: { type: string }
            Content-Length:
              description: The file's size in bytes.
              schema: { type: integer }
            Content-Security-Policy:
              description: Always `sandbox` – an archived page runs nothing.
              schema: { type: string }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Unknown root, path outside the export, or missing file – JSON, like every other refusal.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/folders:
    get:
      tags: [Explore, GET]
      operationId: v1ListFolders
      x-needs-index: true
      summary: The folders the archive holds
      description: |
        The folder units the search offers as a filter – one row per unit
        with the number of messages in it. `source` narrows them to one
        source's units.
      parameters:
        - { $ref: "#/components/parameters/Source" }
        - { name: contains, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 300, maximum: 1000 } }
      responses:
        "200":
          description: Folders with their message counts, most first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [path, messages]
                      properties:
                        path: { type: string, description: "The value the `folder` filter takes; a folder always means its subfolders too." }
                        messages: { type: integer }
                  count: { type: integer }
                  limit: { type: integer, description: "The cap this answer was built with." }
                  has_more: { type: boolean, description: "The answer is as long as the cap, so something may have been left out. Narrow with `contains` or `source` – there is no paging here." }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/filetypes:
    get:
      tags: [Explore, GET]
      operationId: v1ListFiletypes
      x-needs-index: true
      summary: The file types the archive holds
      description: What the setting `filetype_hidden` hides is left out here and named in `hidden`.
      parameters:
        - { $ref: "#/components/parameters/Source" }
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 200 } }
      responses:
        "200":
          description: Types with their counts, most frequent first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [type, messages]
                      properties:
                        type: { type: string, description: "The extension without dot, lower-case." }
                        messages: { type: integer }
                  count: { type: integer }
                  total_distinct: { type: integer }
                  hidden: { type: array, items: { type: string } }
                  limit: { type: integer, description: "The cap this answer was built with." }
                  has_more: { type: boolean, description: "The answer is as long as the cap, so something may have been left out. Narrow with `contains` or `source` – there is no paging here." }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/people:
    get:
      tags: [Explore, GET]
      operationId: v1ListPeople
      x-needs-index: true
      summary: Who the archive knows
      description: |
        Everyone the archive names, with how many messages each appears in –
        the list behind the person filter. `source` narrows it, `limit`
        caps it.
      parameters:
        - { $ref: "#/components/parameters/Source" }
        - { name: contains, in: query, schema: { type: string }, description: "Substring of the name." }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Names with their message counts, most first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, messages]
                      properties:
                        name: { type: string, description: "The spelling the archive uses – the value the `person` filter takes." }
                        messages: { type: integer }
                  count: { type: integer }
                  total_distinct: { type: integer }
                  total_messages: { type: integer }
                  limit: { type: integer, description: "The cap this answer was built with." }
                  has_more: { type: boolean, description: "The answer is as long as the cap, so something may have been left out. Narrow with `contains` or `source` – there is no paging here." }
              example:
                items:
                - name: Alice Beispiel
                  messages: 318
                - name: Bob Baumeister
                  messages: 204
                count: 2
                limit: 50
                has_more: false
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/addresses:
    get:
      tags: [Explore, GET]
      operationId: v1ListAddresses
      x-needs-index: true
      summary: The addresses of one mail line
      description: |
        Who stood in From, To, Cc or Bcc, most used first – what the Mail
        filter offers while one types. Counted when the index is built, so
        a keystroke costs one small query. Mail only: no other source has
        such lines. An index from before the lines answers an empty list.
      parameters:
        - { name: role, in: query, schema: { type: string, default: from, enum: [from, to, cc, bcc] } }
        - { name: contains, in: query, schema: { type: string }, description: "Substring of the address; `*` is the wildcard." }
        - { name: limit, in: query, schema: { type: integer, default: 12, maximum: 100 } }
      responses:
        "200":
          description: Addresses with the number of mails that carry them in this line.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [address, messages]
                      properties:
                        address: { type: string }
                        messages: { type: integer }
                  count: { type: integer }
                  role: { type: string }
                  limit: { type: integer, description: "The cap this answer was built with." }
                  has_more: { type: boolean, description: "The answer is as long as the cap, so something may have been left out. Narrow with `contains` or `source` – there is no paging here." }
        "400":
          description: An unknown line, or a number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/similar:
    get:
      tags: [Explore, GET]
      operationId: v1FindSimilar
      x-needs-index: true
      summary: Messages similar to one hit
      description: Needs an index with embeddings; works without Ollama.
      parameters:
        - { name: cid, in: query, required: true, schema: { type: integer }, description: "Index row id from a hit's cid." }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: The similar hits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                  count: { type: integer }
                  backend: { type: string }
                  limit: { type: integer, description: "The cap this answer was built with." }
                  has_more: { type: boolean, description: "The answer is as long as the cap, so something may have been left out." }
        "400":
          description: "`cid` is not a number (srv.badparam)."
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: The index has no embeddings, or it predates deletion tracking.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/answer:
    query:
      tags: [Explore, QUERY]
      operationId: v1Answer
      x-needs-index: true
      summary: AI summary over the archive (streaming)
      description: |
        The only streaming route: NDJSON, one object per line — first the
        sources, then text chunks, finally `{"done": true}` (or an error
        chunk mid-stream). Needs a usable index and a running Ollama with
        the chat model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q: { type: string }
                person: { type: string }
                from: { type: string, format: date }
                to: { type: string, format: date }
                source: { type: string, default: all }
      responses:
        "200":
          description: |
            The stream. Once it has begun the status is `200`, whatever
            happens next: a model that is not there, an Ollama that stops
            answering, arrive as one more line with an `error`, never as a
            status. A reader takes the lines in order and stops at `done`.
          content:
            application/x-ndjson:
              itemSchema: { $ref: "#/components/schemas/AnswerChunk" }
              examples:
                stream:
                  summary: Sources, three pieces of text, done
                  value: |
                    {"sources":[{"n":1,"uid":"outlook:Posteingang/2026-03-04-rechnung.eml:0","title":"Rechnung 2026-0042","who":"Alice Beispiel","date":"2026-03-04T09:12:00","uri":"o365://outlook/Posteingang/2026-03-04-rechnung.eml"}],"model":"llama3.1:8b"}
                    {"text":"Die Rechnung 2026-0042 "}
                    {"text":"kam am 4. März von Alice Beispiel"}
                    {"text":" und ist in [1] zu finden."}
                    {"done":true}
                abbruch:
                  summary: The model is not there – the refusal is a line
                  value: |
                    {"sources":[],"model":"llama3.1:8b"}
                    {"error":"model","detail":"llama3.1:8b"}
        "400":
          description: Empty question (srv.answer.noquery), or a body that is not a question at all – missing or without a media type (srv.query.empty, srv.query.notype).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded, or the chat model is not available (srv.answer.nomodel).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: The search found nothing to answer from (srv.answer.nohits).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/searches/history:
    get:
      tags: [Explore, GET]
      operationId: v1ListHistory
      summary: The search history
      description: |
        Every search that ran, newest first – its criteria, when it ran and
        how many hits it had. Never the hits themselves. What is kept, and
        for how long, is the setting `search_history` (off, 30, 90, 365
        days, forever); it is pruned at start and when the setting changes.
        A search lands here only when the caller asked for it
        (`remember=1` on the search), which is what the page does.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 500 } }
      responses:
        "200":
          description: The searches and the retention in force.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } }
                  retention: { type: string, enum: ["off", "30", "90", "365", forever] }
                  limit: { type: integer, description: "The cap this answer was built with." }
                  has_more: { type: boolean, description: "The answer is as long as the cap, so something may have been left out." }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Explore, DELETE]
      operationId: v1ClearHistory
      summary: Forget every search
      description: |
        Empties the history. Saved searches are their own resource and stay.
      responses:
        "204":
          description: Emptied; no body.
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/searches/saved:
    get:
      tags: [Explore, GET]
      operationId: v1ListSavedSearches
      summary: The saved searches
      description: Criteria under a name, by name; each says whether it sits in a case.
      responses:
        "200":
          description: The saved searches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SavedSearch" } }
              example:
                items:
                - id: 2
                  name: Alle Rechnungen
                  criteria:
                    q: Rechnung
                    source: outlook
                    mode: text
                  created: '2026-02-11T14:05:00'
                  last_run: '2026-03-04T09:19:00'
                  hits: 128
                  case: 3
                  case_name: Nordwind
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Explore, POST]
      operationId: v1SaveSearch
      summary: Keep a search under a name
      description: |
        The criteria as the search takes them, under a name. With `case` the
        search is attached to that case, which is what lets it say later
        what the case still lacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                criteria: { $ref: "#/components/schemas/Criteria" }
                case: { type: [integer, "null"], description: "Attach it to this case (which must be open)." }
                case_folder: { type: [integer, "null"], description: "The folder of that case its new hits file into. Null: unsorted." }
                auto: { type: boolean, description: "Collect automatically: every run that updates the index files its new hits into the case. Needs `case` and a text search." }
            example:
              name: "Nordwind – everything external"
              criteria: { q: "Nordwind", mode: text, source: outlook, party: external }
              case: 3
              case_folder: null
              auto: true
      responses:
        "201":
          description: The saved search; `Location` names it.
          headers:
            Location: { schema: { type: string }, description: "/api/v1/searches/saved/{id}" }
          content:
            application/json:
              schema:
                type: object
                required: [search]
                properties:
                  search: { $ref: "#/components/schemas/SavedSearch" }
        "400":
          description: No name (srv.case.noname), a case that is no id (srv.case.badcase), a folder that is none (srv.case.badfolder) or one without a case (srv.case.folder.nocase); `auto` that is no boolean (srv.search.badauto), set without a case (srv.search.auto.nocase) or on a search that is not a text search (srv.search.auto.text).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No such case (srv.case.unknown) or folder (srv.case.nofolder).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: The case is closed (srv.case.closed).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/searches/saved/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Explore, GET]
      operationId: v1SavedSearch
      summary: One saved search
      description: |
        The search under its name – its criteria, when it last ran and
        the case it is attached to, if any.
      responses:
        "200":
          description: The saved search.
          content:
            application/json:
              schema:
                type: object
                required: [search]
                properties:
                  search: { $ref: "#/components/schemas/SavedSearch" }
        "404":
          description: No saved search with that id (srv.search.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Explore, PATCH]
      operationId: v1UpdateSavedSearch
      summary: Rename a saved search, or move it into a case
      description: |
        The fields the body names, nothing else. `name` renames; `case`
        attaches the search to a case, `null` detaches it; `case_folder`
        says which folder of that case its new hits file into – on its
        own, for the case the search is attached to; `auto` switches
        the collecting on or off (on needs a case and a text search;
        detaching switches it off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                case: { type: [integer, "null"] }
                case_folder: { type: [integer, "null"] }
                auto: { type: boolean }
            example: { case: 3, case_folder: 7, auto: true }
      responses:
        "200":
          description: The saved search as it now is.
          content:
            application/json:
              schema:
                type: object
                required: [search]
                properties:
                  search: { $ref: "#/components/schemas/SavedSearch" }
        "400":
          description: An empty name (srv.case.noname), a case that is no id (srv.case.badcase), a folder that is none (srv.case.badfolder) or one for a search attached to no case (srv.case.folder.nocase); `auto` that is no boolean (srv.search.badauto), on without a case (srv.search.auto.nocase) or on a search that is not a text search (srv.search.auto.text).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No such search (srv.search.unknown), case (srv.case.unknown) or folder (srv.case.nofolder).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: The case is closed (srv.case.closed).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Explore, DELETE]
      operationId: v1DeleteSavedSearch
      summary: Drop a saved search
      description: Deletes the saved search; the case it sat in keeps everything else.
      responses:
        "204":
          description: Deleted; no body.
        "404":
          description: No such search (srv.search.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/threads:
    get:
      tags: [Explore, GET]
      operationId: v1GetThread
      x-needs-index: true
      summary: A whole conversation
      description: |
        The conversation a hit belongs to, oldest first, each message with
        `cases`, the cases it already sits in. The key is not a path
        segment – it carries colons and angle brackets – so it is a query.
      parameters:
        - { name: key, in: query, required: true, schema: { type: string }, description: "The `thread` of a hit." }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The messages of the conversation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  thread: { type: string }
                  count: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                  limit: { type: integer, description: "The cap this answer was built with." }
                  has_more: { type: boolean, description: "The answer is as long as the cap, so something may have been left out. Narrow with `contains` or `source` – there is no paging here." }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: This index predates conversation grouping – rebuild it once.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/documents:
    get:
      tags: [Explore, GET]
      operationId: v1GetDocument
      x-needs-index: true
      summary: One item with its full text
      description: |
        The uid is not a path segment – it carries the source's path and a
        chunk number – so it is a query. `facts` is what the kind of item
        is known by, the same block `/api/v1/documents/facts` returns.
      parameters:
        - $ref: "#/components/parameters/Uid"
        - { name: before, in: query, schema: { type: integer, default: 0, maximum: 20 }, description: "Conversation context before." }
        - { name: after, in: query, schema: { type: integer, default: 0, maximum: 20 } }
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  source: { $ref: "#/components/schemas/SourceKey" }
                  who: { type: string }
                  date: { type: string }
                  title: { type: string }
                  path: { type: string }
                  uri: { type: string }
                  text: { type: string }
                  facts: { type: object, additionalProperties: true }
                  file: { type: object, description: "Only for mirrored files." }
                  context_before: { type: array, items: { type: object } }
                  context_after: { type: array, items: { type: object } }
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No item with this uid.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/documents/facts:
    get:
      tags: [Explore, GET]
      operationId: v1GetFacts
      x-needs-index: true
      summary: What one item is known by
      description: |
        Per kind of item, from the index row and the source file: a mail's
        from, to, cc, bcc, date, folder and attachments; a chat message's from,
        when and chat; an appointment's start, end, location, organiser and
        attendees; a contact's org, role, emails and phones; a file's ext,
        size and modified; a task's plan or list, assigned, due, state,
        checklist or steps. A key that is missing means the item has none
        of it. This is what the app's detail pane shows.
      parameters:
        - $ref: "#/components/parameters/Uid"
      responses:
        "200":
          description: The facts, plus `uid`, `kind` and the item's `text`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facts"
              example:
                uid: outlook:Posteingang/2026-03-04-rechnung.eml:0
                kind: outlook
                from: { name: Alice Beispiel, mail: alice.beispiel@nordwind.example }
                to: [{ name: Bob Baumeister, mail: bob.baumeister@nordwind.example }]
                cc: []
                bcc: []
                date: '2026-03-04T09:12:00'
                folder: Posteingang
                attachments: [{ name: Rechnung-0042.pdf, size: 84213 }]
        "404":
          description: No item with this uid (srv.detail.none).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/documents/attachments:
    get:
      tags: [Explore, GET]
      operationId: v1GetAttachment
      x-needs-index: true
      summary: One attachment of a mail, as a download
      description: |
        The n-th real attachment of a mail (1-based), in the order the
        facts list them – so the chip the detail shows is what this hands
        out. Real ones only, as the facts count them: an inline image is
        not one. Only mail has attachments this way; a card's or a page's
        referenced files are files of the archive, served by
        `/api/v1/files/content`.
      parameters:
        - $ref: "#/components/parameters/Uid"
        - { name: n, in: query, schema: { type: integer, default: 1, minimum: 1 }, description: "Which one, counted from 1 as the facts list them." }
      responses:
        "200":
          description: |
            The attachment itself, under the content type the mail gave it
            (`application/octet-stream` where it gave none), offered as a
            download and answered with `Content-Security-Policy: sandbox`
            and `X-Content-Type-Options: nosniff` – what lies in a mail was
            written by someone else.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"…\"` – the attachment's name, stripped of anything a header or a download folder should not carry."
              schema: { type: string }
            Content-Length:
              description: The attachment's size in bytes.
              schema: { type: integer }
            Content-Security-Policy:
              description: Always `sandbox`.
              schema: { type: string }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "400":
          description: "`n` is not a number (srv.badparam)."
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No item with this uid (srv.detail.none), or no n-th attachment on it – a chat, a file, a mail with fewer (srv.attach.none).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/calendar:
    get:
      tags: [Explore, GET]
      operationId: v1GetCalendar
      summary: Appointments, reconstructions and contacts in one file
      description: |
        The result of the calendar step, served as it lies – gzipped when
        the request accepts it. Appointments recovered from invitation and
        cancellation mails travel with it.
      responses:
        "200":
          description: The file as the calendar step built it.
          content:
            application/json: {}
        "404":
          description: Not built yet (cal.missing); `recs` comes along empty.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/config:
    get:
      tags: [App, GET]
      operationId: v1GetConfig
      summary: Every setting
      description: |
        The settings as they are on disk, defaults filled in. They used to
        travel with the status answer; that one is polled, this one is
        asked once and after a save.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config: { $ref: "#/components/schemas/Config" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [App, PATCH]
      operationId: v1UpdateConfig
      summary: Change settings
      description: |
        The keys the body names, the rest stays – which is what PATCH says,
        and what the action route it replaces always did under a name that
        did not say so. Numbers outside their bounds are clamped rather than refused;
        the answer carries the settings as they now are.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Config" }
            example: { workers: 4, search_results: 50 }
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config: { $ref: "#/components/schemas/Config" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/ServerError" }


  /api/v1/app:
    get:
      tags: [App, GET]
      operationId: v1GetEnvironment
      summary: Where things lie and what the app is
      description: |
        What does not change while the app runs: the folders it uses and
        their defaults, whether it is a bundle or a script, the two
        defaults behind settings, the Graph Explorer's address, the scopes
        the chosen sources need with one example query each, and the
        ready-made snippet for a Claude client. It used to travel with
        every status answer – paths and all – which is nothing a polled
        answer should repeat. The page asks once, and again after a save.
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, description: "The program's version." }
                  build: { type: string, description: "The commit it was built from, where that is known." }
                  api_version: { type: string, description: "The contract this API answers under – the same value as the `X-Munimentum-Api` header on every answer and as the path segment. Here, not in the polled status: it does not change." }
                  releases_url: { type: string }
                  default_client_id: { type: string, description: "The app registration used unless someone enters their own." }
                  data_dir: { type: string }
                  data_dir_default: { type: string }
                  index_dir: { type: string }
                  index_dir_default: { type: string }
                  home_dir: { type: string, description: "The app folder – settings, token, run history." }
                  app_location: { type: string }
                  frozen: { type: boolean, description: "A bundle, not a source checkout." }
                  skip_folders_default: { type: array, items: { type: string } }
                  filetype_hidden_default: { type: array, items: { type: string } }
                  graph_explorer: { type: string }
                  scopes_needed: { type: array, items: { type: string } }
                  scope_queries: { type: object, additionalProperties: { type: string }, description: "One example query per scope – the assistant shows them." }
                  ollama_hint: { type: object, description: "How to install Ollama on this system." }
                  mcp_client: { type: object, description: "The client configuration for Claude, http and stdio." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/runs:
    get:
      tags: [Archive, GET]
      operationId: v1ListRuns
      summary: What the app has run
      description: |
        The run history (runs.db): one row per run the app drove, newest
        first, with its steps, their counts and how long they took. A run
        someone started elsewhere – the scheduler, a second window – is in
        here just the same.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  limit: { type: integer, description: "The cap this answer was built with." }
                  has_more: { type: boolean, description: "The answer is as long as the cap, so something may have been left out. Narrow with `contains` or `source` – there is no paging here." }
              example:
                items:
                - id: 87
                  started_at: 1772690402.1
                  finished_at: 1772690688.4
                  job_type: job.export
                  origin: schedule
                  result: done
                  app_version: 13.0.0
                  steps:
                  - key: outlook
                    label: job.step.outlook
                    duration_s: 118.2
                    new: 7
                    unchanged: 234
                    excluded: 0
                    errors: 0
                    skipped: 0
                    ok: 1
                limit: 50
                has_more: false
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Archive, POST]
      operationId: v1StartRun
      x-starts-run: true
      summary: Start a run
      description: |
        One run at a time. The body names the steps by the keys the step
        registry uses (`outlook`, `teams`, `onedrive`, `sharepoint`,
        `sharepoint_pages`, `planner`, `todo`, `onenote`, `calendar`,
        `index`, `archiv_pruefen`, `check_*`) and how they should work.
        The answer is `202` with `Location: /api/v1/runs/current`: the run
        is on, its progress travels with `/api/v1/status` and its lines with
        `/api/v1/log`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                label: { type: string, description: "Text key for the run window, e.g. job.export." }
                unit: { type: string, description: "Only this folder, chat, board or list." }
                embeddings: { type: [boolean, "null"], description: "Index with or without embeddings; null follows the setting." }
                sync_now: { type: boolean, description: "Fetch even when the schedule would wait." }
                full_sync: { type: boolean, description: "Forget the delta pointer for the sources in this run." }
                resync: { type: boolean }
                resync_folders: { type: array, items: { type: string } }
                calendar_full: { type: boolean }
                check_rows:
                  type: array
                  items: { type: string, enum: [outlook_mail, outlook_calendar, outlook_contacts, teams, onedrive, sharepoint, sharepoint_pages, planner, todo, onenote] }
                  description: "For the completeness checks (`check`, `check_teams`, …): the balance rows to judge, whether or not their source is ticked for the export – the Insights card's own selection. Absent, a check follows the export's switches. A row whose source needs a URL list runs only when that list is set."
                legacy_comments: { type: boolean }
            example: { outlook: true, index: true, label: "job.export" }
      responses:
        "202":
          description: The run is on.
          headers:
            Location: { schema: { type: string }, description: "/api/v1/runs/current" }
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { type: string }
                  message: { $ref: "#/components/schemas/MessageOrKey" }
              example:
                run: /api/v1/runs/current
                message:
                  k: srv.run.started
                  v: {}
        "409":
          description: A run is already on, or nothing was selected (srv.busy, srv.inactive).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/runs/current:
    get:
      tags: [Archive, GET]
      operationId: v1CurrentRun
      summary: The run that is on
      description: |
        What a started run answered with in `Location`: the live block –
        label, steps, the step it is in, progress, when it started and
        the log cursor before its first line. Nothing running is a `404`:
        the monitor exists while the run does. What a finished run did is
        in `/api/v1/runs`.
      responses:
        "200":
          description: The run, as the status carries it.
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/LiveRun" }
              example:
                run:
                  label: job.export
                  steps:
                  - job.step.outlook
                  - job.step.index
                  step: job.step.outlook
                  index: 0
                  progress:
                    done: 120
                    total: 480
                  started: '2026-03-05T06:00:02'
                  log_seq: 118
        "404":
          description: Nothing is running (srv.run.none).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Archive, DELETE]
      operationId: v1CancelRun
      summary: Stop the run that is on
      description: |
        Asks the run to stop; steps end at their next safe point, so the
        archive is never left half-written. What was fetched stays.
      responses:
        "204":
          description: Asked to stop; no body.
        "404":
          description: Nothing is running (srv.run.none) – as GET says it.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/log:
    get:
      tags: [Archive, GET]
      operationId: v1Log
      summary: The app's live log
      description: |
        The live log, from `since` on. `seq` is the cursor: hand it back as
        `since` next time and only what is new comes. Every line carries
        its level and its text – a text key with placeholders where the app
        has one, so the reader chooses the language.
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 }, description: "The `seq` of the last answer." }
      responses:
        "200":
          description: The lines, and the cursor.
          content:
            application/json:
              schema:
                type: object
                required: [items, seq]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
                  seq: { type: integer }
              example:
                items:
                - n: 119
                  t: 06:00:02
                  level: info
                  text:
                    k: job.step.outlook
                    v: {}
                - n: 120
                  t: 06:04:41
                  level: warn
                  text: 'Ordner übersprungen: Junk'
                seq: 120
        "400":
          description: A number in the query that is not one (srv.badparam).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/runs/{id}/log:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Archive, GET]
      operationId: v1RunLog
      summary: The lines a past run wrote
      description: |
        What a run wrote, oldest first, as it was stored while it ran –
        unlike the live log this needs no cursor. Old logs are pruned by
        `log_retention_days`.
      responses:
        "200":
          description: The lines this run kept.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/StoredLogLine" } }
        "404":
          description: No such run (srv.run.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/balance/{row}:
    parameters:
      - { $ref: "#/components/parameters/BalanceRow" }
    get:
      tags: [Archive, GET]
      operationId: v1BalanceRow
      summary: One row of the completeness balance
      description: |
        What the row's last check wrote about what it holds and what is
        still open – the small stored report, not the full aggregation
        behind `/api/v1/analytics`. Rows, not sources: the mailbox check
        writes three reports, one each for mail, calendar and contacts,
        and none called `outlook` – which is why the balance has a path
        of its own beside `/sources`.
      responses:
        "200":
          description: The report, or null where none was written yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    oneOf:
                      - { $ref: "#/components/schemas/Bilanz" }
                      - { type: "null" }
              example:
                report:
                  quelle: outlook_mail
                  einheit: mails
                  geprueft: '2026-03-04T21:00:00+00:00'
                  stand: teilweise
                  grund: null
                  da: 19891
                  offen: 3
                  ausgeschlossen: 4120
                  behalten: 12
                  wartend: 0
                  verweigert: 0
                  weg: 0
                  zeilen:
                  - pfad: Posteingang
                    da: 241
                    offen: 3
        "404":
          description: No such balance row (srv.archiv.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/balance/{row}/fetch:
    parameters:
      - { $ref: "#/components/parameters/BalanceRow" }
    post:
      tags: [Archive, POST]
      operationId: v1FetchRow
      x-starts-run: true
      summary: Fetch what the balance found open
      description: |
        "Fetch now" on a balance row: only what that row found open, the
        cheapest way the source allows – the mailbox resyncs the folders
        with something open, a mirror fetches the open files by id, every
        other source has its regular run. The row is judged afresh at the
        end of the same run.
      responses:
        "202":
          description: The run is on.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { type: string }
        "404":
          description: No such balance row (srv.archiv.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: A run is already on (srv.busy).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/sources/{source}/refetch:
    parameters:
      - { $ref: "#/components/parameters/SourcePath" }
    post:
      tags: [Archive, POST]
      operationId: v1RefetchSource
      x-starts-run: true
      summary: Fetch again what the check found missing
      description: |
        Exactly the files the stored archive check found missing or short,
        written to a list the source's step reads. With nothing open the
        answer is `200` and says so instead of starting a run.
      responses:
        "202":
          description: The run is on.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, properties: { run: { type: string } } }
        "200":
          description: Nothing to fetch (srv.archiv.nothing).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/MessageOrKey" }
        "400":
          description: No such source (srv.archiv.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: A run is already on (srv.busy).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/sources/{source}/rebuild:
    parameters:
      - { $ref: "#/components/parameters/SourcePath" }
    post:
      tags: [Archive, POST]
      operationId: v1RebuildSource
      x-starts-run: true
      summary: Build this source's export and index again
      description: |
        For bookkeeping that is damaged beyond repair: one run of three
        steps – the archive step, the source's export with `sync_now`, then
        the index. Nothing is deleted; what cannot be read is set aside.
      responses:
        "202":
          description: The run is on.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, properties: { run: { type: string } } }
        "200":
          description: Nothing damaged to rebuild (srv.archiv.nothing).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/MessageOrKey" }
        "400":
          description: No such source (srv.archiv.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: A run is already on (srv.busy).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/sources/{source}/findings:
    parameters:
      - { $ref: "#/components/parameters/SourcePath" }
    patch:
      tags: [Archive, PATCH]
      operationId: v1UpdateFindings
      x-starts-run: true
      summary: What becomes of what the check found
      description: |
        `noted` writes a tombstone for what is gone for good, `set-aside`
        moves what does not belong out of the export folder (it stays on
        disk, in `_fremd`), `open` brings it back. Each is a run of its own,
        so the run window shows what happens and the history keeps it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [noted, set-aside, open] }
                kinds:
                  type: array
                  items: { type: string, enum: [lost, missing] }
                  description: "Which findings the mark applies to. Default: lost."
            example: { state: noted, kinds: [lost, missing] }
      responses:
        "202":
          description: The run is on.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, properties: { run: { type: string } } }
        "200":
          description: Nothing to do (srv.archiv.nothing).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/MessageOrKey" }
        "400":
          description: An unknown state, or a kind of finding that cannot be marked (srv.archiv.badstate, srv.archiv.badkind).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No such source (srv.archiv.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: A run is already on (srv.busy).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/sources/{source}/open:
    parameters:
      - { $ref: "#/components/parameters/SourcePath" }
    post:
      tags: [Archive, POST]
      operationId: v1OpenSourceFolder
      summary: Show this source's folder in the file manager
      description: A side effect on this machine, not a change to anything here.
      responses:
        "200":
          description: The folder that was opened.
          content:
            application/json:
              schema: { type: object, properties: { path: { type: string } } }
        "404":
          description: No such source (srv.archiv.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "500":
          description: The file manager did not open (srv.archiv.open.fail).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sources/{source}/folder-plan:
    parameters:
      - name: source
        in: path
        required: true
        description: |
          The six of the eight sources (`SourcePath`) that have folder
          rules; the other two answer 404. The mailbox's calendars are
          its second unit – `unit: calendar` in the body – not a source
          of their own.
        schema: { type: string, enum: [outlook, onedrive, sharepoint, teams, todo, onenote] }
    query:
      tags: [Archive, QUERY]
      operationId: v1FolderPlan
      summary: What the next run would take along
      description: |
        The rules from the body, not the saved ones: this is the preview
        next to the field someone is editing. Answers which units are in
        and which are out, and which rule decided it. Starts nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The source's rule fields, e.g. `folder_rules`, `skip_folders`, `onedrive_rules`, `sharepoint_rules`.
              properties:
                unit:
                  type: string
                  enum: [mail, calendar]
                  default: mail
                  description: "Mailbox only: whose rules to preview – the folders' (`folder_rules`, `skip_folders`) or the calendars' (`calendar_rules`)."
      responses:
        "200":
          description: In, out, and the rule behind each.
          content:
            application/json:
              schema:
                type: object
                properties:
                  regeln: { type: array, items: { type: string } }
                  an: { type: array, items: { type: object, additionalProperties: true } }
                  aus: { type: array, items: { type: object, additionalProperties: true } }
              example:
                regeln:
                - '- E-Mail/Archiv/**'
                an:
                - pfad: E-Mail/Posteingang
                  elemente: 241
                  archiv: 238
                  regel: null
                aus:
                - pfad: E-Mail/Archiv
                  elemente: 19650
                  archiv: 4711
                  regel: '- E-Mail/Archiv/**'
        "400":
          description: The question is missing or says nothing about what it is (srv.query.empty, srv.query.notype), or `unit` is not the mailbox's (srv.plan.badunit).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No such source, a source without rules, or no folder list yet – the first run writes it (srv.archiv.unknown, srv.plan.nosource, srv.plan.nolist).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/analytics:
    get:
      tags: [Archive, GET]
      operationId: v1Analytics
      summary: The numbers behind Insights
      description: |
        Everything the overview shows: how far the archive reaches, per
        month and source, the gaps, the completeness balance and the
        archive check's rows. Materialised by the index run; this reads.
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/analytics/refresh:
    post:
      tags: [Archive, POST]
      operationId: v1RefreshAnalytics
      summary: Compute the numbers afresh
      description: |
        The one way to invalidate everything at once – it reads the
        archive, so it takes a moment. Answers the fresh numbers.
      responses:
        "200":
          description: The numbers, computed now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/schedule:
    patch:
      tags: [App, PATCH]
      operationId: v1UpdateSchedule
      summary: The plan that runs by itself
      description: |
        Which sources the schedule takes along, and how often. The fields
        the body names, nothing else; the answer says when it is next due.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                interval_minutes: { type: integer }
                outlook: { type: boolean }
                teams: { type: boolean }
                onedrive: { type: boolean }
                sharepoint: { type: boolean }
                sharepoint_pages: { type: boolean }
                planner: { type: boolean }
                todo: { type: boolean }
                onenote: { type: boolean }
                calendar: { type: boolean }
                index: { type: boolean }
      responses:
        "200":
          description: The plan as it now is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule: { $ref: "#/components/schemas/Schedule" }
                  next: { type: [string, "null"], description: "When it is next due." }
                  message: { $ref: "#/components/schemas/MessageOrKey" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/storage:
    patch:
      tags: [App, PATCH]
      operationId: v1UpdateStorage
      summary: Where the archive and the index lie
      description: |
        Both paths are settings. **Nothing is moved**: relocating folders
        is the user's business, and the app never does it by itself. Both
        are fixed since startup and go to every subprocess as its working
        directory, so a change takes effect on the next start –
        `restart_required` says whether that is the case. Empty means the
        default under the home folder. Two profiles must never share a
        folder; that is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_dir: { type: string }
                index_dir: { type: string }
      responses:
        "200":
          description: The paths as they now are.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data_dir: { type: string }
                  index_dir: { type: string }
                  restart_required: { type: boolean }
        "400":
          description: The folder cannot be used, or another profile has it (srv.datadir.*).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/mcp:
    patch:
      tags: [App, PATCH]
      operationId: v1UpdateMcp
      summary: The endpoint Claude talks to
      description: |
        `running` says whether the local MCP endpoint should be on. It
        needs an index; without one, starting is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [running]
              properties:
                running: { type: boolean }
      responses:
        "200":
          description: The endpoint's state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcp: { $ref: "#/components/schemas/McpState" }
                  message: { $ref: "#/components/schemas/MessageOrKey" }
        "400":
          description: "`running` is missing, or not a boolean (srv.mcp.badaction)."
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: It cannot start – no index, or the port is taken.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/ollama/recheck:
    post:
      tags: [App, POST]
      operationId: v1RecheckOllama
      summary: Ask Ollama again
      description: |
        The status keeps a cached answer; this asks now – after installing
        a model, say. Answers everything the check found, the models
        included.
      responses:
        "200":
          description: What Ollama answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ollama: { $ref: "#/components/schemas/OllamaStatus" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/updates/check:
    post:
      tags: [App, POST]
      operationId: v1CheckUpdate
      summary: Look for a newer version
      description: |
        Asks GitHub's releases – the only request this app makes that is
        not Microsoft Graph, and only when asked or once a day.
      responses:
        "200":
          description: What the check found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  update: { $ref: "#/components/schemas/UpdateState" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/access/token:
    put:
      tags: [App, PUT]
      operationId: v1PutToken
      summary: Put an access key in place
      description: |
        The key someone copied from the Graph Explorer, `Bearer` prefix and
        all; it replaces whatever was there. It is stored in the profile's
        folder, readable only by this user. The answer says what the key is
        good for – and refuses one that is already expired or too short to
        be one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The key's state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/TokenStatus" }
                  message: { $ref: "#/components/schemas/MessageOrKey" }
        "400":
          description: No key, too short, or already expired (srv.token.*).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/access/session:
    post:
      tags: [App, POST]
      operationId: v1SignIn
      summary: Sign in with Microsoft
      description: |
        Starts the device-code flow: the answer carries the code and the
        URL to enter it at. Afterwards the app keeps permission to issue
        itself new keys; it never sees a password.
      responses:
        "200":
          description: The device code, and where to enter it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: "#/components/schemas/DeviceCode" }
        "500":
          description: Microsoft refused the sign-in (srv.login.failed), or the server itself failed (srv.internal).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [App, DELETE]
      operationId: v1SignOut
      summary: Sign out
      description: |
        Forgets the refresh token and the cached key. The archive on disk
        stays as it is.
      responses:
        "204":
          description: Signed out; no body.
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/access/notice:
    delete:
      tags: [App, DELETE]
      operationId: v1DismissNotice
      summary: Dismiss the note about a key that died mid-run
      description: |
        "Later": without this the wizard would open again on every poll.
      responses:
        "204":
          description: Dismissed; no body.
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/profiles:
    get:
      tags: [App, GET]
      operationId: v1ListProfiles
      summary: The archives on this machine
      description: |
        One profile is one archive: its own folder, its own settings, its
        own index. Says which one is open, which was last open, and whether
        the app asks at start.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileStatus" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [App, POST]
      operationId: v1CreateProfile
      summary: A new archive
      description: |
        A profile is one archive with one account, one index and its own MCP
        snippet. Creating one writes its folder; it is opened with
        `POST /api/v1/profiles/{name}/open`, which restarts the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "Lower case, letters, digits, dash and underscore." }
      responses:
        "201":
          description: The new profile.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/ProfileInfo" }
                  profiles: { $ref: "#/components/schemas/ProfileStatus" }
        "400":
          description: The name is none, or taken (srv.profile.*).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [App, PATCH]
      operationId: v1UpdateProfileRegister
      summary: What holds for all of them
      description: |
        `ask_at_start` says whether the app asks which archive to open when
        there is more than one. A property of the register, not of one
        profile – hence the PATCH on the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ask_at_start]
              properties:
                ask_at_start: { type: boolean }
      responses:
        "200":
          description: The setting as it now is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ask_at_start: { type: boolean }
                  profiles: { $ref: "#/components/schemas/ProfileStatus" }
        "400":
          description: The body names no field to change (srv.profile.nofield), or `ask_at_start` is not a boolean (srv.profile.badvalue).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/profiles/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [App, GET]
      operationId: v1Profile
      summary: One profile
      description: |
        The profile under that name – what `Location` names when one is
        created: its account, its folders, whether it holds an index and
        when it last ran. `aktiv` says whether this instance runs it.
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: "#/components/schemas/ProfileInfo" }
        "404":
          description: No profile of that name (srv.profile.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [App, PATCH]
      operationId: v1RenameProfile
      summary: Rename an archive
      description: |
        A folder rename under `profiles/` – only for a profile that is not
        open, and not while a run is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The new name, and the profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  profiles: { $ref: "#/components/schemas/ProfileStatus" }
        "400":
          description: No such profile, the name is taken, or it is the open one (srv.profile.*).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: A run is on (srv.busy).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/profiles/{name}/open:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [App, POST]
      operationId: v1OpenProfile
      summary: Open this archive
      description: |
        The one that is already open answers at once. One open in another
        instance hands over its address in `url`. Otherwise this server
        stops and comes back up with that profile – the answer goes out
        first, and the page waits for the app to answer again. The chooser
        at startup serves this same path, and takes `ask_at_start` with it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ask_at_start: { type: boolean, description: "Only the chooser: whether to ask again next start." }
      responses:
        "200":
          description: Which archive is open, and where.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  url: { type: string }
        "400":
          description: Profiles are not possible here – one fixed data folder (srv.profile.impossible); in the chooser also `ask_at_start` that is not a boolean (srv.profile.badvalue).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No such profile (srv.profile.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: A run is on (srv.busy).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/reports:
    query:
      tags: [App, QUERY]
      operationId: v1BuildReport
      summary: Build a report to paste into an issue
      description: |
        Takes the log the page shows and what the user typed, and returns
        the finished report: the system lines, the log, a title and the
        URL of a prefilled GitHub issue. **Addresses, user names and paths
        are replaced before it is handed back** – it is shown for editing,
        and sent by nobody but the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                log: { type: string }
                hint: { type: string, description: "What the user wrote, or the last error line." }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
              example:
                system:
                - k: version
                  v: 13.0.0 (0028dd5)
                - k: os
                  v: macOS 15.3 (arm64)
                log: '06:00:02  Export gestartet
                
                  06:04:41  BrokenProcessPool'
                title: 'BrokenProcessPool: abrupt beendet'
                url: https://github.com/n-schilling/munimentum/issues/new
        "400":
          description: The question is missing, or says nothing about what it is (srv.query.empty, srv.query.notype).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/quit:
    post:
      tags: [App, POST]
      operationId: v1Quit
      summary: Stop the app
      description: |
        Shuts the server down, and with it the MCP endpoint. A run that is
        on is asked to stop first. The answer may not arrive – by then the
        server may already be gone.
      responses:
        "204":
          description: Going; no body.
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/openapi:
    get:
      tags: [App, GET]
      operationId: v1OpenApi
      summary: This description
      description: The full HTTP API as OpenAPI 3.2, as the app ships it.
      responses:
        "200":
          description: The YAML file.
          content:
            text/yaml:
              schema: { type: string }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/status:
    get:
      tags: [App, GET]
      operationId: getStatus
      summary: Complete application state
      description: |
        Polled by the page. Carries token state, Ollama state, index and
        export inventories, the job runner snapshot (`jobs.seq` is the log
        cursor), MCP state, update info and auth state.

        **Only what changes on its own.** Since 12.0 three things that do
        not are gone from here, because this answer is polled every few
        seconds and a poll should not keep repeating them: the settings
        (`/api/v1/config`), the paths, defaults and client snippet
        (`/api/v1/app`) and what the sources hold, folder names and all
        (`/api/v1/inventory`). That took the answer from about 8 KB to
        under 2.5. Since 13.0 the index's own state (`store`) is in the
        inventory too: it changes with a run, and its `features` were a
        list of column names repeated in every poll. While the chooser holds the port (more than one
        profile, none named at start) the answer is `{"chooser": true}`
        instead – the page polls until the app answers.
      responses:
        "200":
          description: The state object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/TokenState" }
                  ollama: { $ref: "#/components/schemas/OllamaState" }
                  calendar:
                    type: object
                    properties:
                      built_at: { type: [string, "null"], description: "Null means the calendar step has not run." }
                  jobs: { $ref: "#/components/schemas/JobsState" }
                  mcp:
                    type: object
                    description: "Whether the endpoint runs, its address, and why it does not. The client snippet is in /api/v1/app, the port in the settings."
                    properties:
                      running: { type: boolean }
                      url: { type: string }
                      error: { $ref: "#/components/schemas/MessageOrKey" }
                  schedule_next:
                    type: [string, "null"]
                    description: When the schedule runs next – null when it is off or nothing is due. Whether it is on at all is a setting.
                  wizard:
                    type: [string, "null"]
                    enum: [token, ollama, null]
                    description: Which assistant the app would open – decided here, not in the page.
                  update: { $ref: "#/components/schemas/UpdateState" }
                  auth:
                    type: object
                    description: What follows from the settings; the mode and the ids themselves are settings.
                    properties:
                      signed_in: { type: boolean }
                      account: { type: [string, "null"], description: "Whose account the token belongs to." }
                      own_registration: { type: boolean, description: "An app registration of your own, not the built-in one." }
                      device:
                        oneOf:
                          - { $ref: "#/components/schemas/DeviceCode" }
                          - { type: "null" }
                  profile: { $ref: "#/components/schemas/ProfileState" }
              example:
                jobs:
                  busy: false
                  job: null
                  last: null
                  token_expired: false
                  seq: 42
                mcp:
                  running: true
                schedule_next: '2026-03-05T06:00:00'
                wizard: null
                update:
                  status: ok
                  latest: 13.0.0
                  newer: false
                  ahead: false
                  url: null
                  error: null
                auth:
                  signed_in: true
                  account: alice.beispiel@nordwind.example
                  own_registration: false
                  device: null
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/inventory:
    get:
      tags: [Archive, GET]
      operationId: v1GetInventory
      summary: What the sources hold
      description: |
        Per source: where its export lies, when it last ran, and the
        summary of its folders, chats, calendars, lists and notebooks –
        how many there are, how many the rules take along, and which ones
        are new or gone. This changes with a run, not with a poll, so it
        left the status answer: names of mail folders are not something to
        repeat every few seconds. The page asks when it shows the sources
        and after a run. The index's own state (`store`) joined it in 13.0,
        for the same reason.
      responses:
        "200":
          description: The inventory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    type: object
                    description: |
                      What the search can do right now: `exists`, `semantic`,
                      `built_at` and `features` – what this index carries,
                      which is what the interface offers a filter for:
                      the columns `gone`, `thread`, `ext`, `key`, `who_mail`,
                      `domains`, and `mail_lines` when all the mail lines of
                      13.0 are there.
                      How much the index holds is in /api/v1/analytics.
                    properties:
                      exists: { type: boolean }
                      semantic: { type: boolean }
                      features: { type: array, items: { type: string } }
                      built_at: { type: [string, "null"] }
                  exports:
                    type: object
                    description: Per source dir/exists/last_run.
                  folders: { $ref: "#/components/schemas/Bestand" }
                  folders_onedrive: { $ref: "#/components/schemas/Bestand" }
                  conversations: { $ref: "#/components/schemas/Bestand" }
                  lists: { $ref: "#/components/schemas/Bestand" }
                  calendars:
                    type: object
                    description: abgeglichen, gesamt, gewaehlt, namen, neu.
                  notebooks:
                    type: object
                    description: abgeglichen, gesamt, gewaehlt, namen, neu, eintraege.
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }


components:
  mediaTypes:
    Problem:
      # One refusal, one shape, one place: every 4xx and 5xx on this
      # surface answers this – RFC 9457 as `application/problem+json`.
      schema: { $ref: "#/components/schemas/Error" }
  schemas:
    SourceKey:
      type: string
      description: A kind of item as the index names it – `datei` is every mirrored file, whichever drive it came from (see `root`).
      enum: [outlook, teams, kalender, kontakte, datei, pages, planner, todo, onenote]
    SourceFilter:
      type: string
      description: |
        The source filter: one key or several comma-separated. `outlook`,
        `kalender`, `kontakte`, `pages`, `planner`, `todo` and `onenote`
        name one kind each; `onedrive` and `sharepoint` one file mirror
        each, `datei` every file mirror at once; `teams` the conversations
        and the files shared in them; `all` or empty means everything.
      example: "onedrive,sharepoint"
    Report:
      type: object
      required: [system, log, title, url]
      description: |
        A report ready to paste into an issue. Addresses and user names in
        paths are replaced before it is handed back; folder names and
        subject lines are beyond what a pattern can catch, which is why it
        is shown for editing and sent by nobody but the user.
      properties:
        system:
          type: array
          description: The system lines, in the order they should be read.
          items:
            type: object
            required: [k, v]
            properties:
              k: { type: string, description: "version, os, python, cores, index …" }
              v: { type: string }
        log: { type: string, description: "The log as it was handed in – shortened and redacted." }
        title: { type: string, description: "The suggested subject, at most 120 characters." }
        url: { type: string, format: uri, description: "The prefilled issue form; the app never opens it by itself." }
    UpdateState:
      type: object
      description: |
        What the update check found. `status` is `off` when the check is
        switched off, `ok` when it answered, `error` when it could not.
        Which version runs is in `/api/v1/app`; `current` repeats it where
        the block travels on its own.
      properties:
        status: { type: string, enum: ["off", ok, error] }
        current: { type: string, description: "The running version – only on /api/v1/updates/check." }
        latest: { type: [string, "null"], description: "The newest release on GitHub." }
        url: { type: [string, "null"], format: uri, description: "That release's page." }
        newer: { type: boolean, description: "There is something newer than what runs here." }
        ahead: { type: boolean, description: "What runs here is newer than the newest release – a build from source." }
        error: { type: [string, "null"] }
    DeviceCode:
      type: object
      description: |
        A device-code sign-in in progress: the user types `code` at `url`
        and consents there. It exists only while the sign-in runs.
      required: [code, url]
      properties:
        code: { type: string, description: "The code to type." }
        url: { type: string, format: uri, description: "Where to type it – microsoft.com/devicelogin unless Microsoft names another." }
        expires_in: { type: integer, description: "Seconds the code is good for." }
    Root:
      type: string
      description: The export folder an item's file lives in – input for /api/v1/files/content.
      enum: [teams, outlook, onedrive, sharepoint, pages, planner, todo, onenote]
    Config:
      type: object
      description: The configuration as app_config.json holds it – every key with its default. A write through PATCH /api/v1/config takes any subset.
      properties:
        ollama_enabled: { type: boolean, default: true, description: "The AI switch: off, the app stops looking for Ollama and the index is built as full text only." }
        index_semantic: { type: boolean, default: true, description: "Whether the index run computes vectors (needs Ollama and the embedding model)." }
        onedrive_enabled: { type: boolean, default: false, description: "Master switch of the OneDrive mirror for the interface and the schedule." }
        onedrive_rules: { type: string, default: "", description: "Include/exclude rules over the OneDrive folder tree, one per line; empty = everything." }
        onedrive_max_mb: { type: integer, default: 0, description: "Size cap per file in MB; 0 = no cap." }
        sharepoint_enabled: { type: boolean, default: false, description: "Master switch of the SharePoint library mirror." }
        sharepoint_urls: { type: string, default: "", description: "Site or folder URLs, one per line; a folder URL mirrors that subtree." }
        sharepoint_types_include: { type: string, default: "", description: "Comma-separated extensions that alone come along; empty = every type." }
        sharepoint_types_exclude: { type: string, default: "", description: "Comma-separated extensions that never come along." }
        sharepoint_max_mb: { type: integer, default: 0, description: "Size cap per file in MB; 0 = no cap." }
        sharepoint_pages_enabled: { type: boolean, default: false, description: "Master switch of the SharePoint pages export." }
        sharepoint_pages_urls: { type: string, default: "", description: "Site URLs whose modern pages (subsites included) are exported, one per line." }
        sharepoint_pages_image_max_mb: { type: integer, default: 4, description: "Images up to this size are embedded in a page; larger ones are linked." }
        sync_cadence: { type: object, description: "Key -> always|daily|weekly|monthly: a source (onedrive, todo), a category (outlook:mail, teams:1on1), a unit (sharepoint-url:<url>, planner-url:<url>, pages-url:<url>, onenote:<id>) or a departure below a category (ou…" }
        outlook_categories: { type: array, items: { type: string }, description: "The ticked mailbox categories: mail, calendar, contacts." }
        teams_categories: { type: array, items: { type: string }, description: "The ticked Teams kinds: 1on1, group, meeting, channels." }
        check_sources: { type: array, items: { type: string }, description: "The balance rows the completeness check asks – the Insights card's own selection, all ten to begin with: outlook_mail, outlook_calendar, outlook_contacts, teams, onedrive, sharepoint, sharepoint_pages, planner, todo, onenote." }
        workers: { type: integer, default: 4, description: "How many requests go to Microsoft Graph at once. Graph allows no more than four per mailbox." }
        mirror_workers: { type: integer, default: 8, description: "Applies to OneDrive and SharePoint. Unlike the mailbox, Microsoft documents no fixed limit here – throttling is budget-based, and the run then waits visibly (HTTP 429 in the log)." }
        embed_images: { type: boolean, default: true, description: "Images end up inside the HTML file rather than as a link. Off: much smaller files, but the images are gone later." }
        cache_images: { type: boolean, default: true, description: "Images already fetched are kept, so a repeat export does not download them again." }
        refresh_channels: { type: boolean, default: true, description: "Channels are checked for changes every run: new posts via change tracking, replies on posts of the last two weeks every time, older posts once a week. Off: channels come once only, which is faster." }
        skip_empty_chats: { type: boolean, default: true, description: "Chats consisting only of joins, calls and system messages are not created." }
        include_hidden: { type: boolean, default: false, description: "Folders such as “Conversation History” that Outlook creates itself and normally hides." }
        calendar_reconstruct: { type: boolean, default: true, description: "Reads every mail for invitations and cancellations and rebuilds appointments that are no longer in the calendar. The slowest step of a run." }
        skip_folders: { type: array, items: { type: string }, description: "Folder names the default selection leaves out — trash, drafts, junk. Applies only while there are no rules above." }
        filetype_hidden: { type: array, items: { type: string }, description: "Comma-separated, e.g. “p7s, asc”. These types do not appear in the file type filter — otherwise the list fills up with what mail programs attach by themselves: signature blocks, encryption envelopes." }
        analytics_skip: { type: array, items: { type: string }, description: "One per line, spelled as it appears in the overview — usually your own name." }
        folder_rules: { type: string, default: "", description: "Include/exclude rules over the mailbox folders, one per line; empty = every folder but skip_folders." }
        calendar_rules: { type: string, default: "", description: "Include/exclude rules over the calendars; empty = the own calendar only." }
        calendar_months_back: { type: integer, default: 1, description: "After the first export a run reads only this window: that many months back plus everything ahead. What was archived before stays. 0 = every appointment, every run." }
        outlook_since: { type: string, default: "", description: "First export of a folder only: no mail older than this day. Empty = the whole history. Folders already exported are not affected." }
        teams_since: { type: string, default: "", description: "First export of a conversation only: no message older than this day. Empty = the whole history. Conversations already exported are not affected." }
        teams_rules: { type: string, default: "", description: "Rules over 1on1/<title>, group/<title>, meeting/<title>, channels/<team>/<channel>." }
        sharepoint_rules: { type: string, default: "", description: "Path rules on top of the URL list and the type filters." }
        todo_rules: { type: string, default: "", description: "Rules over the To Do list titles; empty = every list." }
        planner_sweep_hours: { type: integer, default: 24, description: "Chat comments carry no change signal, so the export re-reads them for every task at this interval (one request per task). 0 = never; “Sync now” no longer forces it." }
        index_batch: { type: integer, default: 128, description: "Chunks embedded per request to Ollama." }
        ollama: { type: string, default: "http://localhost:11434", description: "Meaning-based search and the summary need language models on this machine. They are currently run by Ollama — hence the name of the switch below." }
        embed_model: { type: string, default: "bge-m3", description: "Turns text into vectors. bge-m3 understands German and English. Changing it invalidates the existing index." }
        chat_model: { type: string, default: "qwen3.6:27b", description: "The language model that writes the summary. Larger models phrase better and need more memory." }
        answer_sources: { type: integer, default: 8, description: "How many hits the summary takes into account. More means more complete, but slower." }
        semantic_min: { type: integer, default: 45, description: "Meaning-based search also finds what does not contain your words — “applied for leave” finds the mail about the time-off request. That needs a floor: without one it always returns its best hits, even when nothing fits." }
        search_results: { type: integer, default: 20, description: "How many hits one page of search results shows. More means less paging." }
        search_history: { type: string, enum: ["off", "30", "90", "365", "forever"], default: "90", description: "How long the search history is kept: off, 30, 90 or 365 days, or forever." }
        case_export_dir: { type: string, default: "", description: "One ZIP per exported case below this path: the originals, an index page, the timeline, the list as CSV and the casebook. Empty means “Munimentum cases” in the Documents folder. Nothing is moved out of the archive." }
        internal_domains: { type: string, default: "", description: "Comma-separated, like example.com, example.org. A person in a case whose address lies outside them is marked external. Empty means the domain of the account you signed in with." }
        own_name: { type: string, default: "", description: "Your name as the archive writes it – left out of a case's People view, together with the address you signed in with. Empty means the name your sign-in carries." }
        notifications: { type: string, enum: ["off", "errors", "all"], default: "errors", description: "System notifications at the end of a run: off, errors only, or all runs." }
        keep_awake: { type: boolean, default: true, description: "Holds the machine off idle sleep while a run is on – on macOS through caffeinate, on Windows through a power request, on Linux through systemd-inhibit." }
        userflow_actions: { type: integer, default: 20, description: "Remembers the last steps taken in the interface – only their kind (tab, search, run), never content such as search text or names. Kept only in the memory of the open page and gone when it closes; the app sends nothing." }
        planner_enabled: { type: boolean, default: false, description: "Master switch of the Planner export." }
        planner_urls: { type: string, default: "", description: "Board URLs, one per line." }
        planner_attachments: { type: boolean, default: false, description: "Download the files a task references next to the board." }
        todo_enabled: { type: boolean, default: false, description: "Master switch of the To Do export." }
        onenote_enabled: { type: boolean, default: false, description: "Master switch of the OneNote export." }
        onenote_rules: { type: string, default: "", description: "Include/exclude rules over the notebooks; empty = every notebook." }
        onenote_image_max_mb: { type: integer, default: 4, description: "Images up to this size are embedded in a page; larger ones land in the page's files folder." }
        teams_attachments: { type: boolean, default: false, description: "Download the files a chat or channel post references next to the conversation." }
        teams_channel_files: { type: boolean, default: false, description: "Mirror the Files tab of every exported channel like a SharePoint library." }
        teams_files_max_mb: { type: integer, default: 0, description: "Size cap for both Teams file switches; 0 = no cap." }
        runs_retention_months: { type: integer, default: 24, description: "How far back the run overview (Insights → Runs) reaches. Only counts, durations and switches are stored per run – locally in runs.db in the data folder. Older entries are removed on start and after every run." }
        data_dir: { type: string, default: "", description: "The data folder; empty = the profile's default (data/)." }
        index_dir: { type: string, default: "", description: "The index folder; empty = the profile's default (rag_store/)." }
        log_retention_days: { type: integer, default: 14, description: "Every run's log is stored in the run history (runs.db) and shown inline under Insights → Runs. Lines older than this are dropped; the run rows themselves have their own retention above." }
        status_poll_seconds: { type: integer, default: 30, minimum: 5, maximum: 600, description: "How often the page asks /api/v1/status while nothing runs, in seconds. During a run it follows the run's own rhythm; this only decides how quickly something changed elsewhere shows up. Out-of-range values are clamped." }
        mcp_port: { type: integer, default: 8365, description: "Which port the MCP server listens on. A changed port takes effect after restarting the server." }
        mcp_enabled: { type: boolean, default: true, description: "The hard switch. Off means the server refuses to serve, no matter who starts it — the HTTP endpoint here as well as a client that launches it as a subprocess (stdio, which is how Claude Desktop does it)." }
        mcp_cases_write: { type: boolean, default: false, description: "Off: Claude reads cases and saved searches but changes nothing. On: Claude can put items and notes into open cases through the MCP tools add_to_case, add_case_note and collect_case, and run a case's automatic searches now – never delete, never close." }
        mcp_autostart: { type: boolean, default: true, description: "The HTTP endpoint then runs as soon as the app runs. It covers that one route only: clients that launch the server themselves as a subprocess (stdio) do not need it and run independently." }
        update_check: { type: boolean, default: true, description: "One request to api.github.com at start for a newer release." }
        auth_mode: { type: string, enum: ["token", "login"], default: "token", description: "How access is obtained: a pasted token, or the device-code sign-in." }
        client_id: { type: string, default: "", description: "Own app registration for the sign-in; empty = Microsoft's Graph Command Line Tools." }
        tenant: { type: string, default: "", description: "Tenant for the sign-in; empty = common." }
        device_code: { type: boolean, default: false, description: "Whether a device-code sign-in is in progress." }
        language: { type: string, enum: ["auto", "de", "en", "fr"], default: "auto", description: "Interface language; auto follows the browser." }
        tour_seen: { type: object, description: "Chapter key (archiv, quelle, suche, faelle, insights, claude) -> true once seen." }
        schedule: { $ref: "#/components/schemas/Schedule" }
    Schedule:
      type: object
      description: Repeats the run while the app is open – one switch per part, and the interval.
      properties:
        enabled: { type: boolean, default: false }
        interval_minutes: { type: integer, default: 60, minimum: 5 }
        outlook: { type: boolean, default: true }
        teams: { type: boolean, default: true }
        onedrive: { type: boolean, default: true }
        sharepoint: { type: boolean, default: true }
        sharepoint_pages: { type: boolean, default: true }
        planner: { type: boolean, default: true }
        todo: { type: boolean, default: true }
        onenote: { type: boolean, default: true }
        index: { type: boolean, default: true }
        calendar: { type: boolean, default: true }
    I18nMessage:
      type: object
      required: [k]
      description: A translatable message; the page renders lang[k] with v substituted.
      properties:
        k: { type: string, description: "A key of lang/*.json." }
        v: { type: object, description: "The placeholders the text takes." }
      example: { k: "srv.busy", v: {} }
    AnswerChunk:
      description: |
        One line of the answer stream, in the order they come: the sources
        the answer may cite first, then the text piece by piece, then
        either `done` or an `error`. A reader that meets a line it does not
        know ignores it – the stream may grow.
      oneOf:
        - $ref: "#/components/schemas/AnswerSources"
        - $ref: "#/components/schemas/AnswerText"
        - $ref: "#/components/schemas/AnswerDone"
        - $ref: "#/components/schemas/AnswerError"
    AnswerSources:
      type: object
      description: "The first line – what the answer was given to read, numbered as it cites them."
      required: [sources]
      properties:
        sources:
          type: array
          items:
            type: object
            required: [n, uid]
            properties:
              n: { type: integer, description: "The number the answer cites – [1], [2] …" }
              uid: { type: string, description: "The item, for /api/v1/documents." }
              title: { type: [string, "null"] }
              who: { type: [string, "null"] }
              date: { type: [string, "null"] }
              uri: { type: [string, "null"], description: "`o365://…` – the original behind it." }
        model: { type: string, description: "The chat model that answered." }
    AnswerText:
      type: object
      description: A piece of the answer, to be appended as it arrives.
      required: [text]
      properties:
        text: { type: string }
    AnswerDone:
      type: object
      description: The last line of a stream that ran through.
      required: [done]
      properties:
        done: { const: true }
    AnswerError:
      type: object
      description: |
        The stream stopped. `model` means the chat model is not loaded,
        `ollama` that the service itself could not be reached; `detail`
        names which model, or the error. The status stays `200` – the
        headers were sent long before this was known.
      required: [error]
      properties:
        error: { type: string, enum: [model, ollama] }
        detail: { type: string }
    Bestand:
      type: object
      description: |
        What one source holds and what comes along – the summary behind a
        source card. `neu` are folders the last sync found and the rules
        have not judged yet; `verschwunden` are ones that are gone at
        Microsoft. German keys: they are the data's own names.
      properties:
        abgeglichen: { type: [string, "null"], format: date-time }
        ordner_gesamt: { type: integer }
        ordner_gewaehlt: { type: integer }
        mails_gesamt: { type: integer }
        mails_gewaehlt: { type: integer }
        neu: { type: array, items: { type: string } }
        verschwunden: { type: array, items: { type: string } }
    CaseWrite:
      type: object
      required: [case]
      description: |
        What every change to a case answers: the case as it now is, and –
        where something was made – its id (`folder`, `note`, `list`) or how
        many items moved (`added`, `already`, `moved`). One call, and the
        caller knows the new state without asking again.
      properties:
        case: { $ref: "#/components/schemas/Case" }
        added: { type: integer }
        already: { type: integer }
        moved: { type: integer }
        hits: { type: integer, description: "With a stored result: how many it had." }
        folder: { type: integer }
        note: { type: integer }
        list: { type: integer }
    CaseItem:
      type: object
      required: [id, key]
      description: |
        One item of a case: a pointer into the archive, plus what the hit
        said when it was put there – so the row still reads when the item
        is gone from the index.
      properties:
        id: { type: integer, description: "What the API names the item by." }
        key: { type: string, description: "The stable item key (schluessel.py)." }
        src: { type: string }
        root: { type: string }
        rel: { type: string }
        title: { type: string }
        date: { type: string }
        who: { type: string }
        who_mail: { type: string, description: "From the index, where it has one." }
        added: { type: string, format: date-time }
        list: { type: [integer, "null"], description: "Came with this stored result." }
        folder: { type: [integer, "null"] }
        via: { type: string, enum: [ui, mcp, auto], description: "Who put it there: the page, Claude, or an automatic search of the case." }
        search: { type: [integer, "null"], description: "The saved search that collected it (`via: auto`)." }
        remark: { type: string }
        thread_open: { type: integer, description: "How many messages of its conversation the case lacks." }
    CaseItemIn:
      type: object
      required: [key]
      description: One item as a caller hands it over.
      properties:
        key: { type: string }
        src: { type: string }
        root: { type: string }
        rel: { type: string }
        title: { type: string }
        date: { type: string }
        who: { type: string }
        remark: { type: string }
    CaseFolder:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        created: { type: string, format: date-time }
        items: { type: integer }
    CaseNote:
      type: object
      required: [id, text]
      properties:
        id: { type: integer }
        when: { type: string, format: date-time }
        text: { type: string }
        via: { type: string, enum: [ui, mcp] }
    CaseResultList:
      type: object
      required: [id, criteria]
      properties:
        id: { type: integer }
        when: { type: string, format: date-time }
        criteria: { $ref: "#/components/schemas/Criteria" }
        hits: { type: integer, description: "How many it had when it was taken." }
        folder: { type: [integer, "null"] }
    Case:
      type: object
      required: [id, name, status]
      description: |
        A case on the versioned surface: the same thing `Fall` describes,
        with English names (rest.py maps them). The four lists come with
        one case, not with the list of them.
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, closed] }
        created: { type: string, format: date-time }
        changed: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        exported: { type: [string, "null"], description: "Path of the last export." }
        exported_at: { type: [string, "null"], format: date-time }
        items: { type: integer, description: "How many items the case holds." }
        items_by_source: { type: object, additionalProperties: { type: integer } }
        lists: { type: integer }
        notes: { type: integer }
        searches: { type: integer }
        folders: { type: integer }
        folder_list:
          type: array
          items: { $ref: "#/components/schemas/CaseFolder" }
        item_list:
          type: array
          description: With one case only, not with the list of them.
          items: { $ref: "#/components/schemas/CaseItem" }
        list_list:
          type: array
          items: { $ref: "#/components/schemas/CaseResultList" }
        note_list:
          type: array
          description: The casebook, newest first.
          items: { $ref: "#/components/schemas/CaseNote" }
        search_list:
          type: array
          description: The saved searches attached to the case.
          items: { $ref: "#/components/schemas/SavedSearch" }
    Error:
      type: object
      required: [ok, type, title, status, detail]
      description: |
        Every refusal, whatever the route and the status: a problem detail
        as RFC 9457 describes it, served as `application/problem+json`.
        `detail` is always English – it ends up in scripts, logs and bug
        reports, and one language there beats a sentence that changes with
        a setting. Two members are our own: `ok`, so the page can ask one
        question of every answer, and `error` with the text key and its
        placeholders, which the page renders in the user's language. A
        reason that comes from the search engine rather than the app has
        no key, and thus no `error`. The fields the route's own answer
        would have (an empty list, the token's state) are kept beside it.
      properties:
        ok: { const: false }
        type: { type: string, description: "`urn:munimentum:error:<key>`, or `about:blank` when there is no key." }
        title: { type: string, description: "The status code's phrase." }
        status: { type: integer }
        detail: { type: string, description: "The finished sentence, always English." }
        instance: { type: string, description: "The path that was asked for." }
        error:
          type: object
          required: [k]
          properties:
            k: { type: string, description: "A key of lang/*.json." }
            v: { type: object, description: "The placeholders the text takes." }
      example:
        ok: false
        type: "urn:munimentum:error:srv.busy"
        title: Conflict
        status: 409
        detail: A job is already running.
        instance: /api/v1/runs
        error: { k: "srv.busy", v: {} }
    MessageOrKey:
      description: Either a plain sentence or an i18n message object.
      oneOf:
        - { type: string }
        - { $ref: "#/components/schemas/I18nMessage" }
    Bilanz:
      type: object
      required: [quelle, geprueft, stand]
      description: |
        One source's completeness balance (completeness.py). The question
        it answers: would a run with today's settings fetch anything now
        that is not here yet? erwartet = da + offen + wartend; nothing the
        settings leave out counts towards it.
      properties:
        quelle: { type: string, description: "Source key, as in /api/v1/analytics → pruefungen." }
        einheit: { type: string, description: "Unit of the counts: mails, events, contacts, conversations, files, pages, tasks (progress.unit.* text keys)." }
        geprueft: { type: string, format: date-time }
        stand: { type: string, enum: [ganz, teilweise, nicht], description: "Whether the check itself came through; teilweise names the units in `fehler`, nicht carries a `grund`." }
        grund: { type: [string, "null"], description: "Text key saying why the check could not run (stand = nicht)." }
        da: { type: integer, description: "Here and current, from the export's own bookkeeping." }
        offen: { type: integer, description: "Expected but not here: new since the last run, changed since, or failed then." }
        ausgeschlossen: { type: integer, description: "Deliberately left out by the settings – a count, never names." }
        ausgeschlossen_einheit: { type: string, description: "Unit of `ausgeschlossen` where it differs (calendars, lists, notebooks)." }
        behalten: { type: integer, description: "Gone at Microsoft, kept here." }
        wartend: { type: integer, description: "Mirrors only: files waiting for their folder cadence." }
        verweigert: { type: integer, description: "Listed by Microsoft but refused (a 403, a malware verdict): recorded by the export, never open – no fetch will bring it until a full sync." }
        weg: { type: integer, description: "Listed by Microsoft but no longer there when asked (404): recorded by the export, never open." }
        offene:
          type: array
          description: "Mirrors, Teams, calendar and contacts: the open items by id – what Fetch now fetches one by one, without a second walk or listing. Mirrors name drive items (`id`, `rel`); Teams names conversations (`id` the chat id or `ch:` and the channel id, `rel` the conversation's file when one exists, `pfad` its row); the calendar and the contacts name events and contacts (`id`, `rel` the file when one exists, `pfad` the calendar or folder, `art` event or contact). Mail is counted, not listed, by its check and has none. Capped at 2000; `offene_gekappt` says so, and Fetch now then runs the source's wider way."
          items:
            type: object
            properties:
              id: { type: string }
              rel: { type: string }
              pfad: { type: string }
              art: { type: string, enum: [event, contact] }
        offene_gekappt: { type: boolean, description: "Whether `offene` was capped." }
        zeilen:
          type: array
          description: Only units with something open – a folder, calendar, board, list, notebook, site.
          items:
            type: object
            properties:
              pfad: { type: string }
              da: { type: integer }
              offen: { type: integer }
        fehler:
          type: array
          description: Units the check could not judge.
          items:
            type: object
            properties:
              pfad: { type: string }
              grund: { type: string, description: "A run.* or ana.check.reason.* text key." }
        bytes: { type: integer, description: "Mirrors only: bytes a run would hold." }
        bytes_ausgeschlossen: { type: integer, description: "Mirrors only." }
        typen: { type: array, description: "Mirrors only: files per extension (ext, n, bytes) inside the path scope, before type and size filters." }
    ProfileInfo:
      type: object
      required: [name, aktiv]
      properties:
        name: { type: string }
        aktiv: { type: boolean, description: "The profile this instance runs." }
        ordner: { type: string }
        konto: { type: [string, "null"], description: "Account of the stored access, if any." }
        last_run: { type: [string, "null"] }
        index: { type: boolean, description: "Whether an index exists." }
    ProfileState:
      type: object
      required: [name, moeglich, mehrere]
      description: What every status poll carries about profiles.
      properties:
        name: { type: string }
        moeglich: { type: boolean, description: "False under --data-dir, and while an archive from before 10.0 has not moved into profiles/ yet: one archive, no profiles." }
        mehrere: { type: boolean }
    ProfileStatus:
      type: object
      properties:
        name: { type: string }
        moeglich: { type: boolean, description: "As in ProfileState." }
        mehrere: { type: boolean }
        ohne_nachfrage: { type: boolean }
        zuletzt: { type: [string, "null"], description: "The profile opened last, if it still exists." }
        alle: { type: array, items: { $ref: "#/components/schemas/ProfileInfo" } }
    TokenState:
      type: object
      description: |
        What the interface acts on: whether there is a usable key, whose it
        is, how long it holds and which scopes it lacks. `PUT /api/v1/access/token`
        answers the full `TokenStatus` when one is pasted.
      properties:
        present: { type: boolean }
        valid: { type: boolean }
        expired: { type: boolean }
        account: { type: [string, "null"] }
        name: { type: [string, "null"] }
        expires_in_minutes: { type: [integer, "null"] }
        missing: { type: array, items: { type: string }, description: "Scopes the chosen sources need and the key does not carry." }
    OllamaState:
      type: object
      description: |
        Four answers, no inventory: is it there, are the two models it
        needs there, and is the whole thing switched off. Which models
        those are is a setting; what else is installed is nobody's
        business. `POST /api/v1/ollama/recheck` answers the full probe.
      properties:
        running: { type: boolean }
        has_model: { type: boolean, description: "The embedding model named in the settings is loaded." }
        has_chat_model: { type: boolean }
        disabled: { type: boolean }
    TokenStatus:
      type: object
      required: [present, valid, expired]
      properties:
        present: { type: boolean }
        valid: { type: boolean }
        expired: { type: boolean }
        readable: { type: boolean }
        account: { type: [string, "null"] }
        name: { type: [string, "null"] }
        expires_at: { type: [string, "null"] }
        expires_in_minutes: { type: [integer, "null"] }
        scopes: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
    OllamaStatus:
      type: object
      properties:
        running: { type: boolean }
        models: { type: array, items: { type: string } }
        has_model: { type: boolean }
        has_chat_model: { type: boolean }
        error: { type: [string, "null"] }
        model: { type: string }
        chat_model: { type: string }
        url: { type: string }
        disabled: { type: boolean }
    JobsState:
      type: object
      properties:
        busy: { type: boolean }
        job:
          oneOf:
            - { $ref: "#/components/schemas/LiveRun" }
            - { type: "null" }
        last:
          oneOf:
            - { $ref: "#/components/schemas/LastRun" }
            - { type: "null" }
        token_expired: { type: boolean }
        seq: { type: integer, description: "Cursor for /api/v1/log." }
    LiveRun:
      type: object
      description: |
        The run that is on, as the status carries it and
        `GET /api/v1/runs/current` answers it.
      required: [label, steps, step, index, started, log_seq]
      properties:
        label: { type: string, description: "What the run is called – a text key or a sentence." }
        steps: { type: array, items: { type: string }, description: "The steps of this run, in order, by their labels." }
        step: { type: string, description: "The step it is in." }
        index: { type: integer, description: "That step's place in `steps`, counting from zero." }
        progress:
          oneOf:
            - { type: object, additionalProperties: true, description: "What the step counts – it differs per step, and a step without a known total sends none." }
            - { type: "null" }
        started: { type: string, format: date-time }
        log_seq: { type: integer, description: "The /api/v1/log cursor before the run's first line – lines with a greater `n` belong to this run." }
    LastRun:
      type: object
      description: The run that finished last, as the status carries it.
      properties:
        label: { type: string }
        ok: { type: boolean }
        detail:
          oneOf:
            - { $ref: "#/components/schemas/MessageOrKey" }
            - { type: "null" }
        finished: { type: string, format: date-time }
        steps: { type: array, items: { type: string }, description: "The run's steps by key – `case_collect` among them when it collected for the cases." }
    McpState:
      type: object
      properties:
        running: { type: boolean }
        port: { type: integer }
        url: { type: string }
        error:
          oneOf:
            - { $ref: "#/components/schemas/I18nMessage" }
            - { type: "null" }
        config: { type: object, description: "Ready-made client snippets (http and stdio)." }
    LogLine:
      type: object
      required: [n, level, text]
      properties:
        n: { type: integer }
        level: { type: string, enum: [info, ok, warn, err, head] }
        t: { type: string, description: "HH:MM:SS" }
        text: { $ref: "#/components/schemas/MessageOrKey" }
    StoredLogLine:
      type: object
      properties:
        ts: { type: number, description: "Unix epoch seconds." }
        level: { type: string }
        text: { $ref: "#/components/schemas/MessageOrKey" }
    Facts:
      description: |
        What one item is known by – a different set per kind, which is why
        `kind` decides the shape and every variant pins it. `uid`, `kind`
        and `text` are on all of them; the rest differs. Every kind the
        archive holds has its branch here, so there is no default case –
        a kind added later gets its own.
      oneOf:
        - $ref: "#/components/schemas/FactsMail"
        - $ref: "#/components/schemas/FactsChat"
        - $ref: "#/components/schemas/FactsEvent"
        - $ref: "#/components/schemas/FactsContact"
        - $ref: "#/components/schemas/FactsFile"
        - $ref: "#/components/schemas/FactsBoardCard"
        - $ref: "#/components/schemas/FactsTask"
        - $ref: "#/components/schemas/FactsPage"
      discriminator:
        propertyName: kind
        mapping:
          outlook: "#/components/schemas/FactsMail"
          teams: "#/components/schemas/FactsChat"
          kalender: "#/components/schemas/FactsEvent"
          kontakte: "#/components/schemas/FactsContact"
          datei: "#/components/schemas/FactsFile"
          planner: "#/components/schemas/FactsBoardCard"
          todo: "#/components/schemas/FactsTask"
          pages: "#/components/schemas/FactsPage"
          onenote: "#/components/schemas/FactsPage"
    FactsCommon:
      type: object
      required: [uid, kind]
      properties:
        uid: { type: string, description: "The item this belongs to." }
        kind: { $ref: "#/components/schemas/SourceKey" }
        text: { type: string, description: "The item's text, as the index holds it." }
    Address:
      type: object
      description: One party of a mail or an appointment.
      properties:
        name: { type: string }
        mail: { type: string }
    FactsMail:
      description: A mail; `bcc` exists only in mail one sent oneself.
      allOf:
        - $ref: "#/components/schemas/FactsCommon"
        - type: object
          properties:
            kind: { const: outlook }
            from: { $ref: "#/components/schemas/Address" }
            to: { type: array, items: { $ref: "#/components/schemas/Address" } }
            cc: { type: array, items: { $ref: "#/components/schemas/Address" } }
            bcc: { type: array, items: { $ref: "#/components/schemas/Address" } }
            date: { type: string }
            folder: { type: string }
            attachments:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  size: { type: [integer, "null"] }
    FactsChat:
      description: One message of a Teams conversation.
      allOf:
        - $ref: "#/components/schemas/FactsCommon"
        - type: object
          properties:
            kind: { const: teams }
            from: { $ref: "#/components/schemas/Address" }
            date: { type: string }
            folder: { type: string }
            chat: { type: string, description: "The conversation it stands in." }
    FactsEvent:
      description: An appointment, including one recovered from an invitation mail.
      allOf:
        - $ref: "#/components/schemas/FactsCommon"
        - type: object
          properties:
            kind: { const: kalender }
            start: { type: string }
            end: { type: string }
            allday: { type: boolean }
            location: { type: string }
            organiser: { $ref: "#/components/schemas/Address" }
            attendees: { type: array, items: { $ref: "#/components/schemas/Address" } }
            calendar: { type: string }
    FactsContact:
      description: An entry of the address book.
      allOf:
        - $ref: "#/components/schemas/FactsCommon"
        - type: object
          properties:
            kind: { const: kontakte }
            org: { type: string }
            role: { type: string }
            emails: { type: array, items: { type: string } }
            phones: { type: array, items: { type: string } }
            note: { type: string }
            folder: { type: string }
    FactsFile:
      description: A mirrored file – OneDrive, SharePoint or one shared in Teams.
      allOf:
        - $ref: "#/components/schemas/FactsCommon"
        - type: object
          properties:
            kind: { const: datei }
            name: { type: string }
            ext: { type: string }
            size: { type: [integer, "null"] }
            modified: { type: string }
            folder: { type: string }
    FactsBoardCard:
      description: A card of a Planner board.
      allOf:
        - $ref: "#/components/schemas/FactsCommon"
        - type: object
          properties:
            kind: { const: planner }
            plan: { type: string }
            bucket: { type: string }
            folder: { type: string }
            assigned: { type: array, items: { type: string } }
            due: { type: string }
            state: { type: string }
            checklist: { type: [object, "null"], additionalProperties: true }
            attachments: { type: array, items: { type: string } }
            comments: { type: array, items: { type: object, additionalProperties: true } }
    FactsTask:
      description: A task of a To Do list.
      allOf:
        - $ref: "#/components/schemas/FactsCommon"
        - type: object
          properties:
            kind: { const: todo }
            list: { type: string }
            folder: { type: string }
            due: { type: string }
            state: { type: string }
            completed: { type: string }
            steps: { type: [object, "null"], additionalProperties: true }
            linked: { type: array, items: { type: string } }
            attachments: { type: array, items: { type: string } }
    FactsPage:
      description: A SharePoint page or a OneNote page – the page is its own content.
      allOf:
        - $ref: "#/components/schemas/FactsCommon"
        - type: object
          properties:
            kind: { enum: [pages, onenote] }
            folder: { type: string }
            modified: { type: string }
    Hit:
      type: object
      required: [uid, source, root, who, date, title, path, uri]
      properties:
        uid: { type: string, description: "`<source>:<path>:<n>` – input for /api/v1/documents and /api/v1/documents/facts." }
        cid: { type: integer, description: "Index row id; input for /api/v1/similar." }
        source: { $ref: "#/components/schemas/SourceKey" }
        source_label: { type: string, description: "The source as the interface names it – for files the mirror (OneDrive, SharePoint, Teams)." }
        root: { $ref: "#/components/schemas/Root" }
        who: { type: string }
        date: { type: string }
        title: { type: string }
        context: { type: string }
        path: { type: string, description: "Relative path; input for /api/v1/files/content." }
        uri: { type: string }
        score: { type: [number, "null"] }
        thread: { type: [string, "null"], description: "Input for /api/v1/threads." }
        attachments: { type: array, items: { type: string } }
        gone: { type: [string, "null"], description: "Tombstone date when the item vanished." }
        key: { type: [string, "null"], description: "The item's stable key (schluessel.py): what a case remembers it by. Null in an index built before 11.0." }
        who_mail: { type: [string, "null"], description: "The sender's address (mail) or the organiser's (appointments), lower-case; null for other sources and in an index built before 11.1." }
        domains: { type: array, items: { type: string }, description: "The mail domains of every party (sender and recipients, organiser and attendees); the page marks the hit external when one lies outside the internal domains. Empty for other sources." }
        cases:
          type: array
          description: The cases the item already sits in – the mark on the hit.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              ordner: { type: [string, "null"], description: "The name of the folder it sits in, if any." }
              status: { type: string, enum: [offen, zu] }
        preview: { type: string }
    Criteria:
      type: object
      description: |
        The criteria of one search, as /api/v1 spells them – the same names
        the search takes as query parameters. `folder` is the mailbox
        folder; the case's own folder is `case_folder`.
      properties:
        q: { type: string }
        mode:
          type: string
          enum: [text, aehnlich, ki]
          description: |
            The interface's own three, named after what they do for the
            user: text search, similar search, AI answer. `/api/v1/search`
            takes them as they stand (they mean `lexical`, `semantic`,
            `hybrid`), so a stored search runs without translation.
        person: { type: string }
        source: { type: string }
        from: { type: string, description: "Lower bound of the date range, YYYY-MM-DD." }
        to: { type: string }
        folder: { type: string }
        filetype: { type: string }
        gone: { type: boolean }
        attachments: { type: boolean, description: "Only items with an attachment (13.1)." }
        party: { type: string, enum: [all, internal, external] }
        mail_from: { type: string, description: "The mail lines (13.0); they narrow mail only." }
        mail_to: { type: string }
        mail_cc: { type: string }
        mail_bcc: { type: string }
        case: { type: [integer, "null"], description: "The \"Cases\" filter: a case id." }
        case_folder: { type: [integer, "null"], description: "With `case`: one folder of it." }
      example: { q: "\"budget frame\" 2026", mode: text, source: outlook, from: "2026-08-14", party: external }
    HistoryEntry:
      type: object
      required: [id, when, criteria]
      description: One search of the history – what was asked, never what came back.
      properties:
        id: { type: integer }
        when: { type: string, format: date-time }
        criteria: { $ref: "#/components/schemas/Criteria" }
        hits: { type: [integer, "null"], description: "How many it found then." }
    SavedSearch:
      type: object
      required: [id, name, criteria]
      description: A search kept under a name, and where it files its new hits.
      properties:
        id: { type: integer }
        name: { type: string }
        criteria: { $ref: "#/components/schemas/Criteria" }
        created: { type: string, format: date-time }
        last_run: { type: [string, "null"], format: date-time, description: "When it last ran." }
        hits: { type: [integer, "null"], description: "Hits then." }
        case: { type: [integer, "null"], description: "The case it is attached to." }
        case_name: { type: [string, "null"] }
        case_folder: { type: [integer, "null"], description: "The folder of that case it files into; null: unsorted. The same name the body takes, so the object round-trips." }
        case_folder_name: { type: [string, "null"] }
        auto: { type: boolean, description: "Switched to automatic: every run that updates the index runs this search and files its new hits into the case (13.3). Only attached to a case, only a text search." }
        auto_last_run: { type: [string, "null"], format: date-time, description: "When a run last collected for it." }
        auto_added: { type: [integer, "null"], description: "What that run filed into the case." }
        auto_skipped: { type: [integer, "null"], description: "What it left out because it had been removed from the case by hand." }
    Run:
      type: object
      required: [id, started_at]
      properties:
        id: { type: integer }
        started_at: { type: number }
        finished_at: { type: [number, "null"] }
        job_type: { type: string }
        origin: { type: string }
        result: { type: [string, "null"] }
        elements: { type: [object, "null"] }
        semantic: { type: [integer, "null"] }
        workers: { type: [integer, "null"] }
        app_version: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              started_at: { type: number }
              duration_s: { type: [number, "null"] }
              new: { type: [integer, "null"] }
              unchanged: { type: [integer, "null"] }
              excluded: { type: [integer, "null"] }
              errors: { type: [integer, "null"] }
              skipped: { type: integer }
              ok: { type: [integer, "null"] }
              extra: { type: [object, "null"], description: "The step's own detail, already parsed." }
    Analytics:
      type: object
      properties:
        built_at: { type: [string, "null"] }
        exists: { type: boolean }
        quellen: { type: array, items: { type: object } }
        komm:
          type: object
          description: nachrichten, gespraeche, mit_anhang, verschwunden, personen, von, bis (null = index too old to know).
        dateien:
          type: object
          description: n, pages, onedrive, sharepoint, teams, verschwunden.
        planner: { type: object }
        todo: { type: object }
        onenote: { type: object }
        verlauf: { type: array, description: "Message counts over time (mail and chat only)." }
        luecken: { type: array, description: "Months with no message at all." }
        anhang_typen: { type: [array, "null"] }
        datei_typen: { type: [array, "null"] }
        top_personen: { type: array }
        groesse: { type: object, description: "Bytes per source and for the index." }
        grosse_dateien: { type: array }
        pruefungen:
          type: object
          description: |
            The completeness balance per source, keyed by source
            (outlook_mail, outlook_calendar, outlook_contacts, teams,
            onedrive, sharepoint, sharepoint_pages, planner, todo,
            onenote): `bericht` is the last balance its check wrote (null
            before the first check), `genutzt` whether the source is in
            use – the page draws a row for a used source even without a
            report, and none for an unused one.
          additionalProperties:
            type: object
            properties:
              bericht: { anyOf: [{ $ref: "#/components/schemas/Bilanz" }, { type: "null" }] }
              genutzt: { type: boolean }
        archiv:
          type: [object, "null"]
          description: |
            The last inward check, null before the first: `geprueft`,
            `quellen` (one entry per export folder: quelle, stand, grund,
            stimmig, fehlt, fremd, unvollstaendig, verloren – all files –,
            `vermerkt`, `verweigert` (items Microsoft refuses to hand out,
            a 403 or a malware verdict: no copy here, and no fetch will
            bring one) and `weg` (items that were gone at Microsoft, a
            404, before a copy came), `zeilen` with the units that have
            findings, `fehler`) and `index` (stand, grund, geaendert, neu,
            weg, gebaut – files changed, new or gone since the index last
            read them). Each source entry also carries `befunde` (kind ->
            the files behind the numbers, `verweigert` and `weg` among the
            kinds, capped at 5000 per kind – `gekappt` says so) and
            `beiseite`, how many files an earlier "set aside" holds.
  headers:
    ETag:
      description: |
        The case's entity tag (RFC 9110), weak: a digest of the case as
        the case book keeps it, and the index's build, since an item's
        `thread_open` and `who_mail` come from the index. Hand it back as
        `If-None-Match` to be told with a `304` that nothing changed.
      schema: { type: string, example: 'W/"9f2c41ab77d0e34b.2026-09-20T18:00:00"' }
    PreferenceApplied:
      description: Says the `Prefer` was honoured (RFC 7240) – only on an answer without a body.
      schema: { type: string, enum: [return=minimal] }
  parameters:
    Prefer:
      name: Prefer
      in: header
      required: false
      description: |
        RFC 7240. Every write under `/cases` answers the whole case it
        changed – what the page wants, one truth to draw from. A script
        that only wants to know it worked says `return=minimal` and gets
        the status (`204`, or `201` – with the new thing's `Location`
        where one thing was made), the `ETag` and `Preference-Applied` –
        no body, and none of the counts a full answer carries beside the
        case. `return=representation` is the default and needs no saying.
        The page asks this way itself where it wants no more than a new
        id.
      schema: { type: string, enum: [return=minimal, return=representation] }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of the last answer (or `*`); a case that still matches is a `304` without a body.
      schema: { type: string }
    SourcePath:
      name: source
      in: path
      required: true
      description: |
        The eight sources the archive check knows. Not the same list as
        `SourceKey`, which names what the *index* holds (there a calendar
        is `kalender` and a mirrored file `datei`), and not the same as
        the rows of `/api/v1/balance` (`BalanceRow`), which split the
        mailbox into mail, calendar and contacts.
      schema:
        type: string
        enum: [outlook, teams, onedrive, sharepoint, sharepoint_pages, planner, todo, onenote]
    BalanceRow:
      name: row
      in: path
      required: true
      description: |
        A row of the completeness balance (`/api/v1/balance`), which is
        finer than the eight sources under `/sources`: the mailbox is
        three rows here, because mail, calendar and contacts are fetched
        and checked apart. The order is the one Insights draws them in.
      schema:
        type: string
        enum: [outlook_mail, outlook_calendar, outlook_contacts, teams, onedrive,
               sharepoint, sharepoint_pages, planner, todo, onenote]
    CaseIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: The case's id, as /api/v1/cases lists them.
    Source:
      name: source
      in: query
      schema: { $ref: "#/components/schemas/SourceFilter" }
      description: One source key or several comma-separated; empty or `all` means every source.
      examples:
        eine:
          summary: One source
          dataValue: outlook
          serializedValue: source=outlook
        mehrere:
          summary: Several at once – the comma is the separator, not a repeated parameter
          dataValue: [outlook, teams, onenote]
          serializedValue: source=outlook%2Cteams%2Conenote
        alle:
          summary: Every source – the same as leaving it out
          dataValue: all
          serializedValue: source=all
    Uid:
      name: uid
      in: query
      required: true
      schema: { type: string }
      description: The item's uid from a hit (`<source>:<path>:<n>`).
      example: "outlook:E-Mail/Inbox/2026-09-15_offer.eml:0"
  responses:
    NotModified:
      description: Nothing changed since the `ETag` given as `If-None-Match` – no body; the tag comes back.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
    NoCase:
      description: No case with this id (srv.case.unknown).
      content:
        application/problem+json:
          $ref: "#/components/mediaTypes/Problem"
    Forbidden:
      description: The `Host` header does not name the bound loopback address (the DNS-rebinding guard, srv.forbidden) – every route answers this way.
      content:
        application/problem+json:
          $ref: "#/components/mediaTypes/Problem"
    ServerError:
      description: "An uncaught error inside the route (srv.internal); `error.v.error` carries the exception as `<Type>: <message>`."
      content:
        application/problem+json:
          $ref: "#/components/mediaTypes/Problem"
    MethodNotAllowed:
      description: The path exists, the method does not serve it (srv.method). `Allow` names the ones that do.
      headers:
        Allow: { description: The methods this path serves., schema: { type: string } }
      content:
        application/problem+json:
          $ref: "#/components/mediaTypes/Problem"
    UnsupportedMediaType:
      description: The body is not declared `application/json` (srv.mediatype); a body that is not valid JSON or not an object is a 400 (srv.badjson), one above 4 MB a 413 (srv.toobig).
      content:
        application/problem+json:
          $ref: "#/components/mediaTypes/Problem"
