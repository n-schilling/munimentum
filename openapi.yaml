  /api/faelle/export:
    post:
      tags: [Cases]
      operationId: exportCase
      x-starts-run: true
      summary: Export a case (a run)
      description: |
        Started as a run of its own (case_export.py): one ZIP named
        `<case>_<date>.zip` below the export folder (setting
        `case_export_dir`, else Documents/Munimentum cases) with the
        originals of every item, copied out of the archive – under
        `<folder>/<source>/<path>` when the case has folders (the unsorted
        ones under "Unsorted"), else under `<source>/<path>` – plus
        index.html, items.csv and casebook.md. The ZIP is named before the
        run starts and answered here; the case remembers it as
        `exportiert` when the run is done. Nothing in the archive is
        touched; a closed case can be exported. Refused while a run is on.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
      responses:
        "200":
          description: It worked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { $ref: "#/components/schemas/MessageOrKey" }
                  path: { type: string, description: "The ZIP the run writes." }
        "400":
          description: The export folder cannot be created (srv.case.exportdir).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such case.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A run is on.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/faelle/export-ordner:
    post:
      tags: [Cases]
      operationId: openCaseExportFolder
      summary: Show the case's last export in the file manager
      description: The folder holding the last export's ZIP, else the export folder itself. No process, answers at once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
