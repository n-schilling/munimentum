                  case:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  searches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        new: { type: array, items: { $ref: "#/components/schemas/Hit" }, description: "At most 200." }
                        new_count: { type: integer }
                        ordner: { type: [integer, "null"], description: "The folder the search files into – where the page adds the new ones." }
                        ordner_name: { type: [string, "null"] }
                        error: { $ref: "#/components/schemas/MessageOrKey" }
