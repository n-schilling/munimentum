openapi: 3.1.0
info:
  title: Munimentum HTTP API
  version: 11.2.0
  description: |
    The API between the Munimentum page and its backend, served on
    `127.0.0.1` only. There is **no authentication**: anything on this
    machine that sends a correct `Host` header can read the whole archive.
    The `Host` header must name the bound address (DNS-rebinding guard);
    otherwise every request is answered with `403` and a plain-text body.

    Conventions used throughout:
    * Responses are JSON (`application/json; charset=utf-8`) unless a route
      says otherwise; every response carries `Cache-Control: no-store` and
      `X-Content-Type-Options: nosniff` (exceptions: `/api/answer`, `/source`).
    * Many `message`/`error` values are i18n objects `{"k": key, "v": vars}`
      that the page translates; some are plain strings — schemas use `oneOf`.
    * Every POST route tolerates an absent or empty body and falls back to
      its defaults; body fields act on **presence**, not truthiness.
    * Unknown paths return `404` with `{"error": "Unbekannter Pfad"}`; an
      uncaught error inside a route returns `500` with
      `{"error": "<Type>: <message>"}`.
    * `HEAD` is answered for every GET route (headers only).

    This file is served by `GET /api/openapi` and lives in the repository as
    `openapi.yaml`; it is updated in the same commit as any API change.
servers:
  - url: http://127.0.0.1:8700
    description: Default port; the app tries the next twelve if it is taken.

paths:
  /:
    get:
      summary: The single-page interface
      description: |
        The whole UI as one HTML page, with the language strings and the
        step metadata from the registry injected server-side. `/index.html`
        is an alias. Language is negotiated from the configuration and the
        request's `Accept-Language` header.
      responses:
        "200":
          description: The page.
          content:
            text/html: {}

  /api/status:
    get:
      summary: Complete application state
      description: |
        Polled by the page. Carries token state, Ollama state, index and
        export inventories, the job runner snapshot (`jobs.seq` is the log
        cursor), MCP state, the full configuration, storage paths, update
        info, auth state and folder summaries. While the chooser holds the
        port (more than one profile, none named at start) the answer is
        `{"chooser": true}` instead – the page polls until the app answers.
      responses:
        "200":
          description: The state object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/TokenStatus" }
                  ollama: { $ref: "#/components/schemas/OllamaStatus" }
                  ollama_hint: { type: object }
                  store:
                    type: object
                    description: Index state (dir, exists, chunks, messages, features, semantic, built_at, model).
                  calendar:
                    type: object
                    properties:
                      exists: { type: boolean }
                      built_at: { type: [string, "null"] }
                  exports:
                    type: object
                    description: Per source (teams, outlook, onedrive, sharepoint, pages, planner, todo, onenote) dir/exists/last_run.
                  jobs: { $ref: "#/components/schemas/JobsState" }
                  mcp: { $ref: "#/components/schemas/McpState" }
                  config:
                    type: object
                    description: The complete app_config.json as held in memory.
                  schedule_next: { type: [string, "null"] }
                  schedule_enabled: { type: boolean }
                  wizard:
                    type: [string, "null"]
                    enum: [token, ollama, null]
                  data_dir: { type: string }
                  data_dir_default: { type: string }
                  index_dir: { type: string }
                  index_dir_default: { type: string }
                  home_dir: { type: string }
                  app_location: { type: string }
                  frozen: { type: boolean }
                  update: { type: object }
                  skip_folders_default: { type: array, items: { type: string } }
                  filetype_hidden_default: { type: array, items: { type: string } }
                  graph_explorer: { type: string }
                  scopes_needed: { type: array, items: { type: string } }
                  scope_queries: { type: object }
                  auth:
                    type: object
                    description: mode (token|login), signed_in, account, own_registration, client_id, default_client_id, tenant, device.
                  folders:
                    type: object
                    description: Mailbox folder summary (abgeglichen, ordner_gesamt, ordner_gewaehlt, mails_gesamt, mails_gewaehlt, neu, verschwunden).
                  calendars: { type: object }
                  folders_onedrive: { type: object }
                  conversations: { type: object, description: "Teams conversation list summary (same shape as folders)." }
                  lists: { type: object, description: "To Do list summary (same shape as folders)." }
                  profile: { $ref: "#/components/schemas/ProfileState" }

  /api/log:
    get:
      summary: Log lines after a cursor
      description: |
        The runner keeps a bounded ring buffer of log lines, each with a
        strictly increasing `n`. Pass the `seq` of the previous response (or
        of `/api/status` → `jobs.seq`) as `since`; `0` returns the whole
        retained buffer. A client far behind loses old lines silently.
      parameters:
        - name: since
          in: query
          schema: { type: integer, default: 0 }
          description: Last line number the client already has.
      responses:
        "200":
          description: New lines and the current cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/LogLine" }
                  seq: { type: integer }

  /api/search:
    get:
      summary: Search or browse the archive
      description: |
        With `q`: ranked search (mode auto/hybrid/semantic/lexical). Without
        `q`: filter-only browsing, newest first. Errors (no index, stale
        index) come back in-band with HTTP 200.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Query text; empty switches to browse mode." }
        - { name: person, in: query, schema: { type: string }, description: "Sender / author filter (substring)." }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Inclusive lower date bound." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Inclusive upper date bound." }
        - { name: source, in: query, schema: { type: string, default: all }, description: "One key or several comma-separated (\"onedrive,sharepoint\"): teams, outlook, kalender, kontakte, onedrive, sharepoint, pages, planner, todo, onenote; teams includes the files next to the conversations, datei = every file mirror, all = everything." }
        - { name: k, in: query, schema: { type: integer, default: 20, maximum: 100 }, description: "Page size." }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: "Results to skip." }
        - { name: gone, in: query, schema: { type: string }, description: "1/true/ja: only tombstoned messages." }
        - { name: folder, in: query, schema: { type: string }, description: "Restrict to a folder and below." }
        - { name: filetype, in: query, schema: { type: string }, description: "Attachment / file extension without dot." }
        - { name: mode, in: query, schema: { type: string, default: auto, enum: [auto, hybrid, semantic, lexical] } }
        - { name: case, in: query, schema: { type: integer }, description: "The \"Cases\" filter: only items the case holds (its id, see /api/faelle)." }
        - { name: case_folder, in: query, schema: { type: integer }, description: "With `case`: only the items in this folder of the case (its id, see the case's `ordner_liste`)." }
        - { name: party, in: query, schema: { type: string, default: all, enum: [all, internal, external] }, description: "Mails and appointments by their parties: `internal` – every party inside the internal mail domains (setting `internal_domains`, else the signed-in account's domain) – or `external` – at least one outside. Items without addresses are on neither side. Needs an index with the parties' domains." }
        - { name: saved, in: query, schema: { type: integer }, description: "Id of the saved search being run; the first page records when it ran and how many hits it had." }
      responses:
        "200":
          description: |
            Hits, or an in-band error. The first page (offset 0) of a
            non-empty search is recorded in the search history – criteria
            only, never hits – unless the setting `search_history` is off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Hit" }
                  count: { type: integer }
                  offset: { type: integer }
                  backend: { type: string }
                  semantic: { type: boolean }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/similar:
    get:
      summary: Messages similar to one hit
      description: Needs an index with embeddings; works without Ollama.
      parameters:
        - { name: cid, in: query, required: true, schema: { type: integer }, description: "Index row id from a hit's cid." }
        - { name: k, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Similar hits, or an in-band error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                  count: { type: integer }
                  backend: { type: string }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/thread:
    get:
      summary: A whole conversation
      parameters:
        - { name: key, in: query, required: true, schema: { type: string }, description: "The thread id from a hit." }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The messages of the conversation, oldest first – each with `cases`, the cases it already sits in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread: { type: string }
                  count: { type: integer }
                  messages: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/sharepoint-report:
    get:
      summary: Last balance of the SharePoint libraries
      description: |
        The stored balance of the libraries' check step – the size preview
        reads its `bytes`, `bytes_ausgeschlossen` and `typen` from it;
        cheaper than /api/analytics.
      responses:
        "200":
          description: The balance, or null when the check never ran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bericht: { anyOf: [{ $ref: "#/components/schemas/Bilanz" }, { type: "null" }] }

  /api/files:
    get:
      summary: Browse the mirrored drives and the files next to conversations
      parameters:
        - { name: root, in: query, schema: { type: string, enum: ["", onedrive, sharepoint, teams, planner] }, description: "Empty lists the entry points; teams browses the files shared in chats and the mirrored channel folders, planner a board's downloaded attachments." }
        - { name: path, in: query, schema: { type: string }, description: "Folder inside the mirror, as returned here." }
      responses:
        "200":
          description: Entry points, or one folder level (max 2000 files).
          content:
            application/json:
              schema:
                type: object
                properties:
                  roots: { type: array, items: { type: object } }
                  root: { type: string }
                  path: { type: string }
                  base: { type: integer, description: "Fixed prefix depth for breadcrumbs (2 for sharepoint)." }
                  label: { type: string }
                  dirs: { type: array, items: { type: object } }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        rel: { type: string }
                        date: { type: string }
                        gone: { type: [string, "null"] }
                        size: { type: [integer, "null"] }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/filetypes:
    get:
      summary: File types in the archive
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 200 } }
        - { name: source, in: query, schema: { type: string }, description: "Empty = every source; one key or several comma-separated." }
      responses:
        "200":
          description: Types after applying the configured hide list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  total_distinct: { type: integer }
                  hidden: { type: array, items: { type: string } }
                  filetypes: { type: array, items: { type: object } }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/folders:
    get:
      summary: Folder units for the filter dropdown
      parameters:
        - { name: contains, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 300, maximum: 1000 } }
        - { name: source, in: query, schema: { type: string }, description: "One key or several comma-separated." }
      responses:
        "200":
          description: Folders (whole units per source), by message count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  folders: { type: array, items: { type: object } }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/people:
    get:
      summary: People occurring in the archive
      parameters:
        - { name: source, in: query, schema: { type: string, default: all }, description: "One key or several comma-separated; files and pages record no person." }
        - { name: contains, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Names with message counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  total_distinct: { type: integer }
                  total_messages: { type: integer }
                  people: { type: array, items: { type: object } }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/document:
    get:
      summary: One message with its full text
      parameters:
        - { name: uid, in: query, required: true, schema: { type: string } }
        - { name: before, in: query, schema: { type: integer, default: 0, maximum: 20 }, description: "Conversation context before." }
        - { name: after, in: query, schema: { type: integer, default: 0, maximum: 20 } }
      responses:
        "200":
          description: The document, or an in-band error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  source: { type: string }
                  who: { type: string }
                  date: { type: string }
                  title: { type: string }
                  path: { type: string }
                  uri: { type: string }
                  text: { type: string }
                  facts:
                    type: object
                    additionalProperties: true
                    description: What the item is known by, per kind – the same block /api/detail returns, without uid, kind and text (a mail's from, to, cc, date, folder, attachments; an appointment's start, end, location, organiser, attendees; a task's due, state, checklist or steps …).
                  file:
                    type: object
                    description: Only for mirrored files – name, path, size_bytes, modified, gone, binary, content_indexed (always false).
                  context_before: { type: array, items: { type: object } }
                  context_after: { type: array, items: { type: object } }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/detail:
    get:
      summary: The facts the hit's detail shows
      description: |
        Per kind of item, from the index row and the source file: a mail's
        from, to, cc, date, folder and attachments (with sizes); a chat
        message's from, when and chat; an appointment's start, end,
        location, organiser and attendees; a contact's org, role, emails
        and phones; a file's ext, size and modified; a task's plan or
        list, assigned, due, state, checklist or steps, comments and
        linked resources. `text` is the content the detail shows. A key
        that is missing means the item has none of it.
      parameters:
        - { name: uid, in: query, required: true, schema: { type: string }, description: "The item's uid from a hit." }
      responses:
        "200":
          description: The facts, or an in-band error.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  uid: { type: string }
                  kind: { type: string, description: "The source: outlook, teams, kalender, kontakte, datei, pages, onenote, planner, todo." }
                  text: { type: string }
                  error: { $ref: "#/components/schemas/MessageOrKey" }

  /api/run-log:
    get:
      summary: The stored log of one run
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer }, description: "Run id from /api/runs." }
      responses:
        "200":
          description: Lines, oldest first (max 4000).
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/StoredLogLine" }

  /api/analytics:
    get:
      summary: What the archive holds
      description: |
        The block materialized at the end of each index run: sources,
        communication vs. files, timeline with gaps, attachment and file
        types, sizes, top people — plus the stored completeness reports.
        If no block exists yet, one is computed inline (slow once).
      responses:
        "200":
          description: The analytics block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }

  /api/runs:
    get:
      summary: Run history
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Runs, newest first, each with its steps.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/Run" } }

  /api/calendar:
    get:
      summary: The combined calendar/contacts file
      description: |
        Raw bytes of calendar.json (can be several MB); gzip-encoded when
        the request accepts it. 404 with an i18n error when the file has
        not been built yet.
      responses:
        "200":
          description: The file as built by the calendar step.
          content:
            application/json: {}
        "404":
          description: Not built yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { $ref: "#/components/schemas/I18nMessage" }
                  recs: { type: array }

  /api/openapi:
    get:
      summary: This document
      responses:
        "200":
          description: The API description as YAML.
          content:
            text/yaml: {}

  /source:
    get:
      summary: An original file from the archive
      description: |
        Serves a file out of an export folder. `path` is relative to the
        root, exactly as hits and file listings return it; `..` escapes are
        blocked. Non-HTML files come with `Content-Disposition: attachment`;
        everything is sandboxed via `Content-Security-Policy: sandbox`.
        An HTML file of the archive – board, list, page, conversation –
        is rewritten in memory so its relative links (attachments, mirrored
        files, a page's files folder) route back through this endpoint.
      parameters:
        - { name: root, in: query, required: true, schema: { type: string, enum: [teams, outlook, onedrive, sharepoint, pages, planner, todo, onenote] } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file (content type by extension).
        "404":
          description: Unknown root, path outside the export, or missing file (plain text).
        "503":
          description: No index loaded (plain text).

  /api/token:
    post:
      summary: Store a pasted Graph access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: "Graph token; 'Bearer ' prefix and whitespace are stripped." }
      responses:
        "200":
          description: Always 200; ok says whether the token was usable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { $ref: "#/components/schemas/I18nMessage" }
                  token: { $ref: "#/components/schemas/TokenStatus" }

  /api/analytics-refresh:
    post:
      summary: Recompute the analytics block
      responses:
        "200":
          description: The freshly computed block (same shape as GET /api/analytics).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }

  /api/wizard-seen:
    post:
      summary: Dismiss the token wizard
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /api/run:
    post:
      summary: Start an export/index run
      description: |
        Step flags are the registry's request keys; absent means off. A
        cadence below its interval can silently drop onedrive, teams, todo
        or onenote for this run (the log says so). `nur_einheit` narrows a SharePoint,
        pages or Planner run to one URL and forces its sync.

        Note: the master switches from the settings (onedrive_enabled,
        sharepoint_enabled, sharepoint_pages_enabled, planner_enabled,
        todo_enabled, onenote_enabled) gate the interface and the schedule,
        not this endpoint — asking
        for a source here runs it even when its switch is off. That is
        what the settings' per-URL "sync now" button relies on.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outlook: { type: boolean, description: "Mailbox export (configured categories)." }
                onedrive: { type: boolean }
                sharepoint: { type: boolean }
                planner: { type: boolean }
                todo: { type: boolean }
                onenote: { type: boolean }
                sharepoint_pages: { type: boolean }
                teams: { type: boolean }
                index: { type: boolean }
                calendar: { type: boolean }
                sync_onedrive: { type: boolean, description: "Folder tree only." }
                sync_notebooks: { type: boolean, description: "OneNote notebook list only." }
                sync_teams: { type: boolean, description: "Teams conversation list only (teams and channels, chats by category)." }
                sync_todo: { type: boolean, description: "To Do list of lists only." }
                sync_now: { type: boolean, description: "Ignore every sync cadence once (the source's \"Sync now\" button)." }
                calendar_full: { type: boolean, description: "Outlook: read the calendar once in full – only the calendar category runs, window and change tokens ignored." }
                full_sync: { type: boolean, description: "The source's \"Force full sync\" button: the requested exports forget their stored change pointers (delta links, watermarks, inventory versions, page stamps, task etags) and read the source again as on its first export, writing everything over – attachments and files included. Nothing in the archive is deleted. Implies sync_now; for Outlook it reads the calendar in full as calendar_full does, with every configured category." }
                resync: { type: boolean, description: "\"Fetch now\" in the completeness balance and \"Fetch again\" in the archive card: the requested exports forget their stored change pointers (delta links, walk pointers, chat watermarks) but keep every file's version, so each source is listed once in full and only what is not here is fetched – a mail whose file is gone, a card whose attachment is missing. Nothing current is written over, nothing is deleted. Implies sync_now." }
                resync_folders:
                  type: array
                  items: { type: string }
                  description: "With resync: the folders the balance found something open in (rel paths: E-Mail/…, kalender/<name>, kontakte). The Outlook resync then lists those alone – a calendar or the contacts only when a row of theirs is named – and leaves every other folder untouched. Other sources ignore the list."
                sync_sharepoint: { type: boolean }
                sync_folders: { type: boolean, description: "Outlook folder tree only." }
                sync_calendars: { type: boolean }
                check: { type: boolean, description: "Completeness check of the mailbox (mail, calendar, contacts – the ticked categories)." }
                check_teams: { type: boolean, description: "Completeness check of Teams (conversations)." }
                check_onedrive: { type: boolean }
                check_sharepoint: { type: boolean, description: "Completeness check of the SharePoint libraries; doubles as the size preview." }
                check_pages: { type: boolean }
                check_planner: { type: boolean }
                check_todo: { type: boolean }
                check_onenote: { type: boolean }
                check_archive: { type: boolean, description: "The inward check (archive_check.py): every export's bookkeeping against the files on disk, plus the index against the archive. Needs no access; writes nothing but its report." }
                nur_einheit: { type: string, description: "Single site/library/plan URL." }
                legacy_comments: { type: boolean, description: "Planner: list the legacy comment threads again, ignoring the boards' cadence (skipped after a board's first sync otherwise)." }
                embeddings: { type: [boolean, "null"], description: "null = decide automatically." }
                label: { type: string, default: job.export, description: "Run label (i18n key)." }
      responses:
        "200":
          description: The run thread started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: Busy, no token, or nothing to do (message.k names it).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }

  /api/archiv/ordner:
    post:
      summary: Show an export folder in the system's file manager
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string, description: "outlook | teams | onedrive | sharepoint | sharepoint_pages | planner | todo | onenote" }
      responses:
        "200": { description: Opened. }
        "400": { description: Unknown source. }
        "500": { description: No way to open a folder on this system. }

  /api/bilanz/holen:
    post:
      summary: Fetch what a balance row found open (a run)
      description: |
        "Fetch now" on a row of the completeness balance: one run that
        fetches only what the row found open, the cheapest way the source
        allows – the mailbox as a resync limited to the folders with
        something open (resync_folders from the stored report), OneDrive
        and SharePoint by the open files' ids straight from the stored
        report (FETCH_LIST, no walk; a resync when the report had to cap
        them), every other source as its regular sync-now run – then the
        index, and the source's check step so the row is judged afresh
        (the mirrors adjust the row themselves). `quelle` is the balance
        row's key (outlook_mail, outlook_calendar, outlook_contacts,
        teams, onedrive, sharepoint, sharepoint_pages, planner, todo,
        onenote).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started (message null).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "400": { description: Unknown row. }
        "409": { description: A run is on, or the run could not start (the source is not ticked, srv.inactive). }

  /api/archiv/nachholen:
    post:
      summary: Fetch the source's missing files again (a run)
      description: |
        "Fetch again" on a row of the archive card: exactly the files the
        stored report found missing or incomplete are written to a list,
        and one run starts – the source's export step with that list
        (FETCH_LIST: each file fetched through its own bookkeeping – the
        mail's id, the drive item, the conversation, the unit that holds
        it – nothing else read, the source ticked in the settings or not),
        the index, and the archive step "pruefen" that judges the row
        afresh and dates it as fetched, so what is still missing reads as
        a card to note. A file Microsoft no longer has is said so in the
        log and stays an entry without a file. Nothing to do when the row
        lists no missing file.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started (message null), or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409": { description: A run is on, or the run could not start. }

  /api/archiv/vermerken:
    post:
      summary: Note the source's lost files as lost (a run)
      description: |
        An action of the archive check (archive_check.py), started as a
        run of its own so the run window shows it and the run history
        keeps it: every tombstone of the source whose file is gone – and,
        with `arten` including `fehlt`, every file still missing after a
        resync – is noted in the state.db table `verloren`; the records
        stay. Judged afresh, not from the stored report; the source's row
        in the report is updated when the step is done. Refused while a
        run is on.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
                arten:
                  type: array
                  items: { type: string, enum: [verloren, fehlt] }
                  description: "The kinds to note; default [verloren]. The page adds fehlt only when the report says a resync ran since the files went missing (nachgeholt > fehlt_seit)."
      responses:
        "200":
          description: The run started (message null), or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409": { description: A run is on. }

  /api/archiv/beiseitelegen:
    post:
      summary: Set the source's foreign files aside (a run)
      description: |
        Started as a run of its own: moves every file no bookkeeping knows
        into `_fremd/<stamp>/` inside the export folder, path kept, with a
        list of what moved next to them. A target that exists is skipped,
        never overwritten; nothing is deleted; the index and the checks
        ignore the folder. The log line says how many moved.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started (message null), or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409": { description: A run is on. }

  /api/archiv/zurueckholen:
    post:
      summary: Put the newest set-aside batch back (a run)
      description: |
        Started as a run of its own: moves the files of the newest
        `_fremd/<stamp>/` batch back to their paths; a file whose place is
        taken meanwhile stays in the batch. Emptied batch folders are
        removed – they held nothing but the move.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started (message null), or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409": { description: A run is on. }

  /api/archiv/neu-aufbauen:
    post:
      summary: Set a damaged bookkeeping aside and rebuild it (a run)
      description: |
        One run of three steps: the archive step sets every damaged
        state.db of the source aside as `state.db.beschaedigt-<stamp>` and
        salvages what it still yields (the whole file when it dumps
        through, else the tombstones) into a fresh one; the source's
        sync-now export fills it as on a first export; the index follows.
        The source's row in the report says "rebuilding" until the next
        check. Nothing to do when no state.db of the source is damaged.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string }
      responses:
        "200":
          description: The run started (message null), or nothing to do (message srv.archiv.nothing, no run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409": { description: A run is on, or the run could not start. }

  /api/login:
    post:
      summary: Start the device-code sign-in
      responses:
        "200":
          description: The device code to show; a background thread waits for consent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  device:
                    type: object
                    properties:
                      code: { type: string }
                      url: { type: string }
                      expires_in: { type: integer }
                      done: { type: boolean }
                      ok: { type: boolean }
                      error: { type: [string, "null"] }
        "500":
          description: The flow could not be started.

  /api/data-dir:
    post:
      summary: Point the data and index folders elsewhere
      description: |
        Each field acts only when present; an empty string resets to the
        default. Nothing is moved — moving folders is the user's job, and
        the change takes effect after a restart.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, description: "Data folder ('' = default)." }
                index: { type: string, description: "Index folder ('' = default)." }
      responses:
        "200":
          description: The effective paths and whether a restart is needed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  path: { type: string }
                  index: { type: string }
                  restart: { type: boolean }
        "400":
          description: Target not writable, or already used by another profile (`srv.datadir.shared`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }

  /api/profiles:
    get:
      summary: Every profile, with account, folder and last run
      description: |
        Fetched when the storage card or the switch window shows the list;
        the status poll carries only `ProfileState`. Served by the chooser
        too.
      responses:
        "200":
          description: The complete profile state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileStatus" }
    post:
      summary: Create a profile
      description: |
        A profile is an archive of its own – configuration, key, run
        history, exports and index – in `profiles/<name>/` below the app
        folder; the first one is called `standard`. The new profile
        starts empty; nothing is copied or moved. Names are slugs
        (`^[a-z0-9][a-z0-9-]{0,31}$`) because they land in paths and on
        command lines.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The new profile and the complete profile state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  profile: { $ref: "#/components/schemas/ProfileInfo" }
                  profiles: { $ref: "#/components/schemas/ProfileStatus" }
        "400":
          description: Bad name, name taken, or profiles impossible (--data-dir).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }

  /api/profile-switch:
    post:
      summary: Restart with another profile
      description: |
        Answers first, then the process starts over with `--profile NAME`
        on the same port. The page polls `/api/status` until the new
        instance answers with that profile and reloads. When that profile
        is already open in another instance nearby, the answer carries its
        `url` instead and nothing restarts. Refused while a job runs, and
        refused altogether where there are no profiles (--data-dir).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Restart under way – or, with `url`, the instance that already serves the profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  url: { type: string }
        "400":
          description: Unknown profile, or no profiles at all.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: A job is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }

  /api/profile-open:
    post:
      summary: Choose the profile to start (chooser only)
      description: |
        Served only by the chooser page before the app. Records the choice
        (and *open without asking*), answers, then the chooser stops and
        the app takes the port with that profile. When the profile is
        already open in another instance nearby, the answer carries its
        `url` and this start ends.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                ohne_nachfrage: { type: boolean }
      responses:
        "200":
          description: Chosen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  url: { type: string }
        "400":
          description: Unknown profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }

  /api/profile-rename:
    post:
      summary: Rename a profile that is not open
      description: |
        Renames `profiles/<name>/` to `profiles/<neu>/`; data or index
        paths in its configuration that pointed into the folder follow it,
        paths elsewhere stay. The open profile cannot be renamed
        (`srv.profile.active`); refused while a job runs.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, neu]
              properties:
                name: { type: string }
                neu: { type: string }
      responses:
        "200":
          description: The new name and the complete profile state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  profiles: { $ref: "#/components/schemas/ProfileStatus" }
        "400":
          description: Unknown, open, bad name, name taken, or the rename failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }
        "409":
          description: A job is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkMessage" }

  /api/profile-prefs:
    post:
      summary: Open the last profile without asking
      description: |
        With more than one profile the app asks on start which one to open;
        `ohne_nachfrage` skips that and opens the last one. Stored in
        `profiles.json` in the app folder, outside every profile.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ohne_nachfrage: { type: boolean }
      responses:
        "200":
          description: The stored value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ohne_nachfrage: { type: boolean }

  /api/folder-plan:
    post:
      summary: What the current rules would export
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quelle: { type: string, description: "onedrive | calendar | sharepoint | onenote | teams | todo | anything else = mailbox." }
                onedrive_rules: { type: [string, "null"], description: "Rule text; null = stored config." }
                teams_rules: { type: [string, "null"] }
                todo_rules: { type: [string, "null"] }
                sharepoint_rules: { type: [string, "null"] }
                calendar_rules: { type: [string, "null"] }
                folder_rules: { type: [string, "null"] }
                skip_folders: { description: "Legacy name list (array or comma/newline string)." }
      responses:
        "200":
          description: Included/excluded/gone folders with counts, or leer=true when no tree is synced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  leer: { type: boolean }
                  regeln: { type: string }
                  abgeglichen: { type: [string, "null"] }
                  an: { type: array, items: { type: object } }
                  aus: { type: array, items: { type: object } }
                  weg: { type: array, items: { type: object } }
                  mails_an: { type: integer }
                  mails_aus: { type: integer }
                  mails_weg: { type: integer }

  /api/logout:
    post:
      summary: Sign out (clear the token cache)
      responses:
        "200":
          description: Always ok; the pasted token file is untouched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /api/cancel:
    post:
      summary: Cancel the running job
      responses:
        "200":
          description: ok=true only when a subprocess was actually terminated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /api/config:
    post:
      summary: Save settings
      description: |
        Every field is optional and keyed on presence. Numbers are clamped
        to their documented ranges; invalid values are ignored rather than
        rejected. Returns the complete normalized configuration.
        Fields (see /api/status → config for the full shape):
        outlook_categories, teams_categories, embed_model, chat_model,
        ollama, workers, mirror_workers, mcp_port, index_batch,
        answer_sources, semantic_min, onedrive_max_mb, sharepoint_max_mb,
        sharepoint_pages_image_max_mb, search_results, userflow_actions,
        runs_retention_months, log_retention_days, mcp_enabled,
        mcp_autostart, update_check, keep_awake, embed_images, cache_images,
        refresh_channels, skip_empty_chats, include_hidden,
        calendar_reconstruct, ollama_enabled, index_semantic,
        onedrive_enabled, sharepoint_enabled, sharepoint_pages_enabled,
        planner_enabled, planner_attachments, todo_enabled, onenote_enabled,
        onenote_rules, onenote_image_max_mb, teams_attachments,
        teams_channel_files,
        teams_files_max_mb, calendar_rules, folder_rules,
        onedrive_rules, teams_rules, sharepoint_rules, todo_rules,
        calendar_months_back, planner_sweep_hours, outlook_since,
        teams_since, sharepoint_urls, sharepoint_pages_urls,
        planner_urls, sharepoint_types_include, sharepoint_types_exclude,
        analytics_skip, filetype_hidden, skip_folders, auth_mode,
        client_id, tenant, sync_cadence, notifications, language,
        tour_seen (object: archiv | suche | quelle -> boolean).
        sync_cadence maps keys to always|daily|weekly|monthly: a source
        (onedrive, todo), a category (outlook:mail, teams:1on1), a unit
        (sharepoint-url:<url>, planner-url:<url>, pages-url:<url>,
        onenote:<id>) or a departure below a category
        (outlook:mail:<folder path>, teams:<conversation path>) – the
        deepest key on a unit's path wins.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  config: { type: object }

  /api/schedule:
    post:
      summary: Save the schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                outlook: { type: boolean }
                teams: { type: boolean }
                onedrive: { type: boolean }
                sharepoint: { type: boolean }
                sharepoint_pages: { type: boolean }
                planner: { type: boolean }
                todo: { type: boolean }
                onenote: { type: boolean }
                index: { type: boolean }
                calendar: { type: boolean }
                interval_minutes: { type: integer, minimum: 5 }
      responses:
        "200":
          description: The stored schedule and the next run time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  schedule: { type: object }
                  next: { type: [number, "null"], description: "Unix epoch seconds." }

  /api/mcp:
    post:
      summary: Start or stop the MCP server
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [start, stop] }
      responses:
        "200":
          description: Result plus the MCP state (with ready-made client config).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { $ref: "#/components/schemas/I18nMessage" }
                  mcp: { $ref: "#/components/schemas/McpState" }

  /api/report:
    post:
      summary: Prefill a bug report
      description: |
        Purely local: anonymizes and shortens the supplied log, collects
        system details, and returns everything the page needs to open a
        GitHub issue form. The app itself sends nothing.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                log: { type: string, description: "Log text as shown (already translated)." }
                hint: { type: string, description: "One-line description." }
      responses:
        "200":
          description: The prefilled report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  system: { type: array, items: { type: object } }
                  log: { type: string }
                  title: { type: string }
                  url: { type: string }

  /api/ollama-recheck:
    post:
      summary: Re-probe Ollama, bypassing the cache
      responses:
        "200":
          description: The probe result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OllamaStatus" }

  /api/answer:
    post:
      summary: AI summary over the archive (streaming)
      description: |
        The only streaming route: NDJSON, one object per line — first the
        sources, then text chunks, finally `{"done": true}` (or an error
        chunk mid-stream). Needs a usable index and a running Ollama with
        the chat model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q: { type: string }
                person: { type: string }
                from: { type: string, format: date }
                to: { type: string, format: date }
                source: { type: string, default: all }
      responses:
        "200":
          description: NDJSON stream, or a plain JSON error object when the search found nothing.
          content:
            application/x-ndjson: {}
            application/json: {}
        "400":
          description: Empty question.
        "503":
          description: No usable index, or the chat model is not available.

  /api/update-check:
    post:
      summary: Check GitHub for a newer release (blocking)
      responses:
        "200":
          description: The check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: ["off", none, ok, error] }
                  current: { type: string }
                  latest: { type: [string, "null"] }
                  url: { type: [string, "null"] }
                  newer: { type: boolean }
                  ahead: { type: boolean }
                  error: { type: [string, "null"] }

  /api/quit:
    post:
      summary: Shut the app down
      responses:
        "200":
          description: Sent before the shutdown takes effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  # ---- search history, saved searches, cases (11.0) ------------------------
  /api/suche/historie:
    get:
      summary: The search history
      description: |
        Every search by its criteria, newest first – never its hits.
        Kept per the setting `search_history` (off, 30, 90, 365 days,
        forever); pruned at start and when the setting changes.
      responses:
        "200":
          description: Searches and the retention in force.
          content:
            application/json:
              schema:
                type: object
                properties:
                  searches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        wann: { type: string, format: date-time }
                        kriterien: { $ref: "#/components/schemas/Kriterien" }
                        treffer: { type: [integer, "null"] }
                  retention: { type: string, enum: [off, "30", "90", "365", forever] }

  /api/suche/historie-leeren:
    post:
      summary: Empty the search history
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /api/suche/gespeichert:
    get:
      summary: The saved searches
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  searches:
                    type: array
                    items: { $ref: "#/components/schemas/GespeicherteSuche" }

  /api/suche/speichern:
    post:
      summary: Save a search under a name
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                kriterien: { $ref: "#/components/schemas/Kriterien" }
                fall: { type: [integer, "null"], description: "Attach to this case (must be open)." }
                ordner: { type: [integer, "null"], description: "The folder of that case the search files into; its new hits land there. Null: unsorted." }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  search: { $ref: "#/components/schemas/GespeicherteSuche" }
        "400": { description: No name (srv.case.noname). }
        "404": { description: No such case (srv.case.unknown). }
        "409": { description: The case is closed (srv.case.closed). }

  /api/suche/umbenennen:
    post:
      summary: Rename a saved search
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                name: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { description: No such search (srv.search.unknown). }

  /api/suche/loeschen:
    post:
      summary: Delete a saved search
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /api/suche/anhaengen:
    post:
      summary: Attach a saved search to a case, or detach it
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                fall: { type: [integer, "null"], description: "The case; null detaches." }
                ordner: { type: [integer, "null"], description: "The folder of that case the search files into. Null: unsorted." }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { description: No such search or case. }
        "409": { description: The case is closed. }

  /api/faelle:
    get:
      summary: The cases
      description: Open cases first, most recently changed first; closed ones after.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases:
                    type: array
                    items: { $ref: "#/components/schemas/FallKurz" }
                  export_dir: { type: string, description: "Where exports land (setting case_export_dir, else Documents/Munimentum cases)." }

  /api/faelle/fall:
    get:
      summary: One case in full
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The case, or an in-band error (srv.case.unknown).
          content:
            application/json:
              schema:
                type: object
                properties:
                  case: { $ref: "#/components/schemas/Fall" }
                  error: { $ref: "#/components/schemas/I18nMessage" }

  /api/faelle/neu:
    get:
      summary: New hits for a case
      description: |
        Runs every saved search attached to the case (up to 500 hits each)
        and returns what the case does not hold yet – "new since". Nothing
        is added; the page offers that.
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  case:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  searches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        new: { type: array, items: { $ref: "#/components/schemas/Hit" }, description: "At most 200." }
                        new_count: { type: integer }
                        ordner: { type: [integer, "null"], description: "The folder the search files into – where the page adds the new ones." }
                        ordner_name: { type: [string, "null"] }
                        error: { $ref: "#/components/schemas/MessageOrKey" }
                  error: { $ref: "#/components/schemas/I18nMessage" }

  /api/faelle/anlegen:
    post:
      summary: Create a case
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                beschreibung: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  case: { $ref: "#/components/schemas/Fall" }
        "400": { description: No name (srv.case.noname). }

  /api/faelle/aendern:
    post:
      summary: Rename a case or change its description
      description: Fields act on presence; an open case only.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                name: { type: string }
                beschreibung: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "400": { description: Empty name. }
        "404": { description: No such case. }
        "409": { description: The case is closed. }

  /api/faelle/schliessen:
    post:
      summary: Close a case
      description: A closed case is read-only – it can still be searched in and exported; reopen it to change it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "404": { description: No such case. }
        "409": { description: Already closed. }

  /api/faelle/oeffnen:
    post:
      summary: Reopen a case
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "404": { description: No such case. }

  /api/faelle/loeschen:
    post:
      summary: Delete a case
      description: The case, its items, lists and notes; attached searches are detached, not deleted. Nothing in the archive is touched.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { description: No such case. }

  /api/faelle/hinzufuegen:
    post:
      summary: Add items to a case
      description: |
        Hits as the page has them (key, source, root, path, title, date,
        who) – the case keeps a pointer and what the hit said. An item
        already in the case is left as it is; one without a key is skipped.
        Items added here carry `quelle` "ui"; what Claude adds through MCP
        carries "mcp" and is marked "via MCP" on the item.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                ordner: { type: [integer, "null"], description: "The folder to file the items into. Null or absent: unsorted." }
                eintraege:
                  type: array
                  items:
                    type: object
                    properties:
                      key: { type: string }
                      src: { type: string }
                      root: { type: string }
                      rel: { type: string }
                      titel: { type: string }
                      datum: { type: string }
                      wer: { type: string }
                      bemerkung: { type: string, description: "A remark on why the item is in the case; kept only for items new to the case." }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  added: { type: integer }
                  already: { type: integer }
        "404": { description: No such case. }
        "409": { description: The case is closed. }

  /api/faelle/verschieben:
    post:
      summary: Move items of a case into a folder
      description: "The items named by key go into the folder (null: unsorted); keys the case does not hold are ignored."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                keys: { type: array, items: { type: string } }
                ordner: { type: [integer, "null"] }
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/OkFall" }
                  - type: object
                    properties:
                      moved: { type: integer }
        "404": { description: No such case or folder (srv.case.nofolder). }
        "409": { description: The case is closed. }

  /api/faelle/ordner-anlegen:
    post:
      summary: Make a folder in a case
      description: Folders are one level deep. The same name again answers the existing folder.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                name: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/OkFall" }
                  - type: object
                    properties:
                      ordner: { type: integer, description: "The folder's id." }
        "400": { description: No name (srv.case.noname). }
        "404": { description: No such case. }
        "409": { description: The case is closed. }

  /api/faelle/ordner-umbenennen:
    post:
      summary: Rename a folder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                ordner: { type: integer }
                name: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "400": { description: No name (srv.case.noname). }
        "404": { description: No such case or folder (srv.case.nofolder). }
        "409": { description: The case is closed, or the name is taken (srv.case.folder.exists). }

  /api/faelle/ordner-loeschen:
    post:
      summary: Remove a folder
      description: Its items, lists and searches stay in the case and become unsorted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                ordner: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "404": { description: No such case or folder (srv.case.nofolder). }
        "409": { description: The case is closed. }

  /api/faelle/bemerkung:
    post:
      summary: The remark on one item
      description: One or two sentences on why the item is in the case; empty text removes it. Shown under the item and exported with it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                key: { type: string }
                text: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "404": { description: No such case, or the case does not hold the item (srv.case.noitem). }
        "409": { description: The case is closed. }

  /api/faelle/thread:
    post:
      summary: The rest of the items' conversations into the case
      description: |
        For every key named: the other messages of its conversation (mail:
        the thread, Teams: the chat or channel) that the case lacks go into
        the folder the item sits in. Keys the case does not hold are
        ignored. Needs an index that knows conversations.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                keys: { type: array, items: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/OkFall" }
                  - type: object
                    properties:
                      added: { type: integer }
        "404": { description: No such case. }
        "409": { description: The case is closed, or the index knows no conversations (srv.case.nothread). }

  /api/faelle/entfernen:
    post:
      summary: Remove one item from a case
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                key: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "404": { description: No such case. }
        "409": { description: The case is closed. }

  /api/faelle/liste:
    post:
      summary: Store a result list in a case
      description: |
        Runs the search with the given criteria on the server – every
        page, up to 5000 hits – and stores the list as it stands now: the
        criteria, the moment, the count, and every hit as an item of the
        case (marked with the list). What the list found later is not the
        list; run the search again for that.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                kriterien: { $ref: "#/components/schemas/Kriterien" }
                ordner: { type: [integer, "null"], description: "The folder the list and its hits file into. Null or absent: unsorted." }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  liste: { type: integer }
                  hits: { type: integer }
                  added: { type: integer, description: "Hits new to the case." }
        "404": { description: No such case. }
        "409": { description: The case is closed, or the search failed (message says why). }

  /api/faelle/liste-loeschen:
    post:
      summary: Drop a stored result list
      description: The list goes, and with it the items it brought into the case – not those added by hand or by another list before it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                liste: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "404": { description: No such case. }
        "409": { description: The case is closed. }

  /api/faelle/notiz:
    post:
      summary: Add a casebook note
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                text: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer, description: "The note's id." }
        "400": { description: Empty note. }
        "404": { description: No such case. }
        "409": { description: The case is closed. }

  /api/faelle/notiz-aendern:
    post:
      summary: Change a casebook note
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                notiz: { type: integer }
                text: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "400": { description: Empty note. }
        "404": { description: No such case. }
        "409": { description: The case is closed. }

  /api/faelle/notiz-loeschen:
    post:
      summary: Delete a casebook note
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                notiz: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkFall" }
        "404": { description: No such case. }
        "409": { description: The case is closed. }

  /api/faelle/export:
    post:
      summary: Export a case (a run)
      description: |
        Started as a run of its own (case_export.py): one ZIP named
        `<case>_<date>.zip` below the export folder (setting
        `case_export_dir`, else Documents/Munimentum cases) with the
        originals of every item, copied out of the archive – under
        `<folder>/<source>/<path>` when the case has folders (the unsorted
        ones under "Unsorted"), else under `<source>/<path>` – plus
        index.html, items.csv and casebook.md. The ZIP is named before the
        run starts and answered here; the case remembers it as
        `exportiert` when the run is done. Nothing in the archive is
        touched; a closed case can be exported. Refused while a run is on.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { $ref: "#/components/schemas/MessageOrKey" }
                  path: { type: string, description: "The ZIP the run writes." }
        "400": { description: The export folder cannot be created (srv.case.exportdir). }
        "404": { description: No such case. }
        "409": { description: A run is on. }

  /api/faelle/export-ordner:
    post:
      summary: Show the case's last export in the file manager
      description: The folder holding the last export's ZIP, else the export folder itself. No process, answers at once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  path: { type: string }
                  message: { $ref: "#/components/schemas/MessageOrKey" }
        "404": { description: No export folder exists yet (srv.case.noexport). }
        "500": { description: The file manager could not be opened. }

components:
  schemas:
    I18nMessage:
      type: object
      description: A translatable message; the page renders lang[k] with v substituted.
      properties:
        k: { type: string }
        v: { type: object }
    MessageOrKey:
      description: Either a plain sentence or an i18n message object.
      oneOf:
        - { type: string }
        - { $ref: "#/components/schemas/I18nMessage" }
    Ok:
      type: object
      properties:
        ok: { type: boolean }
    OkMessage:
      type: object
      properties:
        ok: { type: boolean }
        message: { $ref: "#/components/schemas/MessageOrKey" }
    OkFall:
      type: object
      description: The changed case, in full.
      properties:
        ok: { type: boolean }
        case: { $ref: "#/components/schemas/Fall" }
    Bilanz:
      type: object
      description: |
        One source's completeness balance (completeness.py). The question
        it answers: would a run with today's settings fetch anything now
        that is not here yet? erwartet = da + offen + wartend; nothing the
        settings leave out counts towards it.
      properties:
        quelle: { type: string, description: "Source key, as in /api/analytics → pruefungen." }
        einheit: { type: string, description: "Unit of the counts: mails, events, contacts, conversations, files, pages, tasks (progress.unit.* text keys)." }
        geprueft: { type: string, format: date-time }
        stand: { type: string, enum: [ganz, teilweise, nicht], description: "Whether the check itself came through; teilweise names the units in `fehler`, nicht carries a `grund`." }
        grund: { type: [string, "null"], description: "Text key saying why the check could not run (stand = nicht)." }
        da: { type: integer, description: "Here and current, from the export's own bookkeeping." }
        offen: { type: integer, description: "Expected but not here: new since the last run, changed since, or failed then." }
        ausgeschlossen: { type: integer, description: "Deliberately left out by the settings – a count, never names." }
        ausgeschlossen_einheit: { type: string, description: "Unit of `ausgeschlossen` where it differs (calendars, lists, notebooks)." }
        behalten: { type: integer, description: "Gone at Microsoft, kept here." }
        wartend: { type: integer, description: "Mirrors only: files waiting for their folder cadence." }
        zeilen:
          type: array
          description: Only units with something open – a folder, calendar, board, list, notebook, site.
          items:
            type: object
            properties:
              pfad: { type: string }
              da: { type: integer }
              offen: { type: integer }
        fehler:
          type: array
          description: Units the check could not judge.
          items:
            type: object
            properties:
              pfad: { type: string }
              grund: { type: string, description: "A run.* or ana.check.reason.* text key." }
        bytes: { type: integer, description: "Mirrors only: bytes a run would hold." }
        bytes_ausgeschlossen: { type: integer, description: "Mirrors only." }
        typen: { type: array, description: "Mirrors only: files per extension (ext, n, bytes) inside the path scope, before type and size filters." }
    ProfileInfo:
      type: object
      properties:
        name: { type: string }
        aktiv: { type: boolean, description: "The profile this instance runs." }
        ordner: { type: string }
        konto: { type: [string, "null"], description: "Account of the stored access, if any." }
        last_run: { type: [string, "null"] }
        index: { type: boolean, description: "Whether an index exists." }
    ProfileState:
      type: object
      description: What every status poll carries about profiles.
      properties:
        name: { type: string }
        moeglich: { type: boolean, description: "False under --data-dir, and while an archive from before 10.0 has not moved into profiles/ yet: one archive, no profiles." }
        mehrere: { type: boolean }
    ProfileStatus:
      type: object
      properties:
        name: { type: string }
        moeglich: { type: boolean, description: "As in ProfileState." }
        mehrere: { type: boolean }
        ohne_nachfrage: { type: boolean }
        zuletzt: { type: [string, "null"], description: "The profile opened last, if it still exists." }
        alle: { type: array, items: { $ref: "#/components/schemas/ProfileInfo" } }
    TokenStatus:
      type: object
      properties:
        present: { type: boolean }
        valid: { type: boolean }
        expired: { type: boolean }
        readable: { type: boolean }
        account: { type: [string, "null"] }
        name: { type: [string, "null"] }
        expires_at: { type: [string, "null"] }
        expires_in_minutes: { type: [integer, "null"] }
        scopes: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
    OllamaStatus:
      type: object
      properties:
        running: { type: boolean }
        models: { type: array, items: { type: string } }
        has_model: { type: boolean }
        has_chat_model: { type: boolean }
        error: { type: [string, "null"] }
        model: { type: string }
        chat_model: { type: string }
        url: { type: string }
        disabled: { type: boolean }
    JobsState:
      type: object
      properties:
        busy: { type: boolean }
        job:
          type: [object, "null"]
          description: >-
            label, steps, step, index, progress, started, log_seq (the
            /api/log cursor before the run's first line – lines with a
            greater `n` belong to this run).
        last:
          type: [object, "null"]
          description: label, ok, detail, finished.
        token_expired: { type: boolean }
        seq: { type: integer, description: "Cursor for /api/log." }
    McpState:
      type: object
      properties:
        running: { type: boolean }
        port: { type: integer }
        url: { type: string }
        error:
          oneOf:
            - { $ref: "#/components/schemas/I18nMessage" }
            - { type: "null" }
        config: { type: object, description: "Ready-made client snippets (http and stdio)." }
    LogLine:
      type: object
      properties:
        n: { type: integer }
        level: { type: string, enum: [info, ok, warn, err, head] }
        t: { type: string, description: "HH:MM:SS" }
        text: { $ref: "#/components/schemas/MessageOrKey" }
    StoredLogLine:
      type: object
      properties:
        ts: { type: number, description: "Unix epoch seconds." }
        level: { type: string }
        text: { $ref: "#/components/schemas/MessageOrKey" }
    Hit:
      type: object
      properties:
        uid: { type: string }
        cid: { type: integer, description: "Index row id; input for /api/similar." }
        source: { type: string }
        source_label: { type: string }
        root: { type: string, description: "Input for /source." }
        who: { type: string }
        date: { type: string }
        title: { type: string }
        context: { type: string }
        path: { type: string, description: "Relative path; input for /source." }
        uri: { type: string }
        score: { type: [number, "null"] }
        thread: { type: [string, "null"], description: "Input for /api/thread." }
        attachments: { type: array, items: { type: string } }
        gone: { type: [string, "null"], description: "Tombstone date when the item vanished." }
        key: { type: [string, "null"], description: "The item's stable key (schluessel.py): what a case remembers it by. Null in an index built before 11.0." }
        who_mail: { type: [string, "null"], description: "The sender's address (mail) or the organiser's (appointments), lower-case; null for other sources and in an index built before 11.1." }
        domains: { type: array, items: { type: string }, description: "The mail domains of every party (sender and recipients, organiser and attendees); the page marks the hit external when one lies outside the internal domains. Empty for other sources." }
        cases:
          type: array
          description: The cases the item already sits in – the mark on the hit.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              ordner: { type: [string, "null"], description: "The name of the folder it sits in, if any." }
              status: { type: string, enum: [offen, zu] }
        preview: { type: string }
    Kriterien:
      type: object
      description: |
        The criteria of one search – what the history, a saved search and
        a stored result list keep (faelle.kriterien). Never any hit.
      properties:
        q: { type: string }
        mode: { type: string, enum: [text, aehnlich, ki] }
        person: { type: string }
        source: { type: string }
        from: { type: string }
        to: { type: string }
        folder: { type: string }
        filetype: { type: string }
        gone: { type: boolean }
        fall: { type: [integer, "null"], description: "The \"Cases\" filter: a case id." }
        ordner: { type: [integer, "null"], description: "With `fall`: one folder of that case." }
        party: { type: string, enum: [all, internal, external], description: "The parties filter, see /api/search." }
    GespeicherteSuche:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kriterien: { $ref: "#/components/schemas/Kriterien" }
        angelegt: { type: string, format: date-time }
        zuletzt: { type: [string, "null"], format: date-time, description: "When it last ran." }
        treffer: { type: [integer, "null"], description: "Hits then." }
        fall: { type: [integer, "null"], description: "The case it is attached to." }
        fall_name: { type: [string, "null"] }
        ordner: { type: [integer, "null"], description: "The folder of that case it files into; null: unsorted." }
        ordner_name: { type: [string, "null"] }
    FallKurz:
      type: object
      description: One case as the list shows it – counts, no contents.
      properties:
        id: { type: integer }
        name: { type: string }
        beschreibung: { type: string }
        status: { type: string, enum: [offen, zu] }
        angelegt: { type: string, format: date-time }
        geaendert: { type: string, format: date-time }
        geschlossen: { type: [string, "null"], format: date-time }
        exportiert: { type: [string, "null"], description: "The ZIP of the last export." }
        exportiert_wann: { type: [string, "null"], format: date-time }
        eintraege: { type: integer, description: "Items in the case." }
        je_quelle: { type: object, additionalProperties: { type: integer }, description: "Items per source (src key)." }
        listen: { type: integer }
        notizen: { type: integer }
        suchen: { type: integer, description: "Saved searches attached." }
        ordner: { type: integer, description: "Folders in the case." }
        ordner_liste:
          type: array
          description: The folders, in the order they were made.
          items: { $ref: "#/components/schemas/Ordner" }
    Ordner:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        angelegt: { type: string, format: date-time }
        anzahl: { type: integer, description: "Items in the folder." }
    Fall:
      allOf:
        - { $ref: "#/components/schemas/FallKurz" }
        - type: object
          properties:
            eintraege_liste:
              type: array
              items: { $ref: "#/components/schemas/Eintrag" }
            listen_liste:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  wann: { type: string, format: date-time }
                  kriterien: { $ref: "#/components/schemas/Kriterien" }
                  anzahl: { type: integer, description: "Hits when the list was taken." }
                  ordner: { type: [integer, "null"], description: "The folder the list filed into." }
            notizen_liste:
              type: array
              description: The casebook, newest first.
              items:
                type: object
                properties:
                  id: { type: integer }
                  wann: { type: string, format: date-time }
                  text: { type: string }
                  quelle: { type: string, enum: [ui, mcp], description: "Who wrote it: the page, or Claude through MCP." }
            suchen_liste:
              type: array
              items: { $ref: "#/components/schemas/GespeicherteSuche" }
    Eintrag:
      type: object
      description: One item of a case – a pointer into the archive, with what the hit said at the time.
      properties:
        id: { type: integer }
        key: { type: string }
        src: { type: string }
        root: { type: string }
        rel: { type: string }
        titel: { type: [string, "null"] }
        datum: { type: [string, "null"] }
        wer: { type: [string, "null"] }
        hinzugefuegt: { type: string, format: date-time }
        liste: { type: [integer, "null"], description: "The result list it came with, if any." }
        ordner: { type: [integer, "null"], description: "The folder it sits in; null: unsorted." }
        quelle: { type: string, enum: [ui, mcp], description: "Who added it: the page, or Claude through MCP." }
        bemerkung: { type: string, description: "The remark on the item – why it is in the case; empty when none." }
        thread_offen: { type: integer, description: "Messages of the item's conversation the case lacks; 0 when there is no conversation or the index knows none. Set on /api/faelle/fall and on every write's answer." }
        wer_mail: { type: string, description: "The address behind `wer` where the index has one (mail: the sender, appointments: the organiser); empty otherwise. Set like thread_offen." }
    Run:
      type: object
      properties:
        id: { type: integer }
        started_at: { type: number }
        finished_at: { type: [number, "null"] }
        job_type: { type: string }
        origin: { type: string }
        result: { type: [string, "null"] }
        elements: { type: [object, "null"] }
        semantic: { type: [integer, "null"] }
        workers: { type: [integer, "null"] }
        app_version: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              started_at: { type: number }
              duration_s: { type: [number, "null"] }
              new: { type: [integer, "null"] }
              unchanged: { type: [integer, "null"] }
              excluded: { type: [integer, "null"] }
              errors: { type: [integer, "null"] }
              skipped: { type: integer }
              ok: { type: [integer, "null"] }
              extra: { type: [string, "null"] }
    Analytics:
      type: object
      properties:
        built_at: { type: [string, "null"] }
        exists: { type: boolean }
        quellen: { type: array, items: { type: object } }
        komm:
          type: object
          description: nachrichten, gespraeche, mit_anhang, verschwunden, personen, von, bis (null = index too old to know).
        dateien:
          type: object
          description: n, pages, onedrive, sharepoint, teams, verschwunden.
        planner: { type: object }
        todo: { type: object }
        onenote: { type: object }
        verlauf: { type: array, description: "Message counts over time (mail and chat only)." }
        luecken: { type: array, description: "Months with no message at all." }
        anhang_typen: { type: [array, "null"] }
        datei_typen: { type: [array, "null"] }
        top_personen: { type: array }
        groesse: { type: object, description: "Bytes per source and for the index." }
        grosse_dateien: { type: array }
        pruefungen:
          type: object
          description: |
            The completeness balance per source, keyed by source
            (outlook_mail, outlook_calendar, outlook_contacts, teams,
            onedrive, sharepoint, sharepoint_pages, planner, todo,
            onenote): `bericht` is the last balance its check wrote (null
            before the first check), `genutzt` whether the source is in
            use – the page draws a row for a used source even without a
            report, and none for an unused one.
          additionalProperties:
            type: object
            properties:
              bericht: { anyOf: [{ $ref: "#/components/schemas/Bilanz" }, { type: "null" }] }
              genutzt: { type: boolean }
        archiv:
          type: [object, "null"]
          description: |
            The last inward check, null before the first: `geprueft`,
            `quellen` (one entry per export folder: quelle, stand, grund,
            stimmig, fehlt, fremd, unvollstaendig, verloren – all files –,
            `zeilen` with the units that have findings, `fehler`) and
            `index` (stand, grund, geaendert, neu, weg, gebaut – files
            changed, new or gone since the index last read them). Each
            source entry also carries `befunde` (kind -> the files behind
            the numbers, capped at 5000 per kind – `gekappt` says so) and
            `beiseite`, how many files an earlier "set aside" holds.
