openapi: 3.2.0
# Where this document answers – the base every reference resolves against.
$self: /api/v1/openapi
info:
  title: Munimentum HTTP API
  version: 13.4.2
  license: { name: Apache-2.0, identifier: Apache-2.0 }
  contact: { name: Munimentum on GitHub, url: https://github.com/n-schilling/munimentum }
  description: |
    The API between the Munimentum page and its backend, on `127.0.0.1`
    only. There is **no authentication**: whatever runs on this machine and
    sends a correct `Host` header reads the whole archive; another `Host`
    is `403` (DNS-rebinding guard).

    Everything lives under **`/api/v1`**: resources, the method says what
    happens, a collection is always `items`, a successful answer carries
    neither `ok` nor `error`. Names are English except where a name *is*
    the data – the source keys (`outlook`, `kalender`, `datei` …) and the
    archive's bookkeeping (`Bestand`, `Bilanz`, `Analytics`, folder plan).

    **Every refusal has one shape**: a problem detail (RFC 9457) as
    `application/problem+json`, plus `ok: false` and `error` carrying the
    text key `k` with its placeholders `v`; `detail` is always English.
    `400` the request, `403` the `Host`, `404` what is not there, `409` a
    state that says no, `503` no index (with `Retry-After`), `500` a bug.

    **Three reads ask with `QUERY`** (RFC 10008) – the model's answer, a
    source's folder plan, a report. Safe and repeatable, and there the
    body *is* the question: without content and `Content-Type` it is
    `400`. Such a route names `Accept-Query` beside `Allow`.

    * JSON in, JSON out: not `application/json` is `415`, not an object
      `400`, above 4 MB `413`; an absent body is fine except on `QUERY`.
    * `PATCH` merges the fields a body names and leaves the rest; the same
      field written twice is last-writer-wins. A case answers an `ETag`
      (weak, RFC 9110) that `If-None-Match` turns into a `304`; every
      write under `/cases` answers the whole case, or with `Prefer:
      return=minimal` (RFC 7240) the status, `Location` and `ETag` alone.
    * `OPTIONS` answers `Allow` everywhere, a wrong method `405` with it,
      `HEAD` every `GET`. No CORS – one origin, the app's own page.
    * **Capped lists, not pages**: only `/api/v1/search` pages (`limit`,
      `offset`, `has_more`); the others stop at `limit`, answer it back
      and set `has_more`. Narrow them with `contains` or `source`.
    * Two tags: the door (`kind: nav`) first – what a generator names a
      client after – then the method (`kind: badge`). `x-needs-index`
      marks what needs an index, `x-starts-run` what starts a run.
    * `X-Munimentum-Version` names the program, `X-Munimentum-Api` the
      contract. **`v1` becomes `v2`** when an operation disappears,
      changes its method or loses a field – never for an addition.

    Served by `GET /api/v1/openapi`; it changes in the same commit as the API.
externalDocs:
  description: The README – what the app does, and where the data goes.
  url: https://github.com/n-schilling/munimentum#readme
servers:
  - url: http://127.0.0.1:{port}
    description: The app's port – 8700 by default; it tries the next twelve when that one is taken, and a second profile started alongside takes the next free one.
    variables:
      port: { default: "8700" }
security: []
tags:
  - name: Archive
    kind: nav
    description: Building the archive and judging it – runs, the schedule, the completeness balance, the archive check, Insights.
  - name: Explore
    kind: nav
    description: Getting data out – the search, a hit's detail, calendar, contacts, files, the history and the saved searches.
  - name: Cases
    kind: nav
    description: What someone keeps around one matter – cases, folders, items, notes, stored lists, exports.
  - name: App
    kind: nav
    description: State, access, settings, profiles and the app itself.
  # Every operation carries its method as a tag as well: one list per verb,
  # for tools that group by what a call does rather than where it belongs.
  - name: GET
    kind: badge
    description: Reads – safe and repeatable.
  - name: QUERY
    kind: badge
    description: Reads whose question travels in the body (RFC 10008) – safe and repeatable like GET, and they change nothing. A viewer older than OpenAPI 3.2 lists this tag empty, because it cannot see a `query` operation.
  - name: POST
    kind: badge
    description: Writes that create something or start something.
  - name: PATCH
    kind: badge
    description: Writes that change the fields a body names, nothing else.
  - name: PUT
    kind: badge
    description: Writes that put a whole thing in place of what was there.
  - name: DELETE
    kind: badge
    description: Removals; they answer 204 without a body.

paths:
  /:
    get:
      tags: [App, GET]
      operationId: page
      summary: The single-page interface
      description: |
        The whole UI as one HTML page, with the language strings and the
        step metadata from the registry injected server-side. `/index.html`
        is an alias. Language is negotiated from the configuration and the
        request's `Accept-Language` header.
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/cases:
    get:
      tags: [Cases, GET]
      operationId: v1ListCases
      summary: Every case
      description: Every case with its counts – the lists themselves come with one case.
      responses:
        "200":
          description: The cases, open ones first, the most recently changed at the top.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Case" } }
              example:
                items:
                - id: 3
                  name: Nordwind
                  status: open
                  items: 128
                  notes: 4
                  folders: 2
                  lists: 1
                  created: '2026-02-11T14:03:00'
                  changed: '2026-03-04T09:20:00'
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Cases, POST]
      operationId: v1CreateCase
      summary: Open a case
      description: |
        A case is a name and, if you like, a description – nothing else is
        needed to start one. What it collects comes later, and nothing is
        copied: a case points into the archive.
      parameters:
        - { $ref: "#/components/parameters/Prefer" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
            example: { name: Nordwind, description: Everything about the offer }
      responses:
        "201":
          description: The case; `Location` names where it lives.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
            Location: { description: The new case's path., schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/Case" }
              example:
                case:
                  id: 3
                  name: Nordwind
                  description: Alles zum Vertrag mit der Nordwind GmbH
                  status: open
                  items: 0
                  item_list: []
                  folder_list: []
                  note_list: []
                  list_list: []
        "400":
          description: No name (srv.case.noname).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/cases/{id}:
    get:
      tags: [Cases, GET]
      operationId: v1GetCase
      summary: One case in full
      description: |
        The case with everything that hangs on it: its items, folders, notes
        and stored lists, and what the index knows about those items today –
        whether a conversation is complete, who wrote.
      parameters:
        - $ref: "#/components/parameters/CaseIdPath"
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: The case with its items, folders, notes and attached searches.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/Case" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404":
          description: No such case (srv.case.unknown) – as is an id that is not a number.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Cases, PATCH]
      operationId: v1UpdateCase
      summary: Change a case
      description: |
        The fields the body names, nothing else. `status` opens and closes
        the case: `closed` closes it, `open` opens it again. A status that
        is already the case's changes nothing and is no error.
      parameters:
        - { $ref: "#/components/parameters/Prefer" }
        - $ref: "#/components/parameters/CaseIdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                status: { type: string, enum: [open, closed] }
            example: { status: closed }
      responses:
        "200":
          description: The case as it is now.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/Case" }
        "400":
          description: Empty name (srv.case.noname), or a status that is neither (srv.case.badstatus).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No such case (srv.case.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: The case is closed – reopen it first (srv.case.closed).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Cases, DELETE]
      operationId: v1DeleteCase
      summary: Drop a case
      description: The case and what it remembers; nothing in the archive is touched.
      parameters:
        - $ref: "#/components/parameters/CaseIdPath"
      responses:
        "204":
          description: Gone.
        "404":
          description: No such case (srv.case.unknown).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/cases/{id}/items:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Cases, GET]
      operationId: v1ListCaseItems
      summary: What the case holds
      description: |
        Every item in the case, the way the case lists them. The page reads
        them from the case it gets back after a write; a script that holds
        only an id reads them here.
      responses:
        "200":
          description: The items, newest source first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CaseItem" } }
        "404": { $ref: "#/components/responses/NoCase" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Cases, POST]
      operationId: v1AddCaseItems
      summary: Put items into the case
      description: |
        `items` are the rows themselves – what a hit carries: `key`, `src`,
        `root`, `rel` and what the hit said (`title`, `date`, `who`). A case
        points at the archive; it copies nothing.

        `threads` names items the case already holds whose conversations
        should be completed: every message of them that is missing follows,
        into the folder its item sits in. Both may stand in one body.
        `201` when something was added, `200` when everything was there.
      parameters:
        - { $ref: "#/components/parameters/Prefer" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/CaseItemIn" } }
                threads: { type: array, items: { type: string }, description: "Item keys whose conversation should be completed." }
                folder: { type: [integer, "null"], description: "Into this folder of the case. Null: unsorted." }
            example:
              items: [{ key: "mail:<m1@example.com>", src: outlook, root: outlook, rel: "inbox/mail1.eml", title: "Rechnung 4711", date: "2026-03-04", who: "Alice Beispiel" }]
              folder: 3
      responses:
        "201":
          description: What was added, and the case as it now is.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseWrite" }
        "200":
          description: Nothing new – every item was already there.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseWrite" }
        "400":
          description: Neither items nor threads – rows without a key are no items (srv.case.noitems).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404": { $ref: "#/components/responses/NoCase" }
        "409":
          description: The case is closed (srv.case.closed), or the index knows no conversations (srv.case.nothread). Both are decided before the first write – the case stays as it was.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Cases, PATCH]
      operationId: v1MoveCaseItems
      summary: Move several items into one folder
      description: The bulk form of the single item's `folder` – what a selection in the case does.
      parameters:
        - { $ref: "#/components/parameters/Prefer" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, items: { type: string } }
                folder: { type: [integer, "null"], description: "Null: unsorted." }
      responses:
        "200":
          description: How many moved, and the case.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseWrite" }
        "400":
          description: No keys (srv.case.noitems).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404": { $ref: "#/components/responses/NoCase" }
        "409":
          description: The case is closed (srv.case.closed).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/cases/{id}/items/{item}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: item, in: path, required: true, schema: { type: integer }, description: "The item's id, as the case names it." }
    get:
      tags: [Cases, GET]
      operationId: v1CaseItem
      summary: One item of a case
      description: |
        The row the collection answers, on its own – what `Location`
        named when the item went into the case.
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: "#/components/schemas/CaseItem" }
        "404":
          description: No such case, or the case does not hold that item (srv.case.unknown, srv.case.noitem).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Cases, PATCH]
      operationId: v1UpdateCaseItem
      summary: The remark on an item, or its folder
      description: |
        Both fields act on presence: `remark` sets or clears the note on why
        this item is here, `folder` moves it (`null` takes it out of its
        folder). The body is read whole before anything is written, so a
        `folder` that is neither an id nor `null` changes nothing at all.
        The whole case comes back.
      parameters:
        - { $ref: "#/components/parameters/Prefer" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remark: { type: string, description: "Why the item is here. Empty removes it." }
                folder: { type: [integer, "null"] }
      responses:
        "200":
          description: The case as it now is.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseWrite" }
        "400":
          description: A `folder` that is neither an id nor null (srv.case.badfolder).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404":
          description: No such case (srv.case.unknown) or item (srv.case.noitem).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: The case is closed (srv.case.closed).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Cases, DELETE]
      operationId: v1RemoveCaseItem
      summary: Take an item out of the case
      description: Out of the case only – the archive keeps it.
      parameters:
        - { $ref: "#/components/parameters/Prefer" }
      responses:
        "200":
          description: The case as it now is.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseWrite" }
        "404":
          description: No such case (srv.case.unknown) or item (srv.case.noitem).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "409":
          description: The case is closed (srv.case.closed).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/cases/{id}/folders:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Cases, GET]
      operationId: v1ListCaseFolders
      summary: The folders inside the case
      description: |
        The folders of this case, one level deep, each with the number of
        items in it.
      responses:
        "200":
          description: The folders, with how many items each holds.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CaseFolder" } }
        "404": { $ref: "#/components/responses/NoCase" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Cases, POST]
      operationId: v1AddCaseFolder
      summary: A folder in the case
      description: |
        One level deep, and the name has to be free in this case. Items go
        into it when they are added, or with a PATCH afterwards.
      parameters:
        - { $ref: "#/components/parameters/Prefer" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: The new folder's id, and the case.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseWrite" }
        "400":
          description: No name (srv.case.noname).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "404": { $ref: "#/components/responses/NoCase" }
        "409":
          description: A folder of that name is already there (srv.case.folder.exists), or the case is closed.
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/cases/{id}/folders/{folder}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: folder, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Cases, GET]
      operationId: v1CaseFolder
      summary: One folder of a case
      description: |
        The folder as the collection lists it, with the number of
        items it holds.
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema:
                type: object
                required: [folder]
                properties:
                  folder: { $ref: "#/components/schemas/CaseFolder" }
        "404":
          description: No such case or folder (srv.case.unknown, srv.case.nofolder).
          content:
            application/problem+json:
              $ref: "#/components/mediaTypes/Problem"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Cases, PATCH]
      operationId: v1RenameCaseFolder
      summary: Rename a folder
      description: |
        The name has to be free in this case; the items stay where they are.
      parameters:
        - { $ref: "#/components/parameters/Prefer" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The case as it now is.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Preference-Applied: { $ref: "#/components/headers/PreferenceApplied" }
          content:
            application/json:
