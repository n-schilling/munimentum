              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -- The versioned surface: resources, real methods, English names -------
  # Everything under /api/v1 answers `X-Munimentum-Api: v1`; a second
  # contract would live beside it, not replace it.
  /api/v1/cases:
    get:
      tags: [Cases]
      operationId: v1ListCases
      summary: Every case
      description: The same cases as `/api/faelle`, as resources and in English (rest.py).
      responses:
        "200":
          description: The cases, open ones first, the most recently changed at the top.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Case" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Cases]
      operationId: v1CreateCase
      summary: Open a case
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
            example: { name: Nordwind, description: Everything about the offer }
      responses:
        "201":
          description: The case; `Location` names where it lives.
          headers:
            Location: { description: The new case's path., schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/Case" }
        "400":
          description: No name (srv.case.noname).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/cases/{id}:
    get:
      tags: [Cases]
      operationId: v1GetCase
      summary: One case in full
      parameters:
        - $ref: "#/components/parameters/CaseIdPfad"
      responses:
        "200":
          description: The case with its items, folders, notes and attached searches.
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/Case" }
        "404":
          description: No such case (srv.case.unknown) – as is an id that is not a number.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Cases]
      operationId: v1UpdateCase
      summary: Change a case
      description: |
        The fields the body names, nothing else. `status` opens and closes
        the case – what `/api/faelle/schliessen` and `/api/faelle/oeffnen`
        do under their own names.
      parameters:
        - $ref: "#/components/parameters/CaseIdPfad"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                status: { type: string, enum: [open, closed] }
            example: { status: closed }
      responses:
        "200":
          description: The case as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/Case" }
        "400":
          description: Empty name (srv.case.noname), or a status that is neither (srv.case.badstatus).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such case (srv.case.unknown).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The case is closed – reopen it first (srv.case.closed).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Cases]
      operationId: v1DeleteCase
      summary: Drop a case
      description: The case and what it remembers; nothing in the archive is touched.
      parameters:
        - $ref: "#/components/parameters/CaseIdPfad"
      responses:
        "204":
          description: Gone.
        "404":
          description: No such case (srv.case.unknown).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/search:
    get:
      tags: [Explore]
      operationId: v1Search
      x-needs-index: true
      summary: Search the archive
      description: |
        The same engine and the same filters as `/api/search`, paged the
        way the rest of the API pages: `limit` and `offset`. There is no
        total – it would mean ranking the whole archive – so `has_more`
        says whether another page follows.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Query text; empty browses by filter alone." }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: person, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/SourceFilter" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: folder, in: query, schema: { type: string } }
        - { name: filetype, in: query, schema: { type: string } }
        - { name: case, in: query, schema: { type: integer } }
        - { name: case_folder, in: query, schema: { type: integer } }
        - { name: party, in: query, schema: { type: string, enum: [all, internal, external] } }
        - { name: gone, in: query, schema: { type: string }, description: "1/true/ja: only tombstoned items." }
        - { name: mode, in: query, schema: { type: string, default: auto, enum: [auto, hybrid, semantic, lexical] } }
        - { name: remember, in: query, schema: { type: string }, description: "1/true/yes/ja: file this search in the search history (criteria only, never hits) and, with `saved`, stamp that saved search as run. Off unless asked for – the history is the page's, and a script paging through the archive has no business filling it. The page asks for it." }
        - { name: saved, in: query, schema: { type: integer }, description: "Id of the saved search being run; counts only together with `remember`." }
      responses:
        "200":
          description: One page of hits.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                  limit: { type: integer }
                  offset: { type: integer }
                  has_more: { type: boolean, description: "Whether a page follows – the engine is asked for one hit more than the page holds." }
                  backend: { type: string, description: "bm25, semantic or hybrid – what actually ranked." }
                  semantic: { type: boolean }
        "400":
          description: A limit or offset that is not a number (srv.badparam).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The index cannot answer this search.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }


  /api/v1/files:
    get:
      tags: [Explore]
      operationId: v1BrowseFiles
      x-needs-index: true
      summary: Browse the mirrored drives
      description: One level of the tree; without `root` the sources themselves. Sizes come from disk.
      parameters:
        - { name: root, in: query, schema: { $ref: "#/components/schemas/Root" }, description: "Empty: the list of mirrors." }
        - { name: path, in: query, schema: { type: string }, description: "Folder inside that mirror, as this route returns it." }
      responses:
        "200":
          description: The mirrors, or one folder with its subfolders and files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roots: { type: array, items: { type: object }, description: "Only without `root`." }
                  root: { $ref: "#/components/schemas/Root" }
                  path: { type: string }
                  dirs: { type: array, items: { type: string } }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        rel: { type: string }
                        date: { type: string }
                        gone: { type: [string, "null"] }
                        size: { type: [integer, "null"] }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

