          description: No such case (srv.case.unknown).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No index loaded (srv.noindex).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
